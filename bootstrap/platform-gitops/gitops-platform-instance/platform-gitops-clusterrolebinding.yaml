kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: platform-gitops-controller
subjects:
  - kind: ServiceAccount
    name: platform-gitops-argocd-application-controller
    namespace: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-gitops
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: platform-gitops-server
subjects:
  - kind: ServiceAccount
    name: platform-gitops-argocd-server
    namespace: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-gitops
