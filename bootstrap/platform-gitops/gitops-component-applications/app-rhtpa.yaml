apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhtpa
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://github.com/rhpds/lightwell-tssc-workshop.git
    targetRevision: main
    path: automation/gitops/components/rhtpa
    helm:
      releaseName: rhtpa
      valuesObject:
        deployer:
          domain: apps.cluster-6rlfs.dyn.redhatworkshops.io

        rhtpa:
          namespace: trusted-profile-analyzer
          name: trustedprofileanalyzer

  destination:
    server: https://kubernetes.default.svc
    namespace: trusted-profile-analyzer

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
