kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: application-gitops-controller
subjects:
  - kind: ServiceAccount
    name: app-gitops-argocd-application-controller
    namespace: application-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: application-gitops
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: application-gitops-server
subjects:
  - kind: ServiceAccount
    name: app-gitops-argocd-server
    namespace: application-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: application-gitops
