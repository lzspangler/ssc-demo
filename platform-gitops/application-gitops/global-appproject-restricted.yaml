apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: global-restricted
  namespace: application-gitops
spec:
  sourceRepos:
    - '!*'
  destinations:
    - server: '!*'
      namespace: '!*'
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
