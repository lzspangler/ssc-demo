apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.openshift.io/runtime: generic
    pipelines.openshift.io/strategy: docker
    pipelines.openshift.io/used-by: build-cloud
  name: maven-build-ci
spec:
  finally:
    - name: show-sbom
      params:
        - name: IMAGE_URL
          value: $(tasks.build-container.results.IMAGE_URL)
      taskRef:
        name: show-sbom-rhdh
    - name: show-summary
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: $(tasks.clone-repository.results.url)?rev=$(tasks.clone-repository.results.commit)
        - name: image-url
          value: $(params.output-image)
        - name: build-task-status
          value: $(tasks.build-container.status)
      taskRef:
        name: summary
      workspaces:
        - name: workspace
          workspace: workspace
  params:
    - description: Name of the software component
      name: component-name
      type: string
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Force rebuild image
      name: rebuild
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
    - default: rox-api-token
      name: stackrox-secret
      type: string
    - default: gitops-auth-secret
      description: 'Secret name to enable this pipeline to update the gitops repo with the new image. '
      name: gitops-auth-secret-name
      type: string
    - default: push
      description: Event that triggered the pipeline run, e.g. push, pull_request
      name: event-type
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    - name: trustification-secret-name
      default: tpa-secret
      type: string
    - name: fail-if-trustification-not-configured
      default: 'true'
      type: string
    - name: sboms-dir
      default: sboms
      type: string
    - name: certificate-identity
      type: string
      default: userX@demo.redhat.com
    - name: oidc-issuer
      type: string
      default: https://sso.<domain>/realms/trusted-artifact-signer
    - name: rekor-url
      type: string
      default: http://rekor-server.tssc-tas.svc
    - name: tuf-mirror
      type: string
      default: http://tuf.tssc-tas.svc
    - name: verify-commit
      type: string
      default: 'false'
    # ---------------- AI remediation branch ----------------
    - name: enable-ai-remediation
      type: string
      description: Set to "true" to run the AI test-gen + vulnerability remediation + PR branch.
      default: 'false'
    - name: subdirectory
      type: string
      description: Project subdirectory within the source workspace (where pom.xml lives).
      default: source
    - name: git-host
      type: string
      description: SCM host for opening the PR/MR, e.g. gitlab-gitlab.apps.cluster.example.com
      default: ""
    - name: scm-provider
      type: string
      description: gitlab | github
      default: gitlab
    - name: base-branch
      type: string
      default: master
    - name: scm-secret-name
      type: string
      default: scm-auth-secret
    - name: ai-remediation-policy
      type: string
      description: User-defined CVE-prioritization policy passed to the AI selector.
      default: >-
        Prefer CRITICAL/HIGH severity CVEs that have a vendor-recommended fixed
        version. Avoid major-version bumps unless required to obtain the fix.
        Never select a CVE without a concrete fixed version. Prefer changes that
        touch a single dependency.
    - name: conforma-policy-configuration
      type: string
      description: Conforma/EC policy source; empty uses the severity-based fallback.
      default: ""
    - name: agent-image
      type: string
      description: >-
        AI coding-agent runtime image (JDK17 + Maven + the agent CLI). Use the
        flavor matching AI_AGENT: ai-agent-maven-claude for claude-code (default),
        ai-agent-maven-aider for aider.
      default: quay.io/REPLACE_ME/ai-agent-maven-claude:v1.0.0
    - name: ai-python-image
      type: string
      description: Image with the Anthropic Python SDK for the CVE selector.
      default: quay.io/REPLACE_ME/ai-python:v1.0.0
  results:
    - name: IMAGE_URL
      value: $(tasks.build-container.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-container.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    - name: REMEDIATION_PR_URL
      value: $(tasks.open-pr.results.PR_URL)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
      taskRef:
        name: init
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      runAfter:
        - init
      taskRef:
        name: git-clone
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    - name: verify-commit
      params:
      - name: certificate-identity
        value: $(params.certificate-identity)
      - name: oidc-issuer
        value: $(params.oidc-issuer)
      - name: rekor-url
        value: $(params.rekor-url)
      - name: tuf-mirror
        value: $(params.tuf-mirror)
      runAfter:
        - clone-repository
      taskRef:
        kind: Task
        name: verify-commit
      workspaces:
        - name: repository
          workspace: workspace
      when:
        - input: "$(params.verify-commit)"
          operator: in
          values: ["true"]
    - name: package
      params:
      - name: SUBDIRECTORY
        value: $(params.subdirectory)
      runAfter:
        - verify-commit
      taskRef:
        name: maven
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings
    - name: build-container
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SBOMS_DIR
          value: $(params.sboms-dir)
      runAfter:
        - package
      taskRef:
        name: buildah-rhtap
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
      workspaces:
        - name: source
          workspace: workspace
    - name: upload-sboms-to-trustification
      params:
      - name: COMPONENT_NAME
        value: $(params.component-name)
      - name: SBOMS_DIR
        value: $(params.sboms-dir)
      - name: TRUSTIFICATION_SECRET_NAME
        value: $(params.trustification-secret-name)
      - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
        value: $(params.fail-if-trustification-not-configured)
      runAfter:
      - build-container
      taskRef:
        name: upload-sbom-to-trustification
      workspaces:
      - name: sboms
        workspace: workspace
    - name: rhtpa-vulnerability-analysis
      runAfter:
        - upload-sboms-to-trustification
      taskRef:
        name: rhtpa-vulnerability-analysis
      params:
        - name: COMPONENT_NAME
          value: $(params.component-name)
        - name: SBOMS_DIR
          value: $(params.sboms-dir)
        - name: TRUSTIFICATION_SECRET_NAME
          value: $(params.trustification-secret-name)
        - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
          value: $(params.fail-if-trustification-not-configured)
      workspaces:
        - name: workspace
          workspace: workspace
    - name: rhtpa-remediation-report
      runAfter:
        - rhtpa-vulnerability-analysis
      taskRef:
        name: rhtpa-remediation-report
      params:
        - name: COMPONENT_NAME
          value: $(params.component-name)
        - name: SBOMS_DIR
          value: $(params.sboms-dir)
        - name: TRUSTIFICATION_SECRET_NAME
          value: $(params.trustification-secret-name)
        - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
          value: $(params.fail-if-trustification-not-configured)
      workspaces:
        - name: workspace
          workspace: workspace

    # ==================== AI remediation branch (gated) ====================
    # Runs in parallel with the build/scan chain off clone-repository.
    - name: ai-generate-tests
      runAfter:
        - clone-repository
      taskRef:
        name: ai-generate-tests
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: AGENT_IMAGE
          value: $(params.agent-image)
      workspaces:
        - name: source
          workspace: workspace

    - name: conforma-policy-check
      runAfter:
        - rhtpa-remediation-report
      taskRef:
        name: conforma-policy-check
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
      params:
        - name: VULNERABILITY_REPORT_PATH
          value: $(tasks.rhtpa-vulnerability-analysis.results.VULNERABILITY_REPORT)
        - name: REMEDIATION_REPORT_PATH
          value: $(tasks.rhtpa-remediation-report.results.REMEDIATION_REPORT)
        - name: SBOMS_DIR
          value: $(params.sboms-dir)
        - name: POLICY_CONFIGURATION
          value: $(params.conforma-policy-configuration)
      workspaces:
        - name: workspace
          workspace: workspace

    - name: ai-select-cve
      runAfter:
        - conforma-policy-check
      taskRef:
        name: ai-select-cve
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
      params:
        - name: VULNERABILITY_REPORT_PATH
          value: $(tasks.rhtpa-vulnerability-analysis.results.VULNERABILITY_REPORT)
        - name: REMEDIATION_REPORT_PATH
          value: $(tasks.rhtpa-remediation-report.results.REMEDIATION_REPORT)
        - name: MUST_FIX_PATH
          value: $(tasks.conforma-policy-check.results.MUST_FIX_PATH)
        - name: POLICY_CONTEXT
          value: $(params.ai-remediation-policy)
        - name: AI_PYTHON_IMAGE
          value: $(params.ai-python-image)
      workspaces:
        - name: workspace
          workspace: workspace

    - name: ai-remediate-dependency
      runAfter:
        - ai-select-cve
        - ai-generate-tests
      taskRef:
        name: ai-remediate-dependency
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
        - input: $(tasks.ai-select-cve.results.SELECTED)
          operator: in
          values: ["1"]
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: CVE_ID
          value: $(tasks.ai-select-cve.results.CVE_ID)
        - name: PACKAGE
          value: $(tasks.ai-select-cve.results.PACKAGE)
        - name: CURRENT_VERSION
          value: $(tasks.ai-select-cve.results.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(tasks.ai-select-cve.results.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(tasks.ai-select-cve.results.JUSTIFICATION)
        - name: AGENT_IMAGE
          value: $(params.agent-image)
      workspaces:
        - name: source
          workspace: workspace

    - name: re-run-tests
      runAfter:
        - ai-remediate-dependency
      taskRef:
        name: maven
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
        - input: $(tasks.ai-select-cve.results.SELECTED)
          operator: in
          values: ["1"]
      params:
        - name: GOALS
          value: ["verify"]
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings

    - name: open-pr
      runAfter:
        - re-run-tests
      taskRef:
        name: open-pr
      when:
        - input: $(params.enable-ai-remediation)
          operator: in
          values: ["true"]
        - input: $(tasks.ai-select-cve.results.SELECTED)
          operator: in
          values: ["1"]
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_HOST
          value: $(params.git-host)
        - name: SCM_PROVIDER
          value: $(params.scm-provider)
        - name: BASE_BRANCH
          value: $(params.base-branch)
        - name: CVE_ID
          value: $(tasks.ai-select-cve.results.CVE_ID)
        - name: PACKAGE
          value: $(tasks.ai-select-cve.results.PACKAGE)
        - name: FIXED_VERSION
          value: $(tasks.ai-select-cve.results.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(tasks.ai-select-cve.results.JUSTIFICATION)
        - name: SCM_SECRET_NAME
          value: $(params.scm-secret-name)
      workspaces:
        - name: source
          workspace: workspace
  workspaces:
    - name: workspace
    - name: maven-settings
    - name: gitops-auth
      optional: true
    - name: git-auth
      optional: true
