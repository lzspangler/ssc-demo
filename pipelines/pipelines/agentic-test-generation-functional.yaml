apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.openshift.io/runtime: generic
    pipelines.openshift.io/strategy: docker
    pipelines.openshift.io/used-by: build-cloud
  name: agentic-test-generation-functional
spec:
  # Linear chain: clone-repository -> verify-commit (optional) -> package
  #   -> deploy-app-under-test -> ai-generate-tests-functional
  #   -> reset-app-under-test -> re-run-tests -> open-pr
  #   finally: cleanup-app-under-test
  # The AI coding agent generates JUnit functional tests (*FT.java) per the
  # test-generation-functional skill: black-box REST Assured tests against the
  # application deployed AS EPHEMERAL NAMESPACED RESOURCES in this namespace
  # (tssc-app-ci) by deploy-app-under-test -- an image built from the packaged
  # boot jar, pushed to the integrated registry, running as a Deployment whose
  # readiness probe is the app's health endpoint. The generation task resets
  # that Deployment's pods before every verification run (a pod restart is a
  # state reset for the app's in-memory database) and feeds the app's
  # server-side logs back to the agent on failures. re-run-tests then
  # re-verifies against the same deployed app after another state reset, and
  # the finally task removes the ephemeral resources whether the run succeeded
  # or failed (ownerReferences + the ephemeral-test-resources label are the
  # safety nets if the run is killed so hard that finally tasks never run).
  # Triggered from a GitLab issue comment: /generate-tests-functional
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - default: source
      description: Project subdirectory within the source workspace (where pom.xml lives).
      name: subdirectory
      type: string
    # ---------------- verify-commit (optional) ----------------
    - name: verify-commit
      type: string
      default: 'false'
    - name: certificate-identity
      type: string
      default: userX@demo.redhat.com
    - name: oidc-issuer
      type: string
      default: https://sso.<domain>/realms/trusted-artifact-signer
    - name: rekor-url
      type: string
      default: http://rekor-server.tssc-tas.svc
    - name: tuf-mirror
      type: string
      default: http://tuf.tssc-tas.svc
    # ---------------- SCM (open-pr) ----------------
    - name: git-host
      type: string
      description: SCM host for opening the PR/MR, e.g. gitlab-gitlab.apps.cluster.example.com
      default: ""
    - name: scm-provider
      type: string
      description: gitlab | github
      default: gitlab
    - name: base-branch
      type: string
      default: master
    - name: scm-secret-name
      type: string
      default: scm-auth-secret
    - name: issue-iid
      type: string
      description: >-
        SCM issue number to cross-reference from the opened MR/PR. Set by the
        issue-comment trigger; leave empty (the default) for manual or other
        triggers, in which case the PR carries no issue reference.
      default: ""
    # ---------------- agent runtime ----------------
    - name: agent-image
      type: string
      description: >-
        AI coding-agent runtime image (JDK17 + Maven + the agent CLI). Use the
        flavor matching AI_AGENT: ai-agent-maven-claude for claude-code (default),
        ai-agent-maven-aider for aider. Also used as open-pr's GIT_IMAGE (bundles
        git/glab/gh).
      default: quay.io/sscdemo/ai-agent-maven-aider:v1.0.1
    # ---------------- application under test ----------------
    - name: app-username
      type: string
      description: >-
        Username for the application's security layer, exported to the tests as
        APP_USERNAME. Default matches spring-boot-example-application's
        in-memory user.
      default: user
    - name: app-password
      type: string
      description: >-
        Password for app-username, exported as APP_PASSWORD. Default matches
        spring-boot-example-application's in-memory user (test credentials).
      default: user123
  results:
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    - name: TESTS_ADDED
      value: $(tasks.ai-generate-tests-functional.results.TESTS_ADDED)
    - name: PR_URL
      value: $(tasks.open-pr.results.PR_URL)
    - name: APP_BASE_URL
      value: $(tasks.deploy-app-under-test.results.APP_BASE_URL)
  tasks:
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    - name: verify-commit
      params:
        - name: certificate-identity
          value: $(params.certificate-identity)
        - name: oidc-issuer
          value: $(params.oidc-issuer)
        - name: rekor-url
          value: $(params.rekor-url)
        - name: tuf-mirror
          value: $(params.tuf-mirror)
      runAfter:
        - clone-repository
      taskRef:
        kind: Task
        name: verify-commit
      when:
        - input: "$(params.verify-commit)"
          operator: in
          values: ["true"]
      workspaces:
        - name: repository
          workspace: workspace
    - name: package
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      runAfter:
        - verify-commit
      taskRef:
        name: maven
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings

    # Deploy the packaged application as ephemeral namespaced resources in THIS
    # namespace: image from target/*.jar -> integrated registry, Deployment +
    # Service gated on the health endpoint. APP_NAME is the PipelineRun's name
    # (unique per run), so concurrent runs never collide and cleanup targets
    # exactly this run's resources. The ownerReference makes Kubernetes GC
    # remove the resources even if the run dies before the finally task runs.
    - name: deploy-app-under-test
      runAfter:
        - package
      taskRef:
        name: deploy-app-under-test
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: APP_NAME
          value: $(context.pipelineRun.name)
        - name: OWNER_NAME
          value: $(context.pipelineRun.name)
        - name: OWNER_UID
          value: $(context.pipelineRun.uid)
      workspaces:
        - name: source
          workspace: workspace

    - name: ai-generate-tests-functional
      runAfter:
        - deploy-app-under-test
      taskRef:
        name: ai-generate-tests-functional
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: AGENT_IMAGE
          value: $(params.agent-image)
        # The deployed app's in-cluster Service URL, straight from the deploy
        # task -- not a pipeline param: the app's address is an output of the
        # run, not an input to it.
        - name: APP_BASE_URL
          value: $(tasks.deploy-app-under-test.results.APP_BASE_URL)
        # Scope the K8s-API health-check/reset/log-fetch helpers to this run's
        # ephemeral Deployment (same value the deploy task used for APP_NAME).
        - name: APP_NAME
          value: $(context.pipelineRun.name)
        - name: APP_USERNAME
          value: $(params.app-username)
        - name: APP_PASSWORD
          value: $(params.app-password)
      workspaces:
        - name: source
          workspace: workspace
        # The agent runs Maven itself and the task verifies in a scratch copy,
        # so it needs the mirror just as much as re-run-tests below -- a tree
        # carrying a merged .rhlw pin will not resolve from Central.
        - name: maven-settings
          workspace: maven-settings

    # Stop here if the agent produced no new/changed tests: nothing to verify or
    # PR. re-run-tests, open-pr AND this reset task are guarded on TESTS_ADDED
    # != "0" -- the guard is repeated downstream because Tekton still runs a
    # runAfter successor when its parent is skipped by a when-expression.
    # The reset gives the re-run the same fresh application state the
    # generation task verified its tests against: the generation loop's last
    # verification run left test data in the app's in-memory database, and a
    # re-run against it fails exactly the tests that create
    # fixed-identifier resources.
    - name: reset-app-under-test
      runAfter:
        - ai-generate-tests-functional
      taskRef:
        name: reset-app-under-test
      when:
        - input: $(tasks.ai-generate-tests-functional.results.TESTS_ADDED)
          operator: notin
          values: ["0"]
      params:
        - name: APP_NAME
          value: $(context.pipelineRun.name)

    - name: re-run-tests
      runAfter:
        - reset-app-under-test
      taskRef:
        name: maven
      when:
        - input: $(tasks.ai-generate-tests-functional.results.TESTS_ADDED)
          operator: notin
          values: ["0"]
      params:
        # The functional contract requires the tests to run against a RUNNING
        # application -- the one deploy-app-under-test put in this namespace,
        # via its in-cluster Service URL. No spring-boot:start/stop here: the
        # app is a Deployment, not a forked JVM in this pod, so there is
        # nothing to start or stop (reset-app-under-test handled state).
        # Failsafe is invoked DIRECTLY (not via `mvn verify`) because the
        # repo's pom may not declare a failsafe binding or a functional
        # profile yet, and without a binding `mvn verify` silently runs zero
        # *FT.java tests. -Dit.test=*FT scopes the run to the generated
        # functional suite; the unit suite already ran in the package task.
        # APP_BASE_URL/credentials propagate to the forked JVM as system
        # properties (the skill makes the tests read them env-first with a
        # system-property fallback, so this -D path works for the re-run while
        # the generation task's env-var path worked for generation).
        - name: GOALS
          value:
            - test-compile
            - failsafe:integration-test
            - failsafe:verify
            - -Dit.test=*FT
            - -DAPP_BASE_URL=$(tasks.deploy-app-under-test.results.APP_BASE_URL)
            - -DAPP_USERNAME=$(params.app-username)
            - -DAPP_PASSWORD=$(params.app-password)
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings

    - name: open-pr
      runAfter:
        - re-run-tests
      taskRef:
        name: open-pr-tests
      when:
        - input: $(tasks.ai-generate-tests-functional.results.TESTS_ADDED)
          operator: notin
          values: ["0"]
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_HOST
          value: $(params.git-host)
        - name: SCM_PROVIDER
          value: $(params.scm-provider)
        - name: BASE_BRANCH
          value: $(params.base-branch)
        - name: SCM_SECRET_NAME
          value: $(params.scm-secret-name)
        - name: ISSUE_IID
          value: $(params.issue-iid)
        # integration/functional MRs stage pom.xml alongside src/test: the
        # generated tests may need the agent's test-scoped dependency additions
        # to compile at all.
        - name: TEST_CATEGORY
          value: functional
        # open-pr needs git + glab + gh; the default git-init image ships git only,
        # so run it on the agent image, which bundles all three (both flavors do).
        - name: GIT_IMAGE
          value: $(params.agent-image)
      workspaces:
        - name: source
          workspace: workspace

  # Delete the ephemeral app under test whether the run succeeded, failed, or
  # was skipped partway. Runs even when the deploy task itself failed after
  # creating only some resources (--ignore-not-found makes that a no-op).
  finally:
    - name: cleanup-app-under-test
      taskRef:
        name: cleanup-app-under-test
      params:
        - name: APP_NAME
          value: $(context.pipelineRun.name)

  # NOTE: the deploy/reset/cleanup/generation tasks are pinned to the `pipeline`
  # service account via `taskRunSpecs` on the PipelineRun, in
  # triggers/agentic-issue-triggers.yaml. taskRunSpecs is a PipelineRun-only
  # field: no Tekton Pipeline CRD declares it, so the API server silently
  # prunes it from here (syncs "succeed" but Argo CD stays OutOfSync forever).
  workspaces:
    - name: workspace
    - name: maven-settings
    - name: git-auth
      optional: true
