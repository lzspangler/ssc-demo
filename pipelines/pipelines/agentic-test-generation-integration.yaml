apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.openshift.io/runtime: generic
    pipelines.openshift.io/strategy: docker
    pipelines.openshift.io/used-by: build-cloud
  name: agentic-test-generation-integration
spec:
  # Linear chain: clone-repository -> verify-commit (optional) -> package
  #   -> ai-generate-tests-integration -> re-run-tests -> open-pr
  # The AI coding agent generates JUnit integration tests (*IT.java) per the
  # test-generation-integration skill (test-managed embedded/WireMock doubles
  # only), the project is re-verified with the new tests, and a PR/MR is opened
  # with the generated tests plus any test-scoped pom additions. Triggered from
  # a GitLab issue comment: /generate-tests-integration
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - default: source
      description: Project subdirectory within the source workspace (where pom.xml lives).
      name: subdirectory
      type: string
    # ---------------- verify-commit (optional) ----------------
    - name: verify-commit
      type: string
      default: 'false'
    - name: certificate-identity
      type: string
      default: userX@demo.redhat.com
    - name: oidc-issuer
      type: string
      default: https://sso.<domain>/realms/trusted-artifact-signer
    - name: rekor-url
      type: string
      default: http://rekor-server.tssc-tas.svc
    - name: tuf-mirror
      type: string
      default: http://tuf.tssc-tas.svc
    # ---------------- SCM (open-pr) ----------------
    - name: git-host
      type: string
      description: SCM host for opening the PR/MR, e.g. gitlab-gitlab.apps.cluster.example.com
      default: ""
    - name: scm-provider
      type: string
      description: gitlab | github
      default: gitlab
    - name: base-branch
      type: string
      default: master
    - name: scm-secret-name
      type: string
      default: scm-auth-secret
    - name: issue-iid
      type: string
      description: >-
        SCM issue number to cross-reference from the opened MR/PR. Set by the
        issue-comment trigger; leave empty (the default) for manual or other
        triggers, in which case the PR carries no issue reference.
      default: ""
    # ---------------- agent runtime ----------------
    - name: agent-image
      type: string
      description: >-
        AI coding-agent runtime image (JDK17 + Maven + the agent CLI). Use the
        flavor matching AI_AGENT: ai-agent-maven-claude for claude-code (default),
        ai-agent-maven-aider for aider. Also used as open-pr's GIT_IMAGE (bundles
        git/glab/gh).
      default: quay.io/sscdemo/ai-agent-maven-aider:v1.0.1
  results:
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    - name: TESTS_ADDED
      value: $(tasks.ai-generate-tests-integration.results.TESTS_ADDED)
    - name: PR_URL
      value: $(tasks.open-pr.results.PR_URL)
  tasks:
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    - name: verify-commit
      params:
        - name: certificate-identity
          value: $(params.certificate-identity)
        - name: oidc-issuer
          value: $(params.oidc-issuer)
        - name: rekor-url
          value: $(params.rekor-url)
        - name: tuf-mirror
          value: $(params.tuf-mirror)
      runAfter:
        - clone-repository
      taskRef:
        kind: Task
        name: verify-commit
      when:
        - input: "$(params.verify-commit)"
          operator: in
          values: ["true"]
      workspaces:
        - name: repository
          workspace: workspace
    - name: package
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      runAfter:
        - verify-commit
      taskRef:
        name: maven
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings
    - name: ai-generate-tests-integration
      runAfter:
        - package
      taskRef:
        name: ai-generate-tests-integration
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: AGENT_IMAGE
          value: $(params.agent-image)
      workspaces:
        - name: source
          workspace: workspace
        # The agent runs Maven itself and the task verifies in a scratch copy,
        # so it needs the mirror just as much as re-run-tests below -- a tree
        # carrying a merged .rhlw pin will not resolve from Central.
        - name: maven-settings
          workspace: maven-settings

    # Stop here if the agent produced no new/changed tests: nothing to verify or
    # PR. Both re-run-tests and open-pr are guarded on TESTS_ADDED != "0" -- the
    # guard is repeated on open-pr because Tekton still runs a runAfter successor
    # when its parent is skipped by a when-expression.
    - name: re-run-tests
      runAfter:
        - ai-generate-tests-integration
      taskRef:
        name: maven
      when:
        - input: $(tasks.ai-generate-tests-integration.results.TESTS_ADDED)
          operator: notin
          values: ["0"]
      params:
        # NOT plain `verify`: the application repo's pom may not declare a
        # failsafe binding (the agent is only permitted TEST-SCOPED additions
        # and may have added none), and without a binding `mvn verify` silently
        # runs zero *IT.java tests -- the re-run would pass while testing
        # nothing. DIRECT failsafe invocation runs the integration suite
        # regardless of pom bindings. It MUST be scoped with -Dit.test (same
        # pattern as the functional pipeline's -Dit.test=*FT): without it the
        # invocation INHERITS the pom's failsafe includes, which on this app
        # are **/*FT.java -- the FUNCTIONAL tests, RestAssured against
        # APP_BASE_URL from a deployed app this pipeline never stands up
        # (agentic-test-generation-integration-issue-hdrhp: all 8 FTs errored
        # "Target host is null" while every *IT passed).
        #
        # The pattern covers BOTH integration naming conventions, because the
        # agent does not reliably follow the skill's *IT.java contract: the
        # repo's own seed tests are integration/*IntegrationTest.java, and the
        # agent imitates what it sees (agentic-test-generation-integration-
        # issue-jbvhv: it wrote ConfigImportSimpleIntegrationTest et al. --
        # which passed the task's internal verification by explicit class
        # name, then matched the bare *IT pattern zero times and failsafe
        # failed "No tests matching pattern"). Both patterns are
        # deployment-free in-JVM tests, so running the seed *IntegrationTest
        # classes under failsafe is safe. If NEITHER matches, failsafe fails
        # loudly -- that means the agent produced nothing integration-shaped.
        # test-compile rather than `test` because the unit suite is the unit
        # pipeline's job.
        - name: GOALS
          value:
            - test-compile
            - failsafe:integration-test
            - failsafe:verify
            - -Dit.test=*IT,*IntegrationTest
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings

    - name: open-pr
      runAfter:
        - re-run-tests
      taskRef:
        name: open-pr-tests
      when:
        - input: $(tasks.ai-generate-tests-integration.results.TESTS_ADDED)
          operator: notin
          values: ["0"]
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_HOST
          value: $(params.git-host)
        - name: SCM_PROVIDER
          value: $(params.scm-provider)
        - name: BASE_BRANCH
          value: $(params.base-branch)
        - name: SCM_SECRET_NAME
          value: $(params.scm-secret-name)
        - name: ISSUE_IID
          value: $(params.issue-iid)
        # integration/functional MRs stage pom.xml alongside src/test: the
        # generated tests may need the agent's test-scoped dependency additions
        # to compile at all.
        - name: TEST_CATEGORY
          value: integration
        # open-pr needs git + glab + gh; the default git-init image ships git only,
        # so run it on the agent image, which bundles all three (both flavors do).
        - name: GIT_IMAGE
          value: $(params.agent-image)
      workspaces:
        - name: source
          workspace: workspace
  workspaces:
    - name: workspace
    - name: maven-settings
    - name: git-auth
      optional: true
