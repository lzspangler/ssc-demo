# -----------------------------------------------------------------------------
# Shared secret token for the GitLab webhook that triggers agentic-cve-remediation
# from an issue comment. GitLab sends this value in the `X-Gitlab-Token` header;
# the Tekton GitLab interceptor validates it before the EventListener acts on the
# payload. Use the SAME value here and in the GitLab webhook's "Secret token"
# field.
#
#   oc -n tssc-app-ci create secret generic gitlab-webhook-secret \
#     --from-literal=secretToken=$(openssl rand -hex 20)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-webhook-secret
  labels:
    app.kubernetes.io/part-of: maven-build-ci
type: Opaque
stringData:
  secretToken: "REPLACE_ME"
