# -----------------------------------------------------------------------------
# SCM token used by the gitops-bump-image task (gitops-cd-dev pipeline) to push
# a branch and open + merge an MR in the GITOPS repository
# (development/spring-boot-example-gitops).
#
# This is deliberately a SEPARATE secret from scm-auth-secret: a GitLab
# project-bot user is a member of exactly one project and GitLab refuses to
# add it to any other ("project bots cannot be added to other groups /
# projects"), so the gitops repository needs its own project access token
# rather than a membership grant for the application repository's bot.
#
# GitLab: create a Project Access Token ON THE GITOPS REPO with
# scopes: api, write_repository and role Maintainer
#
#   oc -n tssc-app-ci create secret generic scm-auth-gitops-secret \
#     --from-literal=token=glpat-... \
#     --from-literal=username=oauth2
#
# Both secrets are minted automatically by the GitLab seeding job
# (automation/gitops/components/gitlab) on a GitOps install; this file is the
# by-hand fallback.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: scm-auth-gitops-secret
  labels:
    app.kubernetes.io/part-of: maven-build-ci
type: Opaque
stringData:
  # For GitLab, username is conventionally "oauth2"; for GitHub, use "x-access-token".
  username: "oauth2"
  token: "REPLACE_ME"
