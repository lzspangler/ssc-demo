# -----------------------------------------------------------------------------
# SCM token used by the open-pr task to push a branch and open a PR/MR back to
# the application repository. Needs write access to the repo and API scope to
# create merge/pull requests.
#
# GitLab: create a Project or Group Access Token with scopes: api, write_repository
# GitHub: create a fine-grained PAT with Contents:write + Pull requests:write
#
#   oc -n tssc-app-ci create secret generic scm-auth-secret \
#     --from-literal=token=glpat-... \
#     --from-literal=username=oauth2
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: scm-auth-secret
  labels:
    app.kubernetes.io/part-of: maven-build-ci
type: Opaque
stringData:
  # For GitLab, username is conventionally "oauth2"; for GitHub, use "x-access-token".
  username: "oauth2"
  token: "REPLACE_ME"
