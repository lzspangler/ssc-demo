# -----------------------------------------------------------------------------
# Credentials for the pluggable AI backend. Copy to ai-agent-secret.yaml, fill
# in the value(s) for your chosen AI_PROVIDER, and apply. Do NOT commit real
# secrets.
#
#   oc -n tssc-app-ci create secret generic ai-agent-secret \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# Only the keys relevant to your AI_PROVIDER (see ai-agent-config.yaml) need to
# be present; the rest can be omitted. All keys are surfaced to the AI tasks via
# `envFrom.secretRef`, so they become environment variables of the same name.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secret
  labels:
    app.kubernetes.io/part-of: maven-build-ci
type: Opaque
stringData:
  # AI_PROVIDER=anthropic
  ANTHROPIC_API_KEY: "REPLACE_ME"

  # AI_PROVIDER=gateway (Claude-compatible relay/proxy)
  # ANTHROPIC_AUTH_TOKEN: "REPLACE_ME"

  # AI_PROVIDER=openai (OpenAI-compatible endpoint: OpenAI/vLLM/RHOAI/Ollama/
  # watsonx -- serves gpt-oss and Granite). Use any non-empty placeholder for
  # servers that don't validate the token (e.g. a bare vLLM/Ollama deployment).
  # OPENAI_API_KEY: "REPLACE_ME"

  # AI_PROVIDER=bedrock
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # AWS_SESSION_TOKEN: ""

  # AI_PROVIDER=vertex  (contents of a GCP service-account JSON, base64-decoded)
  # GOOGLE_APPLICATION_CREDENTIALS_JSON: "REPLACE_ME"
