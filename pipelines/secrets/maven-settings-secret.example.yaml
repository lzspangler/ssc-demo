# -----------------------------------------------------------------------------
# Maven settings.xml delivered to the maven-based tasks (package / re-run-tests /
# re-build) via the `maven-settings` workspace. It routes ALL dependency
# resolution through the Artifactory `maven` virtual repo (Lightwell validated +
# remediated proxies, with Maven Central as fallback).
#
# WHY A SECRET (not a ConfigMap): Artifactory OSS has anonymous access DISABLED
# (anonAccessEnabled=false), so an anonymous GET of the virtual repo returns 401.
# The build must authenticate, so settings.xml embeds a <server> credential and
# must therefore be a Secret, not a ConfigMap. The maven task's `maven-generate`
# step copies this settings.xml verbatim and runs `mvn -s .../settings.xml`, so
# no pipeline/task edits are needed — only that the run binds this Secret to the
# `maven-settings` workspace (see below).
#
# CREDENTIAL: OSS gates non-admin user/token creation (the token API rejects
# Basic auth; PUT /api/security/users is Pro-gated), so this uses the `admin`
# account. This is acceptable for the dev/demo cluster only. To harden: enable
# anonymous read on the `maven` virtual and drop the <server> block (then a
# ConfigMap suffices), or create a dedicated read-only user via the Artifactory
# UI and swap its credentials in here.
#
# The <mirror> and <server> `id` MUST match (`artifactory`) for the credential to
# be applied to the mirror. <mirrorOf>*</mirrorOf> forces EVERY repo the build
# declares through the virtual.
#
# Ships as REPLACE_ME -- DO NOT commit a real password. Create the real Secret in
# the pipeline namespace (the admin password is the part after `admin@*=` in the
# artifactory-admin secret):
#
#   ROUTE="https://$(oc -n artifactory get route artifactory -o jsonpath='{.spec.host}')"
#   ADMIN=$(oc -n artifactory get secret artifactory-admin \
#           -o jsonpath='{.data.password}' | base64 -d | sed 's/^admin@\*=//')
#   python3 - "$ROUTE" "$ADMIN" <<'PY' > /tmp/settings.xml
#   import sys; route, pw = sys.argv[1], sys.argv[2]
#   print(f'''<?xml version="1.0" encoding="UTF-8"?>
#   <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
#     <servers><server><id>artifactory</id><username>admin</username><password>{pw}</password></server></servers>
#     <mirrors><mirror><id>artifactory</id><name>Artifactory maven virtual</name>
#       <url>{route}/artifactory/maven</url><mirrorOf>*</mirrorOf></mirror></mirrors>
#   </settings>''')
#   PY
#   oc -n tssc-app-ci create secret generic maven-settings \
#     --from-file=settings.xml=/tmp/settings.xml --dry-run=client -o yaml | oc apply -f -
#   rm -f /tmp/settings.xml
#
# Then bind it when starting a pipeline:
#   tkn -n tssc-app-ci pipeline start agentic-cve-analysis \
#     -w name=workspace,volumeClaimTemplateFile=... \
#     -w name=maven-settings,secret=maven-settings \
#     ...
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: maven-settings
  labels:
    app.kubernetes.io/part-of: maven-build-ci
type: Opaque
stringData:
  # The maven-settings workspace mounts each data key as a file; the maven task
  # looks for exactly `settings.xml`.
  settings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
      <servers>
        <server>
          <id>artifactory</id>
          <username>admin</username>
          <password>REPLACE_ME</password>
        </server>
      </servers>
      <mirrors>
        <mirror>
          <id>artifactory</id>
          <name>Artifactory maven virtual</name>
          <url>https://artifactory-artifactory.apps.cluster-6jnws.dyn.redhatworkshops.io/artifactory/maven</url>
          <mirrorOf>*</mirrorOf>
        </mirror>
      </mirrors>
    </settings>
