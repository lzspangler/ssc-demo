apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-remediate-dependency
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation, maven"
spec:
  description: >-
    Use an AI coding agent to update the selected vulnerable Maven dependency to
    its fixed version and confirm the project still resolves/compiles. Operates
    on the shared source workspace so the change accumulates alongside generated
    tests for a single PR. Backend pluggable via ai-agent-config / ai-agent-secret.
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: CVE_ID
      type: string
    - name: PACKAGE
      type: string
      description: Maven coordinates (groupId:artifactId) to update.
    - name: CURRENT_VERSION
      type: string
      default: ""
    - name: FIXED_VERSION
      type: string
    - name: JUSTIFICATION
      type: string
      default: ""
    - name: AGENT_IMAGE
      type: string
      description: >-
        AI agent runtime image (JDK17 + Maven + the agent CLI). Use the flavor
        matching AI_AGENT: ai-agent-maven-claude for claude-code (default),
        ai-agent-maven-aider for aider.
      default: quay.io/REPLACE_ME/ai-agent-maven-claude:v1.0.0
  workspaces:
    - name: source
  results:
    - name: CHANGED
      description: "1 if the agent modified the build files, else 0."
  stepTemplate:
    envFrom:
      - configMapRef:
          name: ai-agent-config
      - secretRef:
          name: ai-agent-secret
    env:
      - name: HOME
        value: /tekton/home
  steps:
    - name: remediate
      image: $(params.AGENT_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      computeResources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      env:
        - name: CVE_ID
          value: $(params.CVE_ID)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: CURRENT_VERSION
          value: $(params.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(params.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(params.JUSTIFICATION)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        AGENT="${AI_AGENT:-claude-code}"
        MODEL="${AI_MODEL:-claude-opus-5}"
        echo "Remediating ${CVE_ID}: ${PACKAGE} -> ${FIXED_VERSION} (agent=${AGENT} model=${MODEL})"

        WORKDIR="$(workspaces.source.path)/$(params.SUBDIRECTORY)"

        # The workspace repo was cloned by a different uid; this pod runs as an
        # arbitrary OpenShift uid, so git aborts with "detected dubious ownership".
        # Mark the repo safe for every git call here -- the agent's internal
        # `git add` and our own `git status` at the end.
        git config --global --add safe.directory "${WORKDIR}"
        git config --global --add safe.directory "$(workspaces.source.path)"
        git config --global user.email "pipeline@tekton.local" 2>/dev/null || true
        git config --global user.name "tekton-pipeline" 2>/dev/null || true

        PROMPT="Update the Maven dependency '${PACKAGE}' to version '${FIXED_VERSION}'
        to remediate ${CVE_ID}. Edit pom.xml -- prefer dependencyManagement or a BOM
        property if the project uses one. Current version is '${CURRENT_VERSION}'.
        Do NOT change unrelated dependencies or application logic. Do NOT run any
        build or shell commands -- the build is verified separately. Finally write a
        short REMEDIATION.md at the project root describing the change and this
        rationale: ${JUSTIFICATION}"

        # --- Dispatch to the configured coding agent ---
        case "${AGENT}" in
          aider)
            # OpenAI-compatible coding agent (gpt-oss, Granite, any vLLM/RHOAI/
            # Ollama/watsonx endpoint). litellm reads OPENAI_API_BASE/OPENAI_API_KEY.
            [ -n "${AI_BASE_URL:-}" ] && export OPENAI_API_BASE="${AI_BASE_URL}"
            export OPENAI_API_KEY="${OPENAI_API_KEY:-placeholder}"
            case "${MODEL}" in */*) AIDER_MODEL="${MODEL}";; *) AIDER_MODEL="openai/${MODEL}";; esac
            aider \
              --model "${AIDER_MODEL}" \
              --yes-always --no-auto-commits --no-check-update --no-gitignore \
              --message "${PROMPT}" \
              pom.xml 2>&1 | tee /tekton/home/aider-remediate.log
            ;;
          claude-code|*)
            case "${AI_PROVIDER:-anthropic}" in
              bedrock) export CLAUDE_CODE_USE_BEDROCK=1 ;;
              vertex)  export CLAUDE_CODE_USE_VERTEX=1 ;;
              gateway) export ANTHROPIC_BASE_URL="${AI_BASE_URL:?AI_BASE_URL required for gateway provider}" ;;
              anthropic|*) : ;;
            esac
            export ANTHROPIC_MODEL="${MODEL}"
            claude -p "${PROMPT}" \
              --model "${ANTHROPIC_MODEL}" \
              --permission-mode acceptEdits \
              --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mvn:*)" \
              --output-format json | tee /tekton/home/claude-remediate.json
            ;;
        esac

        # Verify compile independently of the agent's own run, in a pod-local copy.
        # target/ on the shared PVC was created by an earlier task pod under a
        # different uid, and Maven's resources plugin can't overwrite those
        # foreign-owned files ("Operation not permitted"). Exclude target/ (tar
        # re-owns to our uid on extract); the agent's pom.xml edit stays on the
        # shared workspace for open-pr to commit. --warning=no-file-changed +
        # tolerating tar's exit 1 handles a dir-mtime bump during the read.
        SCRATCH="/tekton/home/airemediate-work"
        rm -rf "${SCRATCH}"; mkdir -p "${SCRATCH}"
        set +e
        tar -C "${WORKDIR}" --exclude=./target --warning=no-file-changed -cf - . \
          | tar -C "${SCRATCH}" -xf -
        rcs=("${PIPESTATUS[@]}")
        set -e
        if [ "${rcs[0]}" -gt 1 ]; then echo "source tar failed (rc=${rcs[0]})"; exit 1; fi
        if [ "${rcs[1]}" -ne 0 ]; then echo "extract tar failed (rc=${rcs[1]})"; exit 1; fi
        ( cd "${SCRATCH}" && mvn -B -q -Dstyle.color=never -DskipTests install )

        CHANGED="$(git -C "${WORKDIR}" status --porcelain -- pom.xml '**/pom.xml' 2>/dev/null | wc -l | tr -d ' ')"
        printf '%s' "$([ "${CHANGED:-0}" -gt 0 ] && echo 1 || echo 0)" > "$(results.CHANGED.path)"
        echo "Build file changes: ${CHANGED:-0}"
