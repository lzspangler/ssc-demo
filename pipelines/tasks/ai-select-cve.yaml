apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-select-cve
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation"
spec:
  description: >-
    Ask the AI to choose exactly ONE dependency vulnerability to remediate, given
    the RHTPA vulnerability-analysis report (authoritative CVE/severity/affected
    PURL source), the RHTPA remediation (recommend) report (supplemental), the
    Conforma must-fix set (policy gate), and a user-defined policy (free-form
    context). Emits the decision as small Tekton results. Backend is pluggable via
    ai-agent-config / ai-agent-secret; runtime via AI_PYTHON_IMAGE.
  params:
    - name: VULNERABILITY_REPORT_PATH
      type: string
      description: >-
        Absolute path (on the workspace) to the RHTPA vulnerability-analysis JSON
        (authoritative: .findings + per-CVE details carry severity, affected
        PURLs, and the fix version in the title/description prose).
      default: ""
    - name: REMEDIATION_REPORT_PATH
      type: string
      description: >-
        Absolute path (on the workspace) to the RHTPA remediation (recommend)
        JSON. Supplemental only; often empty for upstream-only Maven deps.
      default: ""
    - name: MUST_FIX_PATH
      type: string
      description: Absolute path (on the workspace) to the Conforma must-fix JSON array.
      default: ""
    - name: POLICY_CONTEXT
      type: string
      description: User-defined prioritization policy (natural language).
      default: >-
        Prefer CRITICAL/HIGH severity CVEs that have a vendor-recommended fixed
        version. Avoid major-version bumps unless required to obtain the fix.
        Never select a CVE without a concrete fixed version. Prefer changes that
        touch a single dependency.
    - name: AI_PYTHON_IMAGE
      type: string
      description: Image with the Anthropic Python SDK installed.
      default: quay.io/REPLACE_ME/ai-python:v1.0.0
  workspaces:
    - name: workspace
  results:
    - name: SELECTED
      description: "1 if a CVE was selected, 0 if none qualified."
    - name: CVE_ID
    - name: PACKAGE
      description: Maven coordinates (groupId:artifactId) of the dependency to bump.
    - name: CURRENT_VERSION
    - name: FIXED_VERSION
    - name: JUSTIFICATION
  stepTemplate:
    envFrom:
      - configMapRef:
          name: ai-agent-config
      - secretRef:
          name: ai-agent-secret
  volumes:
    # Optional CA bundle for self-hosted / internal AI endpoints whose cert is
    # signed by a private CA (or a TLS-reencrypting egress proxy). Create a
    # ConfigMap named ai-endpoint-ca with the PEM, then set AI_CA_BUNDLE in
    # ai-agent-config to the mounted file. Optional so the pod starts without it.
    - name: endpoint-ca
      configMap:
        name: ai-endpoint-ca
        optional: true
  steps:
    - name: select
      image: $(params.AI_PYTHON_IMAGE)
      volumeMounts:
        - name: endpoint-ca
          mountPath: /etc/ai-ca
          readOnly: true
      env:
        - name: HOME
          value: /tekton/home
        - name: WORKSPACE_PATH
          value: $(workspaces.workspace.path)
        - name: VULNERABILITY_REPORT_PATH
          value: $(params.VULNERABILITY_REPORT_PATH)
        - name: REMEDIATION_REPORT_PATH
          value: $(params.REMEDIATION_REPORT_PATH)
        - name: MUST_FIX_PATH
          value: $(params.MUST_FIX_PATH)
        - name: POLICY_CONTEXT
          value: $(params.POLICY_CONTEXT)
        # Result file paths, passed to Python via env to avoid source interpolation.
        - name: R_SELECTED
          value: $(results.SELECTED.path)
        - name: R_CVE_ID
          value: $(results.CVE_ID.path)
        - name: R_PACKAGE
          value: $(results.PACKAGE.path)
        - name: R_CURRENT_VERSION
          value: $(results.CURRENT_VERSION.path)
        - name: R_FIXED_VERSION
          value: $(results.FIXED_VERSION.path)
        - name: R_JUSTIFICATION
          value: $(results.JUSTIFICATION.path)
      script: |
        #!/usr/bin/env python3
        import json, os, re, sys

        provider = os.environ.get("AI_PROVIDER", "anthropic")
        model = os.environ.get("AI_MODEL", "claude-opus-5")
        effort = os.environ.get("AI_EFFORT", "high")
        ws = os.environ["WORKSPACE_PATH"]
        # Char budget for the two big report blobs, so the prompt stays under the
        # model's context window. Self-hosted gpt-oss/Granite are commonly 128K
        # tokens; the full analyze report (every CVE's description prose) alone can
        # blow past that. ~4 chars/token, and we leave generous headroom for the
        # schema, instructions, and the completion.
        VULN_CHAR_BUDGET = int(os.environ.get("AI_VULN_CHAR_BUDGET", "260000"))
        REPORT_CHAR_BUDGET = int(os.environ.get("AI_REPORT_CHAR_BUDGET", "40000"))

        def read_json(path, default):
            try:
                with open(path) as f:
                    return f.read()
            except Exception:
                return default

        vuln_path = os.environ.get("VULNERABILITY_REPORT_PATH") or f"{ws}/rhtpa/vulnerabilities.json"
        report_path = os.environ.get("REMEDIATION_REPORT_PATH") or f"{ws}/rhtpa/remediation.json"
        mustfix_path = os.environ.get("MUST_FIX_PATH") or f"{ws}/rhtpa/must-fix-cves.json"
        vuln = read_json(vuln_path, "{}")
        report = read_json(report_path, "{}")
        mustfix = read_json(mustfix_path, "[]")

        def write_result(name_env, value):
            with open(os.environ[name_env], "w") as f:
                f.write(str(value))

        # If the policy gate produced nothing to fix, exit cleanly with SELECTED=0.
        try:
            if len(json.loads(mustfix)) == 0:
                print("No must-fix CVEs; nothing to remediate.")
                for e in ("R_SELECTED",): write_result(e, "0")
                for e in ("R_CVE_ID","R_PACKAGE","R_CURRENT_VERSION","R_FIXED_VERSION","R_JUSTIFICATION"):
                    write_result(e, "")
                sys.exit(0)
        except Exception:
            pass

        # ---- Trim the reports to the must-fix CVEs to fit the context window ----
        # The AI only ever selects from the must-fix set, so the analyze report's
        # per-CVE detail prose (where the fixed version lives) and findings are
        # only needed for those CVEs. Dropping every other CVE's detail is what
        # brings a 160K-token dump back under a 128K-token model. A hard char
        # budget backstops pathological cases (huge must-fix set, unparseable JSON).
        def _mustfix_ids(raw):
            ids = set()
            try:
                arr = json.loads(raw)
            except Exception:
                arr = []
            for item in (arr if isinstance(arr, list) else []):
                if isinstance(item, str):
                    ids.add(item)
                elif isinstance(item, dict):
                    for k in ("cve_id", "id", "cve", "identifier", "term"):
                        v = item.get(k)
                        if isinstance(v, str):
                            ids.add(v)
            return ids

        def _cve_toks(ids):
            toks = set()
            for i in ids:
                toks.add(i)
                for m in re.findall(r"CVE-\d{4}-\d+", i, re.I):
                    toks.add(m.upper())
            return toks

        def _trim_vuln(raw, ids):
            try:
                v = json.loads(raw)
            except Exception:
                return raw
            if not isinstance(v, dict):
                return raw
            idset = set(ids)
            toks = _cve_toks(ids)
            def match(cid):
                return isinstance(cid, str) and (cid in idset or cid.upper() in toks)
            findings = [f for f in (v.get("findings") or [])
                        if isinstance(f, dict) and match(f.get("cve_id"))]
            details = [d for d in (v.get("details") or [])
                       if isinstance(d, dict) and match(d.get("identifier") or d.get("id"))]
            # If nothing matched (e.g. conforma terms that aren't bare CVE ids),
            # keep the compact findings for context but still drop the huge details.
            if not findings:
                findings = [f for f in (v.get("findings") or []) if isinstance(f, dict)]
            return json.dumps({"findings": findings, "details": details})

        def _cap(s, limit):
            if len(s) <= limit:
                return s
            return s[:limit] + "\n...[truncated %d chars to fit the model context]..." % (len(s) - limit)

        ids = _mustfix_ids(mustfix)
        vuln = _cap(_trim_vuln(vuln, ids), VULN_CHAR_BUDGET)
        report = _cap(report, REPORT_CHAR_BUDGET)
        print("prompt sizes (chars): mustfix=%d vuln=%d report=%d"
              % (len(mustfix), len(vuln), len(report)), file=sys.stderr)

        # ---- TLS trust for self-hosted / internal endpoints ----
        # gpt-oss/Granite servers are commonly fronted by a private CA (or a
        # TLS-reencrypting egress proxy) that the container's default trust store
        # (certifi) doesn't know, so the SDK's HTTPS handshake fails with
        # "CERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate".
        # Unlike litellm/aider, the OpenAI and Anthropic SDKs do NOT honor
        # SSL_CERT_FILE / SSL_VERIFY env vars, so expose two opt-in knobs (set in
        # ai-agent-config), secure by default:
        #   AI_CA_BUNDLE    -> path to a CA PEM to trust (mount it via the
        #                      ai-endpoint-ca ConfigMap; see the task's volumes)
        #   AI_TLS_INSECURE -> "true"/"1"/"yes" disables verification (demo/dev ONLY)
        def _tls_verify():
            if os.environ.get("AI_TLS_INSECURE", "").strip().lower() in ("1", "true", "yes"):
                sys.stderr.write("WARNING: AI_TLS_INSECURE set -- TLS certificate "
                                 "verification is DISABLED. Do not use in production.\n")
                return False
            ca = os.environ.get("AI_CA_BUNDLE", "").strip()
            return ca if ca else True

        def _http_client(sdk_module):
            # Return an http client (or None to keep the SDK default). Built from
            # the SDK's OWN vendored httpx module so the instance type matches:
            # recent SDKs vendor httpx under the name "httpx2" (and import it as
            # such, so _base_client.httpx may not exist), older ones use "httpx".
            verify = _tls_verify()
            if verify is True:
                return None
            import importlib
            bc = importlib.import_module(sdk_module + "._base_client")
            hx = getattr(bc, "httpx", None) or getattr(bc, "httpx2", None)
            if hx is None:
                for mod in ("httpx2", "httpx"):
                    try:
                        hx = importlib.import_module(mod)
                        break
                    except ImportError:
                        continue
            return hx.Client(verify=verify)

        # ---- Build the provider-appropriate client ----
        # provider=openai routes to any OpenAI-compatible endpoint (OpenAI, vLLM,
        # Red Hat OpenShift AI, Ollama, watsonx) -- this is how gpt-oss and Granite
        # are reached. Everything else uses the Anthropic Messages API.
        family = "openai" if provider == "openai" else "anthropic"
        if family == "openai":
            from openai import OpenAI
            oai = OpenAI(
                base_url=(os.environ.get("AI_BASE_URL") or None),
                api_key=os.environ.get("OPENAI_API_KEY", "placeholder"),
                http_client=_http_client("openai"),
            )
        else:
            import anthropic
            if provider == "bedrock":
                from anthropic import AnthropicBedrockMantle
                client = AnthropicBedrockMantle(aws_region=os.environ.get("AWS_REGION", "us-east-1"))
                if not model.startswith("anthropic."):
                    model = "anthropic." + model
            elif provider == "vertex":
                from anthropic import AnthropicVertex
                client = AnthropicVertex(
                    project_id=os.environ["VERTEX_PROJECT_ID"],
                    region=os.environ.get("VERTEX_REGION", "global"),
                )
            elif provider == "gateway":
                client = anthropic.Anthropic(base_url=os.environ["AI_BASE_URL"],
                                             http_client=_http_client("anthropic"))
            else:
                client = anthropic.Anthropic(http_client=_http_client("anthropic"))

        schema = {
            "type": "object",
            "additionalProperties": False,
            "required": ["selected", "cve_id", "package", "current_version",
                         "fixed_version", "justification"],
            "properties": {
                "selected": {"type": "boolean"},
                "cve_id": {"type": "string"},
                "package": {"type": "string",
                            "description": "Maven groupId:artifactId to update"},
                "current_version": {"type": "string"},
                "fixed_version": {"type": "string"},
                "justification": {"type": "string"},
            },
        }

        user = (
            "User-defined policy:\n" + os.environ["POLICY_CONTEXT"] + "\n\n"
            "Conforma must-fix CVEs (policy gate -- choose only from these):\n"
            + mustfix + "\n\n"
            "AUTHORITATIVE SOURCE -- RHTPA vulnerability-analysis report. Its "
            "'.findings[]' give each CVE's severity, affected_purls (the exact "
            "vulnerable dependency, e.g. pkg:maven/group/artifact@1.2.3 -- derive "
            "the Maven groupId:artifactId and CURRENT_VERSION from these), and "
            "'fixed_version_hints' (best-effort version tokens scraped from the "
            "advisory text). '.details[]' hold the full CVE title/description. The "
            "concrete fixed version is usually stated only in that prose (e.g. "
            "'before versions 2.13.4.1 and 2.12.17.1', 'fixed in 2.14.0'); use the "
            "hints as candidates and read the title/description to pick the correct "
            "fixed version on the SAME release line as the current version:\n"
            + vuln + "\n\n"
            "SUPPLEMENTAL -- RHTPA remediation (recommend) report. Recommended "
            "fixed packages are PURLs; this is a Red Hat-rebuild catalog lookup and "
            "is frequently empty for upstream-only Maven deps -- treat it as a "
            "cross-check, not the source of truth:\n" + report + "\n\n"
            "Select exactly ONE CVE from the must-fix set that best satisfies the "
            "policy. Determine PACKAGE and CURRENT_VERSION from its affected_purl "
            "and the FIXED_VERSION from the analyze findings/details as described "
            "above. You must supply a concrete fixed version; if you cannot "
            "confidently determine one for any must-fix CVE, set selected=false.\n\n"
            "Every field must hold a REAL value taken from the data above -- e.g. "
            "package \"com.fasterxml.jackson.core:jackson-databind\", "
            "current_version \"2.13.2\", fixed_version \"2.13.4.2\", "
            "cve_id \"CVE-2020-36518\". Never emit a JSON Schema, field types, "
            "comments, code fences, or placeholder words like \"string\"."
        )

        system = (
            "You are a security remediation planner. Respond with ONLY a single "
            "JSON object that conforms to the given schema, populated with real "
            "values derived from the input. Do NOT output the schema itself, field "
            "types, comments, code fences, or placeholder values."
        )

        if family == "openai":
            # OpenAI-compatible Chat Completions. Prefer strict json_schema
            # (vLLM/RHOAI guided decoding, OpenAI); fall back to json_object for
            # servers that don't support schema-constrained output (older Ollama).
            def openai_call(response_format):
                return oai.chat.completions.create(
                    model=model,
                    max_tokens=4000,
                    response_format=response_format,
                    messages=[
                        {"role": "system", "content": system},
                        {"role": "user", "content": user},
                    ],
                )
            try:
                resp = openai_call({
                    "type": "json_schema",
                    "json_schema": {"name": "cve_selection", "schema": schema, "strict": True},
                })
            except Exception as e:
                print(f"json_schema not supported ({e}); retrying with json_object", file=sys.stderr)
                resp = openai_call({"type": "json_object"})
            text = resp.choices[0].message.content or "{}"
        else:
            resp = client.messages.create(
                model=model,
                max_tokens=4000,
                thinking={"type": "adaptive"},
                output_config={"effort": effort,
                               "format": {"type": "json_schema", "schema": schema}},
                system=system,
                messages=[{"role": "user", "content": user}],
            )
            text = "".join(b.text for b in resp.content if b.type == "text")

        # Extract the JSON object even when the model wraps it in markdown fences
        # or leaks gpt-oss "harmony" channel markers (assistant/analysis/final)
        # or /* ... */ comments -- guided decoding is not always enforced by
        # OpenAI-compatible gateways, so never trust the response to be clean.
        def _extract_json(t):
            if not t:
                return {}
            t = t.strip()
            t = re.sub(r"^\s*(assistant|analysis|final|commentary)\b[:>]*", "", t, flags=re.I)
            t = t.replace("```json5", "").replace("```json", "").replace("```", "")
            s, e = t.find("{"), t.rfind("}")
            if s != -1 and e != -1 and e > s:
                cand = re.sub(r"/\*.*?\*/", "", t[s:e + 1], flags=re.S)
                try:
                    return json.loads(cand)
                except Exception:
                    pass
            try:
                return json.loads(t)
            except Exception:
                return {}

        data = _extract_json(text)
        if not isinstance(data, dict):
            data = {}

        # Guard against the model echoing the schema / placeholders. A selection is
        # only honored if every field the downstream remediation needs holds a real
        # value: package looks like groupId:artifactId, the versions contain digits,
        # and the CVE is actually in the must-fix set. Otherwise -> SELECTED=0, so a
        # junk response can never trigger a bogus dependency bump.
        def _placeholder(v):
            if not isinstance(v, str):
                return True
            s = v.strip().lower()
            return (not s or s in ("string", "null", "none", "n/a")
                    or "schema" in s or "/*" in s or "assistant" in s or "```" in s)

        pkg = str(data.get("package", "")).strip()
        cur = str(data.get("current_version", "")).strip()
        fix = str(data.get("fixed_version", "")).strip()
        cve = str(data.get("cve_id", "")).strip()
        toks = _cve_toks(ids)

        valid = (
            bool(data.get("selected"))
            and ":" in pkg and not _placeholder(pkg)
            and not _placeholder(fix) and re.search(r"\d", fix) is not None
            and not _placeholder(cur) and re.search(r"\d", cur) is not None
            and (not ids or cve in ids or cve.upper() in toks)
        )
        if bool(data.get("selected")) and not valid:
            print("Model returned selected=true but the payload failed validation "
                  "(placeholder/echoed schema or CVE not in must-fix); treating as "
                  "no selection.", file=sys.stderr)
            print("Raw model text:\n" + text, file=sys.stderr)

        write_result("R_SELECTED", "1" if valid else "0")
        write_result("R_CVE_ID", cve if valid else "")
        write_result("R_PACKAGE", pkg if valid else "")
        write_result("R_CURRENT_VERSION", cur if valid else "")
        write_result("R_FIXED_VERSION", fix if valid else "")
        write_result("R_JUSTIFICATION", str(data.get("justification", "")).strip() if valid else "")
        print(json.dumps(data, indent=2))
