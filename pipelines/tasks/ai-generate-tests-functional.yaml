apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-generate-tests-functional
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, testing, maven"
spec:
  description: >-
    Use an AI coding agent to generate JUnit functional tests (*FT.java) that
    exercise the DEPLOYED application through its service interface (REST
    Assured against the ephemeral Deployment/Service created by the
    deploy-app-under-test task), per the functional-test execution contract:
    black-box only, no external applications, data self-arranged through the
    API. The task health-checks the deployed app, resets it to a clean state
    before every verification run (pod deletion -- fresh in-memory database),
    and feeds the application's server-side log tail back to the agent on
    failures, because the stack traces behind HTTP 500s live there, not in the
    Maven output. The coding agent is selected by AI_AGENT (claude-code |
    aider); aider drives OpenAI-compatible models such as gpt-oss and Granite.
    Backend (provider/model/creds) is supplied via the ai-agent-config
    ConfigMap and ai-agent-secret Secret. Swap the runtime by overriding
    AGENT_IMAGE.
  params:
    - name: SUBDIRECTORY
      type: string
      description: Project subdirectory within the source workspace (where pom.xml lives).
      default: source
    - name: AGENT_IMAGE
      type: string
      description: >-
        Container image providing the AI agent runtime (JDK17 + Maven + the agent
        CLI). Use the flavor matching AI_AGENT: ai-agent-maven-claude for
        claude-code (default), ai-agent-maven-aider for aider.
      default: quay.io/REPLACE_ME/ai-agent-maven-claude:v1.0.0
    - name: TEST_INSTRUCTIONS
      type: string
      description: Extra natural-language guidance for the test-generation agent.
      default: >-
        Prioritize the core business operations from the OpenAPI spec, their
        documented error responses, and the security behavior (unauthenticated
        requests rejected). Each test creates its own data through the API
        using unique identifiers (e.g. a random suffix) -- the application's
        state persists across runs, so fixed identifiers collide with data
        from earlier runs.
    - name: SOURCE_PATHS
      type: string
      description: >-
        Space-separated paths given to the agent as read-only context. Defaults
        to the main sources plus the OpenAPI specification, which IS the service
        interface under test. Only affects the aider (OpenAI-compatible) path.
      default: src/main/java openapi/openapi.yaml
    - name: APP_BASE_URL
      type: string
      description: >-
        Base URL of the DEPLOYED application under test (normally the
        deploy-app-under-test task's APP_BASE_URL result, an in-cluster Service
        URL). The task health-checks it and fails loudly if it is unreachable.
        Tests target ONLY this URL.
      default: ""
    - name: APP_NAME
      type: string
      description: >-
        Value of the app.kubernetes.io/instance label scoping the deployed
        app's pods. Used to reset the application to a clean state (delete its
        pods -- the Deployment recreates them with a fresh in-memory database)
        and to fetch its server-side logs for the agent's failure feedback.
      default: app-under-test
    - name: APP_USERNAME
      type: string
      description: >-
        Username for the application's security layer, passed to the tests via
        the APP_USERNAME environment variable (the skill forbids hardcoding).
        Default matches this demo's in-memory user.
      default: user
    - name: APP_PASSWORD
      type: string
      description: >-
        Password for APP_USERNAME. Default matches this demo's in-memory user
        (test credentials, not a secret).
      default: user123
    - name: MAX_ATTEMPTS
      type: string
      description: >-
        How many times to (re)run the agent and verify the tests it generated.
        On a failing verify, the Maven output PLUS the application's server
        log tail is fed back into the next attempt's prompt. If the generated
        tests still fail after the last attempt, the task fails.
      default: "12"
  workspaces:
    - name: source
      description: Workspace containing the application source (shared PVC).
    - name: maven-settings
      optional: true
      description: >-
        Secret/ConfigMap holding a settings.xml that mirrors dependency
        resolution through the internal artifact repository. Optional so the
        task still runs without one, but a tree carrying a Lightwell backport
        pin cannot build without it -- see the note in the step script.
  results:
    - name: TESTS_ADDED
      description: Number of new/changed test files staged by the agent.
    - name: ATTEMPTS
      description: Agent invocations actually run.
    - name: LAST_ERROR
      description: >-
        Tail of the last failed Maven verify output plus the application's
        server log tail (truncated to ~1 kB total); empty when the generated
        tests passed. Written so a cancelled run still leaves evidence -- a
        timeout cancels AND deletes the pod, and the step logs (including the
        agent tee and the server logs) die with it. Results are the only
        channel that survives.
  stepTemplate:
    envFrom:
      - configMapRef:
          name: ai-agent-config
      - secretRef:
          name: ai-agent-secret
    env:
      - name: HOME
        value: /tekton/home
  steps:
    - name: generate-and-run
      image: $(params.AGENT_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: agent-skills
          mountPath: /tekton/home/agent-skills/test-generation-functional
          readOnly: true
      computeResources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      env:
        - name: TEST_INSTRUCTIONS
          value: $(params.TEST_INSTRUCTIONS)
        - name: SOURCE_PATHS
          value: $(params.SOURCE_PATHS)
        # Exported so the agent's read-only probes, its generated tests, and
        # the verification mvn (a forked JVM) all see the same target and
        # credentials -- the skill forbids hardcoding any of them.
        - name: APP_BASE_URL
          value: $(params.APP_BASE_URL)
        - name: APP_USERNAME
          value: $(params.APP_USERNAME)
        - name: APP_PASSWORD
          value: $(params.APP_PASSWORD)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WORKDIR="$(workspaces.source.path)/$(params.SUBDIRECTORY)"

        AGENT="${AI_AGENT:-claude-code}"
        MODEL="${AI_MODEL:-claude-opus-5}"
        MAX_ATTEMPTS="$(params.MAX_ATTEMPTS)"
        echo "Generating functional tests with agent=${AGENT} provider=${AI_PROVIDER:-anthropic} model=${MODEL} (up to ${MAX_ATTEMPTS} attempts)"

        if [ -z "${APP_BASE_URL}" ]; then
          echo "ERROR: APP_BASE_URL is empty. This task tests a DEPLOYED application;" \
               "run the deploy-app-under-test task first and pass its APP_BASE_URL" \
               "result (the pipeline does this automatically)." >&2
          exit 1
        fi

        # --- Point Maven at the internal mirror ------------------------------
        # EVERY mvn in this step has to resolve through the Artifactory virtual
        # repo rather than Central: the verification builds in the retry loop
        # below, the agent's own `mvn` calls, and -- specific to this task --
        # any TEST-SCOPED dependencies the agent adds to the pom (REST
        # Assured), which must resolve on the first run after generation.
        #
        # Installed as ~/.m2/settings.xml rather than passed as `mvn -s` so that
        # one mechanism covers both callers; the agent's mvn invocations are
        # built by the agent and we cannot add flags to them.
        if [ "$(workspaces.maven-settings.bound)" = "true" ] \
           && [ -f "$(workspaces.maven-settings.path)/settings.xml" ]; then
          mkdir -p "${HOME}/.m2"
          cp "$(workspaces.maven-settings.path)/settings.xml" "${HOME}/.m2/settings.xml"
          echo "Maven resolution: using settings.xml from the maven-settings workspace."
        else
          echo "WARNING: no maven-settings workspace bound. Maven will resolve from" \
               "Central only, and a Lightwell .rhlw backport will NOT resolve."
        fi

        # This task forks off clone-repository and runs in parallel with the
        # build/scan chain's Maven build, which writes target/ in this same shared
        # PVC directory. Two Maven builds sharing target/ collide -- overwriting a
        # file another task pod created fails with "Operation not permitted"
        # (maven-resources-plugin can't reset the mtime of a foreign-owned file).
        # So run the agent and the verification build in a private, pod-local
        # copy of the repo (excluding the foreign-owned target/; tar re-owns to
        # our uid on extract) and merge only the generated tests back at the end.
        SCRATCH="/tekton/home/aitgt-work"
        rm -rf "${SCRATCH}"; mkdir -p "${SCRATCH}"
        tar -C "${WORKDIR}" --exclude=./target -cf - . | tar -C "${SCRATCH}" -xf -
        cd "${SCRATCH}"

        # --- Functional-test methodology skill ---------------------------------
        # Mounted read-only from the agent-skills-test-generation-functional
        # ConfigMap (pipelines/config/, synced by ssc-tekton-config). The task
        # prompt below carries the WHAT (read the OpenAPI spec, evaluate
        # existing *FT.java coverage, add gap-filling tests against the running
        # app, verify); the skill carries the HOW (the functional execution
        # contract and tool stack: deployed app only, black box, REST Assured,
        # data self-arranged via the API). Fail loudly if it is missing: aider
        # --read and claude --append-system-prompt would both silently continue
        # with no methodology at all.
        SKILL_DIR="${HOME}/agent-skills/test-generation-functional"
        if [ ! -f "${SKILL_DIR}/SKILL.md" ]; then
          echo "ERROR: ${SKILL_DIR}/SKILL.md is missing." \
               "Is the agent-skills-test-generation-functional ConfigMap applied" \
               "(pipelines/config/agent-skills-test-generation-functional.yaml)?" >&2
          exit 1
        fi

        # ---- Time budgets -----------------------------------------------------
        # The PipelineRun has a 2h timeout (set in the issue TriggerTemplate;
        # the Tekton default is 1h, which manual runs get unless they set it
        # themselves), and on timeout Tekton cancels AND deletes the pod --
        # the step logs (including the agent tee) vanish, so a hung run
        # leaves nothing to diagnose. Three defenses:
        #   1. AGENT_TIMEOUT caps each agent invocation (a stalled model
        #      endpoint otherwise holds a call for the OpenAI client's full
        #      10-min timeout x retries; agentic-test-generation-issue-{nrjs5,
        #      fv6fs,mqpfm} all burned the whole hour that way).
        #   2. A step budget stops the retry loop from starting an attempt it
        #      cannot finish, so the task fails on its OWN terms with results
        #      written rather than being cancelled by the pipeline timeout.
        #   3. The ATTEMPTS / LAST_ERROR results survive pod deletion.
        AGENT_TIMEOUT=900          # 15 min per agent invocation
        VERIFY_COST=360            # app-bound failsafe tests over HTTP; slower than unit mvn
        STEP_BUDGET=$((90 * 60))   # 90 min: headroom under the 2h run timeout for 12 attempts
        STEP_START="$(date +%s)"
        ATTEMPTS_RAN=0
        LAST_ERROR_TEXT=""
        budget_stopped=0

        # ---- Application under test (deployed, not in-pod) ---------------------
        # deploy-app-under-test built an image from the packaged boot jar and
        # created a Deployment + Service in this namespace; this task targets
        # it at APP_BASE_URL and drives its lifecycle through the Kubernetes
        # API with THIS POD's service-account token (curl and jq are baked into
        # the agent images; oc is not). RBAC comes from the
        # app-under-test-lifecycle Role (see deploy-app-under-test.yaml): pods
        # get/list/delete and pods/log get for the pipeline service account,
        # which the pipeline pins this task to via taskRunSpecs.
        #
        # WHY the task drives the app at all:
        #   - STATE RESET. The app's database is in-memory (H2 mem:), so its
        #     state survives every request and every retry attempt. Verification
        #     must run against a deterministic clean slate, or tests that create
        #     fixed-identifier data fail on their SECOND run -- poisoning every
        #     retry after the first (agentic-test-generation-functional-issue-
        #     629f6 burned all 6 attempts this way). Deleting the app's pods
        #     makes the Deployment recreate them with a fresh database.
        #   - SERVER-SIDE EVIDENCE. An HTTP 500 from the app means an uncaught
        #     RuntimeException; its stack trace is in the app's pod log, NOT in
        #     the Maven output the feedback loop used to carry. Without the log
        #     tail the agent sees "expected 200 but was 500" and can only guess
        #     (same failed run: 6 blind iterations). The app's GlobalException-
        #     Handler does put the exception message in the 500 response body,
        #     but REST Assured's failure line does not print response bodies.
        K8S_API="https://kubernetes.default.svc"
        K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
        APP_NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo tssc-app-ci)"
        APP_LABEL="app.kubernetes.io/instance=$(params.APP_NAME)"

        k8s() {
          curl -sS --cacert "${K8S_CA}" \
            -H "Authorization: Bearer ${K8S_TOKEN}" "$@"
        }

        # Health-poll the deployed app. The deploy task already gated on the
        # readiness probe, so this is normally instant; it exists to catch a
        # crash-looping or restarted app before tests run against it.
        wait_for_app_health() {
          local timeout="${1:-300}" waited=0
          while [ "${waited}" -lt "${timeout}" ]; do
            curl -sf "${APP_BASE_URL}/actuator/health" > /dev/null 2>&1 && return 0
            sleep 5; waited=$((waited + 5))
          done
          return 1
        }

        # Reset the app to a clean state: delete its pods, let the Deployment
        # recreate them (fresh in-memory DB), and wait until they serve again.
        # Best-effort: if the API/RBAC path is unavailable the task continues
        # against existing state with a loud warning rather than failing a run
        # that might still verify cleanly.
        reset_app_state() {
          if [ -z "${K8S_TOKEN}" ]; then
            echo "WARN: no service-account token mounted; cannot reset the app." \
                 "Verification will run against EXISTING application state." >&2
            return 1
          fi
          echo "Resetting application state (deleting pods of ${APP_LABEL})..."
          if ! k8s -X DELETE \
              "${K8S_API}/api/v1/namespaces/${APP_NS}/pods?labelSelector=${APP_LABEL}" \
              > /dev/null; then
            echo "WARN: pod deletion failed (RBAC?); continuing against existing state." >&2
            return 1
          fi
          if ! wait_for_app_health 300; then
            echo "WARN: app did not return to healthy within 300s after reset." >&2
            return 1
          fi
          echo "Application state reset; app healthy at ${APP_BASE_URL}."
          return 0
        }

        # Tail of the app's server log -- where the stack traces behind 500s
        # live. Best-effort: absent RBAC or a dead app yields empty output and
        # the feedback falls back to the Maven tail alone.
        fetch_app_log_tail() {
          local lines="${1:-150}"
          [ -n "${K8S_TOKEN}" ] || return 1
          local pods
          pods="$(k8s "${K8S_API}/api/v1/namespaces/${APP_NS}/pods?labelSelector=${APP_LABEL}" \
                  | jq -r '.items[].metadata.name' 2>/dev/null || true)"
          [ -n "${pods}" ] || return 1
          local p
          for p in ${pods}; do
            echo "--- app pod ${p} (last ${lines} log lines) ---"
            k8s "${K8S_API}/api/v1/namespaces/${APP_NS}/pods/${p}/log?container=app&tailLines=${lines}" || true
          done
        }

        echo "Waiting for the deployed application at ${APP_BASE_URL} ..."
        if ! wait_for_app_health 120; then
          echo "ERROR: the deployed application is not healthy at ${APP_BASE_URL} within 120s." \
               "Check the deployment: oc -n ${APP_NS} get pods -l ${APP_LABEL}" \
               "(or: oc -n ${APP_NS} logs deployment/$(params.APP_NAME) -c app)." >&2
          exit 1
        fi
        echo "Application under test is healthy at ${APP_BASE_URL}"

        # Invoke the configured agent with the given prompt. Non-zero exits are
        # tolerated (logged, not fatal) so the retry loop can still verify and
        # retry. `timeout` wraps only the agent binary: on expiry it SIGTERMs
        # the agent and the pipe closes behind it, so a killed attempt shows up
        # downstream as "no test changes" (or partial changes, which the verify
        # step judges on their own merits) rather than as a special error.
        run_agent() {
          local prompt="$1"
          set +e
          case "${AGENT}" in
            aider)
              timeout "${AGENT_TIMEOUT}" aider \
                --model "${AIDER_MODEL}" \
                --yes-always --no-auto-commits --no-check-update --no-gitignore \
                --no-show-model-warnings \
                --map-tokens 1024 --subtree-only \
                --read "${SKILL_DIR}/SKILL.md" \
                ${READ_ARGS} \
                --message "${prompt}" \
                2>&1 | tee /tekton/home/aider-generate-tests.log
              ;;
            claude-code|*)
              # Headless, non-interactive run. --allowedTools limits what runs
              # without prompting; acceptEdits lets it write files unattended.
              # curl is allowed alongside mvn so the agent can probe the
              # running application's responses (read-only) as the skill
              # suggests.
              timeout "${AGENT_TIMEOUT}" claude -p "${prompt}" \
                --model "${ANTHROPIC_MODEL}" \
                --append-system-prompt "$(cat "${SKILL_DIR}/SKILL.md")" \
                --permission-mode acceptEdits \
                --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mvn:*),Bash(curl:*)" \
                --output-format json | tee /tekton/home/claude-generate-tests.json
              ;;
          esac
          local rc=$?
          set -e
          [ "${rc}" -ne 0 ] && echo "WARN: agent exited ${rc}; continuing to verification."
          return 0
        }

        PROMPT="You are working in a Maven project at the current directory, and
        a DEPLOYED instance of the application it builds is running at
        ${APP_BASE_URL} (deployed by the pipeline -- do not try to start,
        stop, or restart it). Follow the test-generation-functional skill
        supplied as read-only context: first read the OpenAPI specification,
        then evaluate the existing functional tests (*FT.java) for coverage of
        the spec's operations, then add new JUnit 5 functional tests under
        src/test/java -- named *FT.java, mirroring the package layout -- that
        fill the coverage gaps it identifies, driving the deployed application
        through its service interface with REST Assured exactly as the skill
        prescribes: target APP_BASE_URL, authenticate with
        APP_USERNAME/APP_PASSWORD from the environment, black-box assertions
        on responses only, each test arranging its own data through the API
        with UNIQUE identifiers (e.g. a random suffix -- the application's
        state persists across runs, and fixed identifiers collide with data
        from earlier runs), no external applications. You may add TEST-SCOPED
        dependencies and test-only build configuration to pom.xml when the
        skill's tool stack requires them (REST Assured, a Failsafe binding, a
        functional profile); change nothing else in the build. Do NOT modify
        application source under src/main, and do NOT modify existing tests
        -- only add new test files (plus those test-scoped pom additions). If
        the meaningful behaviors are already covered, add no tests. After
        writing tests, run 'mvn -B -q -Dstyle.color=never test-compile
        failsafe:integration-test failsafe:verify -Dit.test=<your test
        classes>' and iterate until the tests you added pass. When a test
        fails with an HTTP 5xx, the application's exception stack trace is
        included in the feedback you receive -- read it before changing the
        test. ${TEST_INSTRUCTIONS}"

        # --- One-time setup for the configured coding agent ---
        case "${AGENT}" in
          aider)
            # OpenAI-compatible coding agent (gpt-oss, Granite, any vLLM/RHOAI/
            # Ollama/watsonx endpoint). litellm reads OPENAI_API_BASE/OPENAI_API_KEY.
            [ -n "${AI_BASE_URL:-}" ] && export OPENAI_API_BASE="${AI_BASE_URL}"
            export OPENAI_API_KEY="${OPENAI_API_KEY:-placeholder}"
            case "${MODEL}" in */*) AIDER_MODEL="${MODEL}";; *) AIDER_MODEL="openai/${MODEL}";; esac
            # Pass the main sources and the OpenAPI spec as read-only reference
            # (the spec IS the service interface under test); --map-tokens
            # bounds the repo-map context and --subtree-only keeps aider scoped
            # to this project dir. --no-show-model-warnings silences litellm's
            # registry lookup for self-hosted models (gpt-oss/Granite aren't in
            # its cost table).
            READ_ARGS=""
            for p in ${SOURCE_PATHS:-src/main/java openapi/openapi.yaml}; do READ_ARGS="${READ_ARGS} --read ${p}"; done
            ;;
          claude-code|*)
            # Configure Claude Code auth from ai-agent-config / ai-agent-secret.
            case "${AI_PROVIDER:-anthropic}" in
              bedrock) export CLAUDE_CODE_USE_BEDROCK=1 ;;
              vertex)  export CLAUDE_CODE_USE_VERTEX=1 ;;
              gateway) export ANTHROPIC_BASE_URL="${AI_BASE_URL:?AI_BASE_URL required for gateway provider}" ;;
              anthropic|*) : ;;
            esac
            export ANTHROPIC_MODEL="${MODEL}"
            ;;
        esac

        # ---- Bounded generate -> verify -> retry loop ----
        # The TASK owns the retry loop rather than trusting the agent to self-
        # verify: aider is invoked without --auto-test and cannot run Maven, so on
        # its own its "iterate until tests pass" instruction never actually runs.
        # Each attempt runs the agent, then resets the app to a clean state and
        # compiles+runs ONLY the test classes it touched this run; on failure the
        # Maven output PLUS the app's server log tail is fed back into the next
        # attempt's prompt so the agent fixes (not rewrites) what it produced.
        attempt=1
        feedback=""
        passed=0
        tests_csv=""
        while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
          # Elapsed-time guard: do not start an attempt we cannot finish. One
          # attempt costs up to AGENT_TIMEOUT (agent) + VERIFY_COST (mvn); if
          # less than that remains of the step budget, stop here so the task
          # terminates on its own terms -- with results written and logs
          # flushed -- instead of being cancelled mid-attempt by the 1h
          # PipelineRun timeout.
          elapsed=$(( $(date +%s) - STEP_START ))
          if [ $((elapsed + AGENT_TIMEOUT + VERIFY_COST)) -gt "${STEP_BUDGET}" ]; then
            echo "Step time budget nearly exhausted (${elapsed}s of ${STEP_BUDGET}s" \
                 "elapsed); stopping after ${ATTEMPTS_RAN} completed attempt(s)."
            budget_stopped=1
            break
          fi

          echo "=== test-generation attempt ${attempt}/${MAX_ATTEMPTS} ==="

          # The agent may have probed the running app (or crashed it) during
          # the previous attempt; if it is no longer healthy, a state reset
          # also brings it back (pod deletion -> Deployment recreates).
          if ! curl -sf "${APP_BASE_URL}/actuator/health" > /dev/null 2>&1; then
            echo "App unhealthy before attempt ${attempt}; resetting."
            reset_app_state || true
          fi

          prompt="${PROMPT}"
          if [ -n "${feedback}" ]; then
            prompt="${PROMPT}

        Your previous attempt left FAILING tests. Do NOT start over -- fix the tests
        you already wrote under src/test so they compile and pass. Here is the tail
        of the Maven output from that attempt:
        ${feedback}"
          fi
          run_agent "${prompt}"
          ATTEMPTS_RAN=$((ATTEMPTS_RAN+1))

          # Which files did the agent add/change this run? git status
          # --porcelain emits "XY <path>"; strip the 3-char status prefix.
          # pom.xml is watched alongside src/test: the functional contract
          # lets the agent add TEST-SCOPED dependencies (REST Assured), and
          # those changes must reach verification, the merge-back, and the
          # MR exactly like the test files do.
          git add -A 2>/dev/null || true
          changed="$(git status --porcelain -- 'src/test' pom.xml 2>/dev/null | cut -c4-)"
          if [ -z "${changed}" ]; then
            echo "Agent produced no test changes on attempt ${attempt}."
            attempt=$((attempt+1))
            continue
          fi

          # Derive failsafe -Dit.test class names from the changed test sources.
          tests_csv=""
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              *Test.java|*Tests.java|*TestCase.java|Test*.java|*IT.java|*FT.java)
                cls="$(basename "${f}" .java)"
                tests_csv="${tests_csv:+${tests_csv},}${cls}" ;;
            esac
          done <<< "${changed}"

          if [ -z "${tests_csv}" ]; then
            echo "Changed files under src/test but none are recognizable test classes; nothing to verify."
            break
          fi

          # Fresh application state for EVERY verification run: the agent's
          # probes and the previous attempts' tests left data behind (in-mem
          # DB persists across pods of the app), and re-running data-creating
          # tests against it fails them regardless of the tests' quality.
          reset_app_state || echo "WARN: verifying against existing app state."

          # Verify ONLY the generated tests, so unrelated/pre-existing suite
          # failures can't fail this task. Failsafe is invoked DIRECTLY
          # (test-compile + failsafe:integration-test + failsafe:verify) rather
          # than through the lifecycle's `verify` phase, because the application
          # repo's pom may not declare a failsafe binding (or a functional
          # profile) yet -- and without a binding, plain `mvn verify` silently
          # runs NO *FT.java tests at all. Direct invocation runs them
          # regardless, which is also exactly what the skill's Step 3 tells
          # the agent to run. -Dit.test selects the generated classes, and
          # APP_BASE_URL/APP_USERNAME/APP_PASSWORD propagate from this step's
          # environment into the forked surefire/failsafe JVM.
          echo "Verifying generated functional tests: ${tests_csv}"
          set +e
          build_log="$(mvn -B -q -Dstyle.color=never \
              -Dit.test="${tests_csv}" \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dit.failIfNoSpecifiedTests=false \
              test-compile failsafe:integration-test failsafe:verify 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "${build_log}"

          # App-source guard, same as the integration task: the merge-back
          # propagates ONLY src/test and pom.xml, so a pass riding on an
          # src/main patch is silently discarded and re-run-tests then fails
          # against the unpatched app with no hint why. Almost always means
          # the generated test exposed a REAL application bug.
          main_changed="$(git status --porcelain -- src/main 2>/dev/null | cut -c4-)"
          if [ "${rc}" -eq 0 ]; then
            if [ -n "${main_changed}" ]; then
              printf '%s' "${ATTEMPTS_RAN}" > "$(results.ATTEMPTS.path)"
              printf '%s' "tests pass only via out-of-scope app change: ${main_changed}" \
                > "$(results.LAST_ERROR.path)"
              echo "ERROR: the agent modified APPLICATION SOURCE to make the tests pass:" >&2
              printf '%s\n' "${main_changed}" >&2
              echo "That change is out of scope (only src/test and pom.xml reach the" >&2
              echo "workspace and the MR), so re-run-tests would fail against the" >&2
              echo "unpatched app. It almost always means the generated test exposed a" >&2
              echo "REAL application bug -- fix it in the application repo, then re-run" >&2
              echo "this pipeline." >&2
              exit 1
            fi
            passed=1
            break
          fi

          echo "Generated tests failed on attempt ${attempt} (mvn rc=${rc})."
          # Client-side evidence (assertion failures) + server-side evidence
          # (the app's stack traces behind any 5xx) -- without the latter the
          # agent iterates blind on "expected 200 but was 500".
          feedback="$(printf '%s\n' "${build_log}" | tail -n 120)"
          app_log_tail="$(fetch_app_log_tail 150 || true)"
          if [ -n "${app_log_tail}" ]; then
            feedback="${feedback}

        --- application server log (stack traces behind HTTP 5xx responses) ---
        ${app_log_tail}"
          fi
          if [ -n "${main_changed}" ]; then
            feedback="${feedback}

        OUT OF SCOPE: your previous attempt also modified application source
        under src/main:
        ${main_changed}
        Those changes are discarded and will NOT reach the MR. Revert them
        (git checkout -- src/main) and make the tests pass against the
        application as it is."
          fi
          # Tekton ships results through the container termination message,
          # which is size-capped; ~1 kB keeps this inside it. Both halves
          # matter: the Maven tail names the failing test, the app log names
          # the server-side cause.
          LAST_ERROR_TEXT="$(printf '%s\n%s\n' "${build_log}" "${app_log_tail}" | tail -c 1024)"
          attempt=$((attempt+1))
        done

        # No verifiable tests were produced across all attempts -> nothing to PR;
        # skip gracefully (the pipeline guards re-run-tests/open-pr on TESTS_ADDED).
        if [ -z "${tests_csv}" ]; then
          printf '0' > "$(results.TESTS_ADDED.path)"
          printf '%s' "${ATTEMPTS_RAN}" > "$(results.ATTEMPTS.path)"
          printf '%s' "${LAST_ERROR_TEXT}" > "$(results.LAST_ERROR.path)"
          if [ "${budget_stopped}" -ne 0 ]; then
            # Not the graceful "behaviors already covered" outcome: the step
            # budget ran out before any passing tests existed (e.g. a stalled
            # model endpoint burning attempts). Fail loud rather than report a
            # green run that produced nothing.
            echo "ERROR: step time budget exhausted with no passing tests" \
                 "(${ATTEMPTS_RAN} attempt(s) run; last agent attempts produced" \
                 "no verifiable changes)." >&2
            exit 1
          fi
          echo "No test classes were generated; nothing to add."
          exit 0
        fi

        # Tests were generated but never passed within the retry budget: fail loud
        # so the run is visible, rather than opening a PR with broken tests.
        if [ "${passed}" -ne 1 ]; then
          printf '%s' "${ATTEMPTS_RAN}" > "$(results.ATTEMPTS.path)"
          printf '%s' "${LAST_ERROR_TEXT}" > "$(results.LAST_ERROR.path)"
          echo "ERROR: generated tests still failing after ${ATTEMPTS_RAN} attempt(s)." >&2
          exit 1
        fi

        # Merge the passing generated test files (and the test-scoped pom
        # additions, if any) back onto the shared workspace so re-run-tests and
        # open-pr pick them up. Only touch src/test and pom.xml.
        git add -A 2>/dev/null || true
        CHANGED="$(git status --porcelain -- 'src/test' pom.xml 2>/dev/null | cut -c4-)"
        COUNT=0
        if [ -n "${CHANGED}" ]; then
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            mkdir -p "${WORKDIR}/$(dirname "${f}")"
            cp -f "${SCRATCH}/${f}" "${WORKDIR}/${f}"
            COUNT=$((COUNT+1))
          done <<< "${CHANGED}"
        fi
        printf '%s' "${COUNT}" > "$(results.TESTS_ADDED.path)"
        printf '%s' "${ATTEMPTS_RAN}" > "$(results.ATTEMPTS.path)"
        : > "$(results.LAST_ERROR.path)"
        echo "Staged test file changes: ${COUNT}"
  # The functional-test methodology skill (SKILL.md), mounted read-only at
  # ${HOME}/agent-skills/test-generation-functional. Lives in
  # pipelines/config/agent-skills-test-generation-functional.yaml so it
  # ships with the rest of the Tekton config and no image change is needed.
  volumes:
    - name: agent-skills
      configMap:
        name: agent-skills-test-generation-functional
