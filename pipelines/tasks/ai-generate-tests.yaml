apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-generate-tests
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, testing, maven"
spec:
  description: >-
    Use an AI coding agent to generate JUnit unit tests for the application and
    make them pass. The coding agent is selected by AI_AGENT (claude-code |
    aider); aider drives OpenAI-compatible models such as gpt-oss and Granite.
    Backend (provider/model/creds) is supplied via the ai-agent-config ConfigMap
    and ai-agent-secret Secret. Swap the runtime by overriding AGENT_IMAGE.
  params:
    - name: SUBDIRECTORY
      type: string
      description: Project subdirectory within the source workspace (where pom.xml lives).
      default: source
    - name: AGENT_IMAGE
      type: string
      description: >-
        Container image providing the AI agent runtime (JDK17 + Maven + the agent
        CLI). Use the flavor matching AI_AGENT: ai-agent-maven-claude for
        claude-code (default), ai-agent-maven-aider for aider.
      default: quay.io/REPLACE_ME/ai-agent-maven-claude:v1.0.0
    - name: TEST_INSTRUCTIONS
      type: string
      description: Extra natural-language guidance for the test-generation agent.
      default: >-
        Prioritize public service and business-logic classes that currently lack
        coverage. Keep tests deterministic and offline (no network, no live DB).
    - name: SOURCE_PATHS
      type: string
      description: >-
        Space-separated main-source paths given to the agent as read-only
        context. Narrow this (e.g. to a package) on large repos to control token
        cost. Only affects the aider (OpenAI-compatible) path.
      default: src/main/java
  workspaces:
    - name: source
      description: Workspace containing the application source (shared PVC).
  results:
    - name: TESTS_ADDED
      description: Number of new/changed test files staged by the agent.
  stepTemplate:
    envFrom:
      - configMapRef:
          name: ai-agent-config
      - secretRef:
          name: ai-agent-secret
    env:
      - name: HOME
        value: /tekton/home
  steps:
    - name: generate-and-run
      image: $(params.AGENT_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      computeResources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      env:
        - name: TEST_INSTRUCTIONS
          value: $(params.TEST_INSTRUCTIONS)
        - name: SOURCE_PATHS
          value: $(params.SOURCE_PATHS)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WORKDIR="$(workspaces.source.path)/$(params.SUBDIRECTORY)"

        AGENT="${AI_AGENT:-claude-code}"
        MODEL="${AI_MODEL:-claude-opus-5}"
        echo "Generating tests with agent=${AGENT} provider=${AI_PROVIDER:-anthropic} model=${MODEL}"

        # This task forks off clone-repository and runs in parallel with the
        # build/scan chain's Maven build, which writes target/ in this same shared
        # PVC directory. Two Maven builds sharing target/ collide -- overwriting a
        # file another task pod created fails with "Operation not permitted"
        # (maven-resources-plugin can't reset the mtime of a foreign-owned file).
        # So run the agent + verification build in a private, pod-local copy of the
        # repo (excluding the foreign-owned target/; tar re-owns to our uid on
        # extract) and merge only the generated tests back at the end.
        SCRATCH="/tekton/home/aitgt-work"
        rm -rf "${SCRATCH}"; mkdir -p "${SCRATCH}"
        tar -C "${WORKDIR}" --exclude=./target -cf - . | tar -C "${SCRATCH}" -xf -
        cd "${SCRATCH}"

        PROMPT="You are working in a Quarkus/Maven project at the current directory.
        Generate JUnit 5 unit tests for classes that lack coverage. Put tests under
        src/test/java mirroring the package layout. Do NOT modify application source
        under src/main. The relevant source files are already available to you --
        do NOT ask for more files to be added; create the test files directly. After
        writing tests, run 'mvn -B -q -Dstyle.color=never test' and iterate until the
        tests you added pass. ${TEST_INSTRUCTIONS}"

        # --- Dispatch to the configured coding agent ---
        case "${AGENT}" in
          aider)
            # OpenAI-compatible coding agent (gpt-oss, Granite, any vLLM/RHOAI/
            # Ollama/watsonx endpoint). litellm reads OPENAI_API_BASE/OPENAI_API_KEY.
            [ -n "${AI_BASE_URL:-}" ] && export OPENAI_API_BASE="${AI_BASE_URL}"
            export OPENAI_API_KEY="${OPENAI_API_KEY:-placeholder}"
            case "${MODEL}" in */*) AIDER_MODEL="${MODEL}";; *) AIDER_MODEL="openai/${MODEL}";; esac
            # Pass main sources as read-only reference so the agent only creates
            # files under src/test; --map-tokens bounds the repo-map context and
            # --subtree-only keeps aider scoped to this project dir.
            # --no-show-model-warnings silences litellm's registry lookup for
            # self-hosted models (gpt-oss/Granite aren't in its cost table).
            READ_ARGS=""
            for p in ${SOURCE_PATHS:-src/main/java}; do READ_ARGS="${READ_ARGS} --read ${p}"; done
            aider \
              --model "${AIDER_MODEL}" \
              --yes-always --no-auto-commits --no-check-update --no-gitignore \
              --no-show-model-warnings \
              --map-tokens 1024 --subtree-only \
              ${READ_ARGS} \
              --message "${PROMPT}" \
              2>&1 | tee /tekton/home/aider-generate-tests.log
            ;;
          claude-code|*)
            # Configure Claude Code auth from ai-agent-config / ai-agent-secret.
            case "${AI_PROVIDER:-anthropic}" in
              bedrock) export CLAUDE_CODE_USE_BEDROCK=1 ;;
              vertex)  export CLAUDE_CODE_USE_VERTEX=1 ;;
              gateway) export ANTHROPIC_BASE_URL="${AI_BASE_URL:?AI_BASE_URL required for gateway provider}" ;;
              anthropic|*) : ;;
            esac
            export ANTHROPIC_MODEL="${MODEL}"
            # Headless, non-interactive run. --allowedTools limits what runs
            # without prompting; acceptEdits lets it write files unattended.
            claude -p "${PROMPT}" \
              --model "${ANTHROPIC_MODEL}" \
              --permission-mode acceptEdits \
              --allowedTools "Read,Write,Edit,Glob,Grep,Bash(mvn:*)" \
              --output-format json | tee /tekton/home/claude-generate-tests.json
            ;;
        esac

        # Hard gate: the tests the agent added must pass. Runs in the isolated
        # copy against its own target/, so no collision with the build chain.
        mvn -B -q -Dstyle.color=never test

        # Merge generated/changed test files back onto the shared workspace so
        # ai-remediate-dependency and open-pr pick them up. Only touch src/test.
        git add -A 2>/dev/null || true
        # git status --porcelain emits "XY <path>"; strip the 3-char status prefix.
        CHANGED="$(git status --porcelain -- 'src/test' 2>/dev/null | cut -c4-)"
        COUNT=0
        if [ -n "${CHANGED}" ]; then
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            mkdir -p "${WORKDIR}/$(dirname "${f}")"
            cp -f "${SCRATCH}/${f}" "${WORKDIR}/${f}"
            COUNT=$((COUNT+1))
          done <<< "${CHANGED}"
        fi
        printf '%s' "${COUNT}" > "$(results.TESTS_ADDED.path)"
        echo "Staged test file changes: ${COUNT}"
