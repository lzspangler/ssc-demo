apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-pr-tests
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "git, pull-request, gitlab, github, testing"
spec:
  description: >-
    Tests-only variant of open-pr: commit the AI-generated tests (src/test) to
    a new branch and open a PR/MR back to the application repo. Unlike open-pr
    it carries no CVE/dependency-remediation context -- it only submits the
    generated tests. TEST_CATEGORY selects which pipeline's output is being
    submitted: unit stages src/test only, while integration/functional also
    stage pom.xml (their contracts let the agent add TEST-SCOPED dependencies
    such as WireMock or REST Assured). Supports GitLab (glab) and GitHub (gh).
    Auth comes from the SCM_SECRET_NAME secret (keys: token, username).
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: GIT_URL
      type: string
      description: HTTPS URL of the application repository.
    - name: GIT_HOST
      type: string
      description: SCM host, e.g. gitlab-gitlab.apps.cluster.example.com
    - name: SCM_PROVIDER
      type: string
      description: gitlab | github
      default: gitlab
    - name: BASE_BRANCH
      type: string
      default: master
    - name: ISSUE_IID
      type: string
      description: >-
        SCM issue number to cross-reference from the MR/PR (adds "Related to #N"
        to the body). Set only when the run was started from an issue comment;
        empty (the default) for manual or other triggers, which leaves the body
        with no issue reference.
      default: ""
    - name: SCM_SECRET_NAME
      type: string
      default: scm-auth-secret
    - name: TEST_CATEGORY
      type: string
      description: >-
        Which test category the generated tests belong to: unit | integration |
        functional. Affects what gets staged and the MR/PR wording: unit stages
        src/test only; integration/functional also stage pom.xml, because their
        skills permit TEST-SCOPED dependency additions (WireMock, Awaitility,
        REST Assured) that the MR must carry or the tests won't compile for the
        reviewer.
      default: unit
    - name: GIT_IMAGE
      type: string
      description: >-
        Image this task runs in. It MUST contain git AND the SCM CLI it calls
        (glab for GitLab, gh for GitHub). The pipeline overrides this with the
        agent image, which bundles all three. WARNING: the default below
        (pipelines-git-init) ships git ONLY -- no glab/gh -- so override it (or
        supply your own git+glab+gh image) when running this task standalone.
      default: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:latest
  workspaces:
    - name: source
  results:
    - name: PR_URL
      description: URL of the created PR/MR (empty if none created).
  volumes:
    - name: scm-secret
      secret:
        secretName: $(params.SCM_SECRET_NAME)
        optional: false
  steps:
    - name: open-pr
      image: $(params.GIT_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      volumeMounts:
        - name: scm-secret
          mountPath: /run/secrets/scm
          readOnly: true
      env:
        - name: HOME
          value: /tekton/home
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_HOST
          value: $(params.GIT_HOST)
        - name: SCM_PROVIDER
          value: $(params.SCM_PROVIDER)
        - name: BASE_BRANCH
          value: $(params.BASE_BRANCH)
        - name: ISSUE_IID
          value: $(params.ISSUE_IID)
        - name: TEST_CATEGORY
          value: $(params.TEST_CATEGORY)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        TOKEN="$(cat /run/secrets/scm/token)"
        USERNAME="$(cat /run/secrets/scm/username 2>/dev/null || echo oauth2)"

        # The workspace repo was cloned by a different arbitrary OpenShift uid than
        # this pod runs as, so git rejects it ("detected dubious ownership") and then
        # behaves as if there is no repo at all. Mark it safe before any git call.
        git config --global --add safe.directory "$(workspaces.source.path)/$(params.SUBDIRECTORY)"
        git config --global --add safe.directory "$(workspaces.source.path)"

        # Confirm we are actually inside the cloned repo. The old diff-based check
        # treated a git *error* (e.g. dubious ownership -> "not a git repository")
        # as "changes detected" and pushed on into git config, which then failed
        # with "not in a git directory". Fail loudly instead.
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "ERROR: $(pwd) is not a git work tree; expected the cloned application repo." >&2
          exit 1
        fi

        # Any staged, unstaged, or untracked change means there is something to PR.
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to submit; skipping PR."
          printf '' > "$(results.PR_URL.path)"
          exit 0
        fi
        echo "Changes detected; preparing PR."

        git config user.email "tekton-bot@${GIT_HOST}"
        git config user.name  "TSSC Test Generation Bot"

        # Commit ONLY the AI-generated tests. The working tree also holds noise from
        # the agent and the build that must NEVER land in the PR -- aider
        # caches/history (.aider.*), Quarkus-generated openapi.json/.yaml,
        # maven-generate/settings.xml, target/, etc. Use an explicit allowlist
        # instead of `git add -A`, which would stage all of it.
        #
        # Stage each pathspec on its own: `git add` aborts the WHOLE operation
        # (staging nothing) if any single pathspec matches zero files, and the
        # module-level globs won't match in a single-module repo. Per-pathspec
        # with `|| true` lets the ones that exist stage while missing ones are
        # skipped; the staged-diff check below is the real "did anything change".
        for ps in src/test '*/src/test'; do
          git add -A -- "${ps}" 2>/dev/null || true
        done
        # integration/functional runs may also carry TEST-SCOPED pom.xml
        # additions (WireMock, Awaitility, REST Assured, a Failsafe binding)
        # from the agent. Stage the pom(s) for those categories only: a unit
        # run never changes pom.xml, and staging it unconditionally would
        # sweep unrelated build changes into a tests-only MR.
        case "${TEST_CATEGORY}" in
          integration|functional)
            for ps in pom.xml '*/pom.xml'; do
              git add -A -- "${ps}" 2>/dev/null || true
            done
            ;;
          unit|*) : ;;
        esac
        if git diff --cached --quiet; then
          echo "No generated test changes to submit after filtering; skipping PR."
          printf '' > "$(results.PR_URL.path)"
          exit 0
        fi

        BRANCH="ai-tests/generated-$(date +%s)"
        git checkout -b "${BRANCH}"
        git commit -m "test: add AI-generated ${TEST_CATEGORY} tests

        Automated by the maven-build-ci AI test-generation pipeline."

        # Build an authenticated push URL from GIT_URL (strip any scheme/creds).
        REPO_PATH="$(echo "${GIT_URL}" | sed -E 's#^https?://##; s#^[^/]+/##; s#\.git$##')"
        PUSH_URL="https://${USERNAME}:${TOKEN}@${GIT_HOST}/${REPO_PATH}.git"
        git push "${PUSH_URL}" "${BRANCH}"

        TITLE="Add AI-generated ${TEST_CATEGORY} tests"
        BODY="Automated ${TEST_CATEGORY}-test generation from the maven-build-ci pipeline.

        Includes AI-generated JUnit tests under src/test. Please review before merging."

        # If this run was started from an issue comment (ISSUE_IID set by the
        # trigger), link the MR/PR back to that issue. GitLab and GitHub both turn
        # "#N" in the body into a cross-reference that shows up as a note in the
        # issue; "Related to" links without auto-closing on merge. Empty ISSUE_IID
        # (manual / non-issue triggers) leaves the body untouched.
        if [ -n "${ISSUE_IID}" ]; then
          BODY="${BODY}

        Related to #${ISSUE_IID}"
        fi

        PR_URL=""
        case "${SCM_PROVIDER}" in
          gitlab)
            # Use the GitLab API directly. This avoids glab's local git/recovery
            # state and supports the demo cluster's self-signed route cert.
            PROJECT_PATH="$(python3 - "${GIT_URL}" <<'PY'
              import sys, urllib.parse
              url = sys.argv[1].split('://', 1)[-1]
              path = url.split('/', 1)[1].removesuffix('.git')
              print(urllib.parse.quote(path, safe=''))
            PY
            )"
            MR_RESPONSE="$(curl -ksS --fail-with-body \
              -H "PRIVATE-TOKEN: ${TOKEN}" \
              --data-urlencode "source_branch=${BRANCH}" \
              --data-urlencode "target_branch=${BASE_BRANCH}" \
              --data-urlencode "title=${TITLE}" \
              --data-urlencode "description=${BODY}" \
              -X POST "https://${GIT_HOST}/api/v4/projects/${PROJECT_PATH}/merge_requests")" || {
                echo "GitLab merge request creation failed: ${MR_RESPONSE}" >&2
                exit 1
              }
            PR_URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["web_url"])' <<<"${MR_RESPONSE}")"
            ;;
          github)
            export GH_HOST="${GIT_HOST}"
            export GH_TOKEN="${TOKEN}"
            PR_URL="$(gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body "${BODY}" 2>&1 | grep -Eo 'https?://[^ ]+/pull/[0-9]+' | head -1 || true)"
            ;;
          *)
            echo "Unsupported SCM_PROVIDER: ${SCM_PROVIDER}" >&2
            exit 1
            ;;
        esac

        echo "PR/MR: ${PR_URL:-<none captured>}"
        printf '%s' "${PR_URL}" > "$(results.PR_URL.path)"
