apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhtpa-remediation-report
  annotations:
    tekton.dev/tags: sbom, trustification, remediation
spec:
  description: >-
    Query Red Hat Trusted Profile Analyzer for package remediation
    recommendations for the PURLs contained in a CycloneDX SBOM.

  params:
    - name: COMPONENT_NAME
      type: string

    - name: SBOMS_DIR
      type: string
      default: sboms

    - name: TRUSTIFICATION_SECRET_NAME
      type: string
      default: tpa-secret

    - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
      type: string
      default: "true"

    - name: HTTP_RETRIES
      type: string
      default: "3"

    - name: BATCH_SIZE
      type: string
      default: "128"

  workspaces:
    - name: workspace
      description: >-
        Workspace containing source code, SBOMs and generated reports.

  results:
    - name: REMEDIATION_REPORT
      description: Path to the remediation report.

  volumes:
    - name: trustification-secret
      secret:
        secretName: $(params.TRUSTIFICATION_SECRET_NAME)
        optional: true

    - name: shared-folder
      emptyDir:
        medium: Memory
        sizeLimit: 50Mi

  stepTemplate:
    env:
      - name: COMPONENT_NAME
        value: $(params.COMPONENT_NAME)

      - name: SBOMS_DIR
        value: $(workspaces.workspace.path)/$(params.SBOMS_DIR)

      - name: TRUSTIFICATION_SECRET_NAME
        value: $(params.TRUSTIFICATION_SECRET_NAME)

      - name: TRUSTIFICATION_SECRET_PATH
        value: /run/secrets/trustification

      - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
        value: $(params.FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED)

      - name: HTTP_RETRIES
        value: $(params.HTTP_RETRIES)

      - name: BATCH_SIZE
        value: $(params.BATCH_SIZE)

    volumeMounts:
      - name: trustification-secret
        mountPath: /run/secrets/trustification
        readOnly: true

      - name: shared-folder
        mountPath: /steps-shared-folder

  steps:
    - name: remediation
      image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        read_required_secret_key() {
          local key="$1"

          if [[ -f "$TRUSTIFICATION_SECRET_PATH/$key" ]]; then
            cat "$TRUSTIFICATION_SECRET_PATH/$key"
          else
            echo "Missing configuration: $key" >&2

            if [[ "$FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED" == "false" ]]; then
              echo "WARNING: configuration missing; skipping"
              exit 0
            fi

            exit 1
          fi
        }

        bombastic_api_url="$(read_required_secret_key bombastic_api_url)"
        oidc_issuer_url="$(read_required_secret_key oidc_issuer_url)"
        oidc_client_id="$(read_required_secret_key oidc_client_id)"
        oidc_client_secret="$(read_required_secret_key oidc_client_secret)"

        ca_bundle=/tekton-custom-certs/ca-bundle.crt

        if [[ -f "$ca_bundle" ]]; then
          cp -vf "$ca_bundle" /etc/pki/ca-trust/source/anchors/
          update-ca-trust
        fi

        curl_opts=(
          --silent
          --show-error
          --fail-with-body
          --retry "$HTTP_RETRIES"
        )

        #
        # Locate the SBOM.
        #
        sbom="$SBOMS_DIR/sbom-cyclonedx.json"

        if [[ ! -f "$sbom" ]]; then
          echo "sbom-cyclonedx.json not found; searching..."
          sbom="$(
            find "$SBOMS_DIR" \
              -type f \
              -name '*.json' \
              -print \
              | head -n 1
          )"
        fi

        if [[ -z "$sbom" || ! -f "$sbom" ]]; then
          echo "ERROR: No SBOM found."
          exit 1
        fi

        echo "Using SBOM: $sbom"

        #
        # Extract PURLs.
        #
        jq -e '
          [
            .components[]?
            | select(.purl != null)
            | .purl
          ]
          | unique
        ' "$sbom" > /tmp/purls.json

        purl_count="$(jq 'length' /tmp/purls.json)"

        echo "Found $purl_count PURLs."

        #
        # OIDC discovery.
        #
        openid_configuration_url="${oidc_issuer_url%/}/.well-known/openid-configuration"

        token_endpoint="$(
          curl "${curl_opts[@]}" \
            "$openid_configuration_url" |
            jq -r '.token_endpoint'
        )"

        #
        # Client credentials.
        #
        token_response="$(
          curl "${curl_opts[@]}" \
            -u "${oidc_client_id}:${oidc_client_secret}" \
            -d "grant_type=client_credentials" \
            "$token_endpoint"
        )"

        access_token="$(jq -r '.access_token // empty' <<< "$token_response")"
        token_type="$(jq -r '.token_type // "Bearer"' <<< "$token_response")"

        if [[ -z "$access_token" ]]; then
          echo "ERROR: Failed to obtain access token."
          exit 1
        fi

        #
        # Batch PURLs.
        #
        jq -c \
          --argjson size "$BATCH_SIZE" \
          '
            [
              range(0; length; $size) as $i
              | .[$i:($i + $size)]
            ]
          ' \
          /tmp/purls.json \
          > /tmp/batches.json

        batch_count="$(jq 'length' /tmp/batches.json)"

        rm -f /tmp/recommendations.jsonl

        for ((i=0; i<batch_count; i++)); do

          batch="$(jq -c ".[$i]" /tmp/batches.json)"

          echo "Requesting recommendations: batch $((i + 1))/$batch_count"

          curl "${curl_opts[@]}" \
            -H "authorization: ${token_type} ${access_token}" \
            -H "content-type: application/json" \
            --data "{\"purls\": ${batch}}" \
            "${bombastic_api_url%/}/api/v2/purl/recommend" \
            >> /tmp/recommendations.jsonl

          echo >> /tmp/recommendations.jsonl

        done

        #
        # Preserve each API response rather than trying to flatten
        # the schema. This makes the report useful even if additional
        # recommendation fields are returned.
        #
        jq -s \
          --arg component "$COMPONENT_NAME" \
          --argjson purl_count "$purl_count" \
          '{
            component: $component,
            purlCount: $purl_count,
            recommendations: .
          }' \
          /tmp/recommendations.jsonl \
          > /steps-shared-folder/remediation.json

        #
        # Human-readable report.
        #
        {
          echo "# RHTPA Remediation Report"
          echo
          echo "**Component:** ${COMPONENT_NAME}"
          echo
          echo "**PURLs analyzed:** ${purl_count}"
          echo
          echo "## Recommendations"
          echo

          jq -r '
            .recommendations[]?
            | .recommendations // {}
            | to_entries[]
            |
            "### \(.key)\n" +
            (
              .value[]? |
              "- Recommended package: `\(.package // "N/A")`"
            ) +
            "\n"
          ' /steps-shared-folder/remediation.json

        } > /steps-shared-folder/remediation.md

        cp /steps-shared-folder/remediation.json \
          "$(workspaces.workspace.path)/remediation.json"

        cp /steps-shared-folder/remediation.md \
          "$(workspaces.workspace.path)/remediation.md"

        printf '%s' \
          "$(workspaces.workspace.path)/remediation.json" \
          > "$(results.REMEDIATION_REPORT.path)"

    - name: report
      image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
      script: |
        echo "RHTPA_REMEDIATION_REPORT_BEGIN"
        cat /steps-shared-folder/remediation.md
        echo
        echo "RHTPA_REMEDIATION_REPORT_END"
