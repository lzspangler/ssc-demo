      - name: rebuild
        value: "false"
      taskSpec:
        description: Initialize Pipeline Task, include flags for rebuild and auth.
          Generates image repository secret used by the PipelineRun.
        metadata:
          annotations:
            tekton.dev/pipelines.minVersion: 0.12.1
            tekton.dev/tags: konflux
          labels:
            app.kubernetes.io/version: "0.2"
        params:
        - description: Image URL for build by PipelineRun
          name: image-url
          type: string
        - default: "false"
          description: Rebuild the image if exists
          name: rebuild
          type: string
        - default: "false"
          description: Skip checks against built image
          name: skip-checks
          type: string
        results:
        - description: Defines if the image in param image-url should be built
          name: build
          type: string
        spec: null
        steps:
        - computeResources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
          - name: IMAGE_URL
            value: $(params.image-url)
          - name: REBUILD
            value: "false"
          - name: SKIP_CHECKS
            value: $(params.skip-checks)
          image: registry.access.redhat.com/ubi9/skopeo:9.5-1745865345@sha256:d91eb0dac7308ddfb12193368a42009509925edba80da9ffd3b82d03427dc3ed
          name: init
          script: |
            #!/bin/bash
            echo "Build Initialize: $IMAGE_URL"
            echo

            echo "Determine if Image Already Exists"
            # Build the image when rebuild is set to true or image does not exist
            # The image check comes last to avoid unnecessary, slow API calls
            if [ "$REBUILD" == "true" ] || [ "$SKIP_CHECKS" == "false" ] || ! skopeo inspect --no-tags --raw "docker://$IMAGE_URL" &>/dev/null; then
              echo -n "true" > $(results.build.path)
            else
              echo -n "false" > $(results.build.path)
            fi
    - name: clone-repository
      params:
      - name: url
        value: https://gitlab-gitlab.apps.cluster-j76f8.dyn.redhatworkshops.io/development/my-quarkus-tkn
      - name: revision
        value: 90688b7d792c0acda2c059489c7c1d5ad7e09b88
      runAfter:
      - init
      taskSpec:
        description: The git-clone Task will clone a repo from the provided url into
          the output Workspace. By default the repo will be cloned into the root of
          your Workspace.
        metadata:
          annotations:
            tekton.dev/categories: Git
            tekton.dev/displayName: git clone
            tekton.dev/pipelines.minVersion: 0.21.0
            tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le,linux/arm64
            tekton.dev/tags: git
          labels:
            app.kubernetes.io/version: "0.1"
        params:
        - description: Repository URL to clone from.
          name: url
          type: string
        - default: ""
          description: Revision to checkout. (branch, tag, sha, ref, etc...)
          name: revision
          type: string
        - default: ""
          description: Refspec to fetch before checking out revision.
          name: refspec
          type: string
        - default: "true"
          description: Initialize and fetch git submodules.
          name: submodules
          type: string
        - default: "1"
          description: Perform a shallow clone, fetching only the most recent N commits.
          name: depth
          type: string
        - default: "7"
          description: Length of short commit SHA
          name: shortCommitLength
          type: string
        - default: "true"
          description: Set the `http.sslVerify` global git config. Setting this to
            `false` is not advised unless you are sure that you trust your git remote.
          name: sslVerify
          type: string
        - default: source
          description: Subdirectory inside the `output` Workspace to clone the repo
            into.
          name: subdirectory
          type: string
        - default: ""
          description: Define the directory patterns to match or exclude when performing
            a sparse checkout.
          name: sparseCheckoutDirectories
          type: string
        - default: "true"
          description: Clean out the contents of the destination directory if it already
            exists before cloning.
          name: deleteExisting
          type: string
        - default: ""
          description: HTTP proxy server for non-SSL requests.
          name: httpProxy
          type: string
        - default: ""
          description: HTTPS proxy server for SSL requests.
          name: httpsProxy
          type: string
        - default: ""
          description: Opt out of proxying HTTP/HTTPS requests.
          name: noProxy
          type: string
        - default: "false"
          description: Log the commands that are executed during `git-clone`'s operation.
          name: verbose
          type: string
        - default: ""
          description: Deprecated. Has no effect. Will be removed in the future.
          name: gitInitImage
          type: string
        - default: /tekton/home
          description: |
            Absolute path to the user's home directory. Set this explicitly if you are running the image as a non-root user.
          name: userHome
          type: string
        - default: "true"
          description: |
            Check symlinks in the repo. If they're pointing outside of the repo, the build will fail.
          name: enableSymlinkCheck
          type: string
        - default: "false"
          description: Fetch all tags for the repo.
          name: fetchTags
          type: string
        - default: trusted-ca
          description: The name of the ConfigMap to read CA bundle data from.
          name: caTrustConfigMapName
          type: string
        - default: ca-bundle.crt
          description: The name of the key in the ConfigMap that contains the CA bundle
            data.
          name: caTrustConfigMapKey
          type: string
        - default: "false"
          description: Set to "true" to merge the targetBranch into the checked-out
            revision.
          name: mergeTargetBranch
          type: string
        - default: main
          description: The target branch to merge into the revision (if mergeTargetBranch
            is true).
          name: targetBranch
          type: string
        results:
        - description: The precise commit SHA that was fetched by this Task.
          name: commit
          type: string
        - description: The commit SHA that was fetched by this Task limited to params.shortCommitLength
            number of characters
          name: short-commit
          type: string
        - description: The precise URL that was fetched by this Task.
          name: url
          type: string
        - description: The commit timestamp of the checkout
          name: commit-timestamp
          type: string
        - description: The precise URL that was fetched by this Task. This result
            uses Chains type hinting to include in the provenance.
          name: CHAINS-GIT_URL
          type: string
        - description: The precise commit SHA that was fetched by this Task. This
            result uses Chains type hinting to include in the provenance.
          name: CHAINS-GIT_COMMIT
          type: string
        - description: The SHA of the commit after merging the target branch (if the
            param mergeTargetBranch is true).
          name: merged_sha
          type: string
        spec: null
        steps:
        - computeResources: {}
          env:
          - name: HOME
            value: $(params.userHome)
          - name: PARAM_URL
            value: $(params.url)
          - name: PARAM_REVISION
            value: 90688b7d792c0acda2c059489c7c1d5ad7e09b88
          - name: PARAM_REFSPEC
            value: $(params.refspec)
          - name: PARAM_SUBMODULES
            value: $(params.submodules)
          - name: PARAM_DEPTH
            value: $(params.depth)
          - name: PARAM_SHORT_COMMIT_LENGTH
            value: $(params.shortCommitLength)
          - name: PARAM_SSL_VERIFY
            value: $(params.sslVerify)
          - name: PARAM_SUBDIRECTORY
            value: $(params.subdirectory)
          - name: PARAM_DELETE_EXISTING
            value: $(params.deleteExisting)
          - name: PARAM_HTTP_PROXY
            value: $(params.httpProxy)
          - name: PARAM_HTTPS_PROXY
            value: $(params.httpsProxy)
          - name: PARAM_NO_PROXY
            value: $(params.noProxy)
          - name: PARAM_VERBOSE
            value: $(params.verbose)
          - name: PARAM_SPARSE_CHECKOUT_DIRECTORIES
            value: $(params.sparseCheckoutDirectories)
          - name: PARAM_USER_HOME
            value: $(params.userHome)
          - name: PARAM_FETCH_TAGS
            value: $(params.fetchTags)
          - name: PARAM_GIT_INIT_IMAGE
            value: $(params.gitInitImage)
          - name: PARAM_MERGE_TARGET_BRANCH
            value: $(params.mergeTargetBranch)
          - name: PARAM_TARGET_BRANCH
            value: $(params.targetBranch)
          - name: WORKSPACE_OUTPUT_PATH
            value: $(workspaces.output.path)
          - name: WORKSPACE_SSH_DIRECTORY_BOUND
            value: $(workspaces.ssh-directory.bound)
          - name: WORKSPACE_SSH_DIRECTORY_PATH
            value: $(workspaces.ssh-directory.path)
          - name: WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND
            value: $(workspaces.basic-auth.bound)
          - name: WORKSPACE_BASIC_AUTH_DIRECTORY_PATH
            value: $(workspaces.basic-auth.path)
          image: quay.io/konflux-ci/git-clone@sha256:4e53ebd9242f05ca55bfc8d58b3363d8b9d9bc3ab439d9ab76cdbdf5b1fd42d9
          name: clone
          script: |
            #!/usr/bin/env sh
            set -eu

            if [ "${PARAM_VERBOSE}" = "true" ] ; then
              set -x
            fi

            if [ -n "${PARAM_GIT_INIT_IMAGE}" ]; then
              echo "WARNING: provided deprecated gitInitImage parameter has no effect."
            fi

            if [ "${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}" = "true" ] ; then
              if [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials" ] && [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig" ]; then
                cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials" "${PARAM_USER_HOME}/.git-credentials"
                cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig" "${PARAM_USER_HOME}/.gitconfig"
              # Compatibility with kubernetes.io/basic-auth secrets
              elif [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username" ] && [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password" ]; then
                HOSTNAME=$(echo $PARAM_URL | awk -F/ '{print $3}')
                echo "https://$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username):$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password)@$HOSTNAME" > "${PARAM_USER_HOME}/.git-credentials"
                echo -e "[credential \"https://$HOSTNAME\"]\n  helper = store" > "${PARAM_USER_HOME}/.gitconfig"
              else
                echo "Unknown basic-auth workspace format"
                exit 1
              fi
              chmod 400 "${PARAM_USER_HOME}/.git-credentials"
              chmod 400 "${PARAM_USER_HOME}/.gitconfig"
            fi

            # Should be called after the gitconfig is copied from the repository secret
            ca_bundle=/mnt/trusted-ca/ca-bundle.crt
            if [ -f "$ca_bundle" ]; then
              echo "INFO: Using mounted CA bundle: $ca_bundle"
              git config --global http.sslCAInfo "$ca_bundle"
            fi

            if [ "${WORKSPACE_SSH_DIRECTORY_BOUND}" = "true" ] ; then
              cp -R "${WORKSPACE_SSH_DIRECTORY_PATH}" "${PARAM_USER_HOME}"/.ssh
              chmod 700 "${PARAM_USER_HOME}"/.ssh
              chmod -R 400 "${PARAM_USER_HOME}"/.ssh/*
            fi

            CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"

            cleandir() {
              # Delete any existing contents of the repo directory if it exists.
              #
              # We don't just "rm -rf ${CHECKOUT_DIR}" because ${CHECKOUT_DIR} might be "/"
              # or the root of a mounted volume.
              if [ -d "${CHECKOUT_DIR}" ] ; then
                # Delete non-hidden files and directories
                rm -rf "${CHECKOUT_DIR:?}"/*
                # Delete files and directories starting with . but excluding ..
                rm -rf "${CHECKOUT_DIR}"/.[!.]*
                # Delete files and directories starting with .. plus any other character
                rm -rf "${CHECKOUT_DIR}"/..?*
              fi
            }

            if [ "${PARAM_DELETE_EXISTING}" = "true" ] ; then
              cleandir
            fi

            test -z "${PARAM_HTTP_PROXY}" || export HTTP_PROXY="${PARAM_HTTP_PROXY}"
            test -z "${PARAM_HTTPS_PROXY}" || export HTTPS_PROXY="${PARAM_HTTPS_PROXY}"
            test -z "${PARAM_NO_PROXY}" || export NO_PROXY="${PARAM_NO_PROXY}"

            /ko-app/git-init \
              -url="${PARAM_URL}" \
              -revision="${PARAM_REVISION}" \
              -refspec="${PARAM_REFSPEC}" \
              -path="${CHECKOUT_DIR}" \
              -sslVerify="${PARAM_SSL_VERIFY}" \
              -submodules="${PARAM_SUBMODULES}" \
              -depth="${PARAM_DEPTH}" \
              -sparseCheckoutDirectories="${PARAM_SPARSE_CHECKOUT_DIRECTORIES}"
            cd "${CHECKOUT_DIR}"
            RESULT_SHA="$(git rev-parse HEAD)"
            RESULT_SHA_SHORT="$(git rev-parse --short="${PARAM_SHORT_COMMIT_LENGTH}" HEAD)"
            EXIT_CODE="$?"
            if [ "${EXIT_CODE}" != 0 ] ; then
              exit "${EXIT_CODE}"
            fi
            if [ "${PARAM_MERGE_TARGET_BRANCH}" = "true" ]; then
              echo "Merge option enabled. Attempting to merge target branch '${PARAM_TARGET_BRANCH}' into HEAD (${RESULT_SHA})."
              echo "Fetching target branch '${PARAM_TARGET_BRANCH}'..."
              git fetch origin "${PARAM_TARGET_BRANCH}"
              FETCH_EXIT_CODE="$?"
              if [ "${FETCH_EXIT_CODE}" != "0" ]; then
                echo "ERROR: Failed to fetch target branch '${PARAM_TARGET_BRANCH}'." >&2
                exit "${FETCH_EXIT_CODE}"
              fi
              echo "Merging origin/${PARAM_TARGET_BRANCH} into current HEAD..."
              git config --global user.email "tekton-git-clone@tekton.dev"
              git config --global user.name "Tekton Git Clone Task"
              git merge "origin/${PARAM_TARGET_BRANCH}" --no-commit --no-ff --allow-unrelated-histories
              MERGE_CHECK_EXIT_CODE="$?"
              if [ "${MERGE_CHECK_EXIT_CODE}" != "0" ] ; then
                echo "ERROR: Merge conflict detected or merge failed before commit." >&2
                echo "--- Git Status ---"
                git status
                echo "------------------"
                exit "${MERGE_CHECK_EXIT_CODE}"
              else
                echo "Merge successful (no conflicts found), committing..."
                git commit -m "Merge branch '${PARAM_TARGET_BRANCH}' into ${RESULT_SHA}"
                COMMIT_EXIT_CODE="$?"
                if [ "${COMMIT_EXIT_CODE}" != "0" ]; then
                  echo "ERROR: Failed to commit merge." >&2
                  exit "${COMMIT_EXIT_CODE}"
                fi
                MERGED_SHA=$(git rev-parse HEAD)
                echo "New HEAD after merge: ${MERGED_SHA}"
                echo "${MERGED_SHA}" > "$(results.merged_sha.path)"
              fi
            else
              echo "Merge option disabled. Using checked-out revision ${RESULT_SHA} directly."
            fi
            printf "%s" "${RESULT_SHA}" > "$(results.commit.path)"
            printf "%s" "${RESULT_SHA}" > "$(results.CHAINS-GIT_COMMIT.path)"
            printf "%s" "${RESULT_SHA_SHORT}" > "$(results.short-commit.path)"
            printf "%s" "${PARAM_URL}" > "$(results.url.path)"
            printf "%s" "${PARAM_URL}" > "$(results.CHAINS-GIT_URL.path)"
            printf "%s" "$(git log -1 --pretty=%ct)" > "$(results.commit-timestamp.path)"

            if [ "${PARAM_FETCH_TAGS}" = "true" ] ; then
              echo "Fetching tags"
              if ! git fetch --tags; then
                echo "Retrying fetch command..."
                git fetch --tags
              fi
            fi
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /mnt/trusted-ca
            name: trusted-ca
            readOnly: true
        - computeResources: {}
          env:
          - name: PARAM_ENABLE_SYMLINK_CHECK
            value: $(params.enableSymlinkCheck)
          - name: PARAM_SUBDIRECTORY
            value: $(params.subdirectory)
          - name: WORKSPACE_OUTPUT_PATH
            value: $(workspaces.output.path)
          image: quay.io/konflux-ci/git-clone@sha256:4e53ebd9242f05ca55bfc8d58b3363d8b9d9bc3ab439d9ab76cdbdf5b1fd42d9
          name: symlink-check
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
            check_symlinks() {
              FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=false
              while read -r symlink
              do
                target=$(readlink -m "$symlink")
                if ! [[ "$target" =~ ^$CHECKOUT_DIR ]]; then
                  echo "The cloned repository contains symlink pointing outside of the cloned repository: $symlink"
                  FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=true
                fi
              done < <(find $CHECKOUT_DIR -type l -print)
              if [ "$FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO" = true ] ; then
                return 1
              fi
            }

            if [ "${PARAM_ENABLE_SYMLINK_CHECK}" = "true" ] ; then
              echo "Running symlink check"
              check_symlinks
            fi
        volumes:
        - configMap:
            items:
            - key: $(params.caTrustConfigMapKey)
              path: ca-bundle.crt
            name: $(params.caTrustConfigMapName)
            optional: true
          name: trusted-ca
        workspaces:
        - description: The git repo will be cloned onto the volume backing this Workspace.
          name: output
        - description: |
            A .ssh directory with private key, known_hosts, config, etc. Copied to
            the user's home before git commands are executed. Used to authenticate
            with the git remote when performing the clone. Binding a Secret to this
            Workspace is strongly recommended over other volume types.
          name: ssh-directory
          optional: true
        - description: |
            A Workspace containing a .gitconfig and .git-credentials file or username and password.
            These will be copied to the user's home before any git commands are run. Any
            other files in this Workspace are ignored. It is strongly recommended
            to use ssh-directory over basic-auth whenever possible and to bind a
            Secret to this Workspace over other volume types.
          name: basic-auth
          optional: true
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      workspaces:
      - name: output
        workspace: workspace
      - name: basic-auth
        workspace: git-auth
    - name: verify-commit
      params:
      - name: certificate-identity
        value: user5@demo.redhat.com
      - name: oidc-issuer
        value: https://sso.apps.cluster-j76f8.dyn.redhatworkshops.io/realms/tssc-iam
      - name: rekor-url
        value: http://rekor-server.tssc-tas.svc
      - name: tuf-mirror
        value: http://tuf.tssc-tas.svc
      runAfter:
      - clone-repository
      taskSpec:
        description: This task verifies the latest commit signature
        metadata: {}
        params:
        - default: http://tuf.tssc-tas.svc
          description: TUF mirror
          name: tuf-mirror
          type: string
        - default: userX@domain.com
          description: Email address of committer
          name: certificate-identity
          type: string
        - default: https://sso.<domain>/realms/trusted-artifact-signer
          description: OIDC issuer
          name: oidc-issuer
          type: string
        - default: http://rekor-server.tssc-tas.svc
          description: Rekor URL
          name: rekor-url
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: GITSIGN_REKOR_URL
            value: http://rekor-server.tssc-tas.svc
        steps:
        - computeResources: {}
          env:
          - name: GITSIGN_REKOR_URL
            value: http://rekor-server.tssc-tas.svc
          image: registry.access.redhat.com/ubi9/toolbox@sha256:47d4891b3e744f5622a31bd21a42dd51358c43bbfd44860cc05c7b29cc520e66
          name: git-verify
          script: |
            wget -q http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/cosign-amd64.gz
            wget -q http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/gitsign-amd64.gz
            gunzip cosign-amd64.gz
            chmod a+x cosign-amd64
            mv cosign-amd64 /usr/local/bin/cosign
            gunzip gitsign-amd64.gz
            chmod a+x gitsign-amd64
            mv gitsign-amd64 /usr/local/bin/gitsign

            git config --global --add safe.directory /workspace/repository/source
            cosign initialize --mirror=http://tuf.tssc-tas.svc --root=http://tuf.tssc-tas.svc/root.json
            git show -s
            gitsign verify --certificate-identity=user5@demo.redhat.com --certificate-oidc-issuer=https://sso.apps.cluster-j76f8.dyn.redhatworkshops.io/realms/tssc-iam HEAD \
            || (echo "Unable to verify commit signature!" && exit 1)
          workingDir: /workspace/repository/source
        workspaces:
        - name: repository
      when:
      - input: "true"
        operator: in
        values:
        - "true"
      workspaces:
      - name: repository
        workspace: workspace
    - name: package
      params:
      - name: SUBDIRECTORY
        value: source
      runAfter:
      - verify-commit
      taskSpec:
        description: This Task can be used to run a Maven build.
        metadata:
          annotations:
            artifacthub.io/category: integration-delivery
            artifacthub.io/maintainers: |
              - name: OpenShift Pipeline task maintainers
                email: pipelines-extcomm@redhat.com
            artifacthub.io/provider: Red Hat
            artifacthub.io/recommendations: |
              - url: https://tekton.dev/
            operator.tekton.dev/last-applied-hash: 92337fce14d73a99059e953f7b738cacb887c097740bf066086542beae7529c2
            tekton.dev/categories: containers
            tekton.dev/pipelines.minVersion: 0.41.0
            tekton.dev/source: https://github.com/openshift-pipelines/task-maven
            tekton.dev/tags: containers
          labels:
            app.kubernetes.io/version: 0.4.0
            operator.tekton.dev/operand-name: openshift-pipelines-addons
            operator.tekton.dev/provider-type: redhat
        params:
        - default:
          - package
          description: maven goals to run
          name: GOALS
          type: array
        - default: ""
          description: The Maven repository mirror url
          name: MAVEN_MIRROR_URL
