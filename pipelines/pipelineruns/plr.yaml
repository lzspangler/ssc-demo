          name: report
          script: |
            #!/usr/bin/env bash
            cat /steps-shared-folder/acs-image-scan.json
          volumeMounts:
          - mountPath: /steps-shared-folder
            name: shared-folder
        volumes:
        - name: rox-secret
          secret:
            optional: true
            secretName: $(params.rox-secret-name)
