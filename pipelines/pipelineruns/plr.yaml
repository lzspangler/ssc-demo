          name: IMAGE_DIGEST
          type: string
        - description: Image repository and tag where the built image was pushed
          name: IMAGE_URL
          type: string
        - description: Digests of the base images used for build
          name: BASE_IMAGES_DIGESTS
          type: string
        - description: Link to the SBOM layer pushed to the registry as part of an
            OCI artifact.
          name: SBOM_BLOB_URL
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: STORAGE_DRIVER
            value: $(params.STORAGE_DRIVER)
          - name: CONTEXT
            value: $(params.CONTEXT)
          - name: DOCKERFILE
            value: $(params.DOCKERFILE)
          - name: IMAGE
