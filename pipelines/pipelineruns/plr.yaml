            if [ "${PARAM_VERBOSE}" = "true" ] ; then
              set -x
            fi

            if [ -n "${PARAM_GIT_INIT_IMAGE}" ]; then
              echo "WARNING: provided deprecated gitInitImage parameter has no effect."
            fi

            if [ "${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}" = "true" ] ; then
              if [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials" ] && [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig" ]; then
                cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials" "${PARAM_USER_HOME}/.git-credentials"
                cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig" "${PARAM_USER_HOME}/.gitconfig"
              # Compatibility with kubernetes.io/basic-auth secrets
              elif [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username" ] && [ -f "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password" ]; then
                HOSTNAME=$(echo $PARAM_URL | awk -F/ '{print $3}')
                echo "https://$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username):$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password)@$HOSTNAME" > "${PARAM_USER_HOME}/.git-credentials"
                echo -e "[credential \"https://$HOSTNAME\"]\n  helper = store" > "${PARAM_USER_HOME}/.gitconfig"
              else
                echo "Unknown basic-auth workspace format"
                exit 1
              fi
              chmod 400 "${PARAM_USER_HOME}/.git-credentials"
              chmod 400 "${PARAM_USER_HOME}/.gitconfig"
            fi

            # Should be called after the gitconfig is copied from the repository secret
            ca_bundle=/mnt/trusted-ca/ca-bundle.crt
            if [ -f "$ca_bundle" ]; then
              echo "INFO: Using mounted CA bundle: $ca_bundle"
              git config --global http.sslCAInfo "$ca_bundle"
            fi

            if [ "${WORKSPACE_SSH_DIRECTORY_BOUND}" = "true" ] ; then
              cp -R "${WORKSPACE_SSH_DIRECTORY_PATH}" "${PARAM_USER_HOME}"/.ssh
              chmod 700 "${PARAM_USER_HOME}"/.ssh
              chmod -R 400 "${PARAM_USER_HOME}"/.ssh/*
            fi

            CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"

            cleandir() {
              # Delete any existing contents of the repo directory if it exists.
              #
              # We don't just "rm -rf ${CHECKOUT_DIR}" because ${CHECKOUT_DIR} might be "/"
              # or the root of a mounted volume.
              if [ -d "${CHECKOUT_DIR}" ] ; then
                # Delete non-hidden files and directories
                rm -rf "${CHECKOUT_DIR:?}"/*
                # Delete files and directories starting with . but excluding ..
                rm -rf "${CHECKOUT_DIR}"/.[!.]*
                # Delete files and directories starting with .. plus any other character
                rm -rf "${CHECKOUT_DIR}"/..?*
              fi
            }

            if [ "${PARAM_DELETE_EXISTING}" = "true" ] ; then
              cleandir
            fi

            test -z "${PARAM_HTTP_PROXY}" || export HTTP_PROXY="${PARAM_HTTP_PROXY}"
            test -z "${PARAM_HTTPS_PROXY}" || export HTTPS_PROXY="${PARAM_HTTPS_PROXY}"
            test -z "${PARAM_NO_PROXY}" || export NO_PROXY="${PARAM_NO_PROXY}"

            /ko-app/git-init \
              -url="${PARAM_URL}" \
              -revision="${PARAM_REVISION}" \
              -refspec="${PARAM_REFSPEC}" \
              -path="${CHECKOUT_DIR}" \
              -sslVerify="${PARAM_SSL_VERIFY}" \
              -submodules="${PARAM_SUBMODULES}" \
              -depth="${PARAM_DEPTH}" \
              -sparseCheckoutDirectories="${PARAM_SPARSE_CHECKOUT_DIRECTORIES}"
            cd "${CHECKOUT_DIR}"
            RESULT_SHA="$(git rev-parse HEAD)"
            RESULT_SHA_SHORT="$(git rev-parse --short="${PARAM_SHORT_COMMIT_LENGTH}" HEAD)"
            EXIT_CODE="$?"
            if [ "${EXIT_CODE}" != 0 ] ; then
              exit "${EXIT_CODE}"
            fi
            if [ "${PARAM_MERGE_TARGET_BRANCH}" = "true" ]; then
              echo "Merge option enabled. Attempting to merge target branch '${PARAM_TARGET_BRANCH}' into HEAD (${RESULT_SHA})."
              echo "Fetching target branch '${PARAM_TARGET_BRANCH}'..."
              git fetch origin "${PARAM_TARGET_BRANCH}"
              FETCH_EXIT_CODE="$?"
              if [ "${FETCH_EXIT_CODE}" != "0" ]; then
                echo "ERROR: Failed to fetch target branch '${PARAM_TARGET_BRANCH}'." >&2
                exit "${FETCH_EXIT_CODE}"
              fi
              echo "Merging origin/${PARAM_TARGET_BRANCH} into current HEAD..."
              git config --global user.email "tekton-git-clone@tekton.dev"
              git config --global user.name "Tekton Git Clone Task"
              git merge "origin/${PARAM_TARGET_BRANCH}" --no-commit --no-ff --allow-unrelated-histories
              MERGE_CHECK_EXIT_CODE="$?"
              if [ "${MERGE_CHECK_EXIT_CODE}" != "0" ] ; then
                echo "ERROR: Merge conflict detected or merge failed before commit." >&2
                echo "--- Git Status ---"
                git status
                echo "------------------"
                exit "${MERGE_CHECK_EXIT_CODE}"
              else
                echo "Merge successful (no conflicts found), committing..."
                git commit -m "Merge branch '${PARAM_TARGET_BRANCH}' into ${RESULT_SHA}"
                COMMIT_EXIT_CODE="$?"
                if [ "${COMMIT_EXIT_CODE}" != "0" ]; then
                  echo "ERROR: Failed to commit merge." >&2
                  exit "${COMMIT_EXIT_CODE}"
                fi
                MERGED_SHA=$(git rev-parse HEAD)
                echo "New HEAD after merge: ${MERGED_SHA}"
                echo "${MERGED_SHA}" > "$(results.merged_sha.path)"
              fi
            else
              echo "Merge option disabled. Using checked-out revision ${RESULT_SHA} directly."
            fi
            printf "%s" "${RESULT_SHA}" > "$(results.commit.path)"
            printf "%s" "${RESULT_SHA}" > "$(results.CHAINS-GIT_COMMIT.path)"
            printf "%s" "${RESULT_SHA_SHORT}" > "$(results.short-commit.path)"
            printf "%s" "${PARAM_URL}" > "$(results.url.path)"
            printf "%s" "${PARAM_URL}" > "$(results.CHAINS-GIT_URL.path)"
            printf "%s" "$(git log -1 --pretty=%ct)" > "$(results.commit-timestamp.path)"

            if [ "${PARAM_FETCH_TAGS}" = "true" ] ; then
              echo "Fetching tags"
              if ! git fetch --tags; then
                echo "Retrying fetch command..."
                git fetch --tags
              fi
            fi
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /mnt/trusted-ca
            name: trusted-ca
            readOnly: true
        - computeResources: {}
          env:
          - name: PARAM_ENABLE_SYMLINK_CHECK
            value: $(params.enableSymlinkCheck)
          - name: PARAM_SUBDIRECTORY
            value: $(params.subdirectory)
          - name: WORKSPACE_OUTPUT_PATH
            value: $(workspaces.output.path)
          image: quay.io/konflux-ci/git-clone@sha256:4e53ebd9242f05ca55bfc8d58b3363d8b9d9bc3ab439d9ab76cdbdf5b1fd42d9
          name: symlink-check
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
            check_symlinks() {
              FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=false
              while read -r symlink
              do
                target=$(readlink -m "$symlink")
                if ! [[ "$target" =~ ^$CHECKOUT_DIR ]]; then
                  echo "The cloned repository contains symlink pointing outside of the cloned repository: $symlink"
                  FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=true
                fi
              done < <(find $CHECKOUT_DIR -type l -print)
              if [ "$FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO" = true ] ; then
                return 1
              fi
            }

            if [ "${PARAM_ENABLE_SYMLINK_CHECK}" = "true" ] ; then
              echo "Running symlink check"
              check_symlinks
            fi
        volumes:
        - configMap:
            items:
            - key: $(params.caTrustConfigMapKey)
              path: ca-bundle.crt
            name: $(params.caTrustConfigMapName)
            optional: true
          name: trusted-ca
        workspaces:
        - description: The git repo will be cloned onto the volume backing this Workspace.
          name: output
        - description: |
            A .ssh directory with private key, known_hosts, config, etc. Copied to
            the user's home before git commands are executed. Used to authenticate
            with the git remote when performing the clone. Binding a Secret to this
            Workspace is strongly recommended over other volume types.
          name: ssh-directory
          optional: true
        - description: |
            A Workspace containing a .gitconfig and .git-credentials file or username and password.
            These will be copied to the user's home before any git commands are run. Any
            other files in this Workspace are ignored. It is strongly recommended
            to use ssh-directory over basic-auth whenever possible and to bind a
            Secret to this Workspace over other volume types.
          name: basic-auth
          optional: true
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      workspaces:
      - name: output
        workspace: workspace
      - name: basic-auth
        workspace: git-auth
    - name: verify-commit
      params:
      - name: certificate-identity
        value: $(params.certificate-identity)
      - name: oidc-issuer
        value: $(params.oidc-issuer)
      - name: rekor-url
        value: $(params.rekor-url)
      - name: tuf-mirror
        value: $(params.tuf-mirror)
      runAfter:
      - clone-repository
      taskSpec:
        description: This task verifies the latest commit signature
        metadata: {}
        params:
        - default: http://tuf.tssc-tas.svc
          description: TUF mirror
          name: tuf-mirror
          type: string
        - default: userX@domain.com
          description: Email address of committer
          name: certificate-identity
          type: string
        - default: https://sso.<domain>/realms/trusted-artifact-signer
          description: OIDC issuer
          name: oidc-issuer
          type: string
        - default: http://rekor-server.tssc-tas.svc
          description: Rekor URL
          name: rekor-url
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: GITSIGN_REKOR_URL
            value: $(params.rekor-url)
        steps:
        - computeResources: {}
          image: registry.access.redhat.com/ubi9/toolbox@sha256:47d4891b3e744f5622a31bd21a42dd51358c43bbfd44860cc05c7b29cc520e66
          name: git-verify
          script: |
            wget -q http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/cosign-amd64.gz
            wget -q http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/gitsign-amd64.gz
            gunzip cosign-amd64.gz
            chmod a+x cosign-amd64
            mv cosign-amd64 /usr/local/bin/cosign
            gunzip gitsign-amd64.gz
            chmod a+x gitsign-amd64
            mv gitsign-amd64 /usr/local/bin/gitsign

            git config --global --add safe.directory /workspace/repository/source
            cosign initialize --mirror=$(params.tuf-mirror) --root=$(params.tuf-mirror)/root.json
            git show -s
            gitsign verify --certificate-identity=$(params.certificate-identity) --certificate-oidc-issuer=$(params.oidc-issuer) HEAD \
            || (echo "Unable to verify commit signature!" && exit 1)
          workingDir: /workspace/repository/source
        workspaces:
        - name: repository
      when:
      - input: $(params.verify-commit)
        operator: in
        values:
        - "true"
      workspaces:
      - name: repository
        workspace: workspace
    - name: package
      params:
      - name: SUBDIRECTORY
        value: source
      runAfter:
      - verify-commit
      taskSpec:
        description: This Task can be used to run a Maven build.
        metadata:
          annotations:
            artifacthub.io/category: integration-delivery
            artifacthub.io/maintainers: |
              - name: OpenShift Pipeline task maintainers
                email: pipelines-extcomm@redhat.com
            artifacthub.io/provider: Red Hat
            artifacthub.io/recommendations: |
              - url: https://tekton.dev/
            operator.tekton.dev/last-applied-hash: 92337fce14d73a99059e953f7b738cacb887c097740bf066086542beae7529c2
            tekton.dev/categories: containers
            tekton.dev/pipelines.minVersion: 0.41.0
            tekton.dev/source: https://github.com/openshift-pipelines/task-maven
            tekton.dev/tags: containers
          labels:
            app.kubernetes.io/version: 0.4.0
            operator.tekton.dev/operand-name: openshift-pipelines-addons
            operator.tekton.dev/provider-type: redhat
        params:
        - default:
          - package
          description: maven goals to run
          name: GOALS
          type: array
        - default: ""
          description: The Maven repository mirror url
          name: MAVEN_MIRROR_URL
          type: string
        - default: .
          description: The subdirectory within the repository for sources on which
            we want to execute maven goals.
          name: SUBDIRECTORY
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: PARAMS_MAVEN_MIRROR_URL
            value: $(params.MAVEN_MIRROR_URL)
          - name: PARAMS_SUBDIRECTORY
            value: $(params.SUBDIRECTORY)
          - name: WORKSPACES_SOURCE_PATH
            value: $(workspaces.source.path)
          - name: WORKSPACES_SOURCE_BOUND
            value: $(workspaces.source.bound)
          - name: WORKSPACES_SERVER_SECRET_PATH
            value: $(workspaces.server_secret.path)
          - name: WORKSPACES_SERVER_SECRET_BOUND
            value: $(workspaces.server_secret.bound)
          - name: WORKSPACES_PROXY_SECRET_PATH
            value: $(workspaces.proxy_secret.path)
          - name: WORKSPACES_PROXY_SECRET_BOUND
            value: $(workspaces.proxy_secret.bound)
          - name: WORKSPACES_PROXY_CONFIGMAP_PATH
            value: $(workspaces.proxy_configmap.path)
          - name: WORKSPACES_PROXY_CONFIGMAP_BOUND
            value: $(workspaces.proxy_configmap.bound)
          - name: WORKSPACES_MAVEN_SETTINGS_PATH
            value: $(workspaces.maven_settings.path)
          - name: WORKSPACES_MAVEN_SETTINGS_BOUND
            value: $(workspaces.maven_settings.bound)
        steps:
        - computeResources: {}
          env:
          - name: HOME
            value: /tekton/home
          image: registry.redhat.io/ubi9/ubi-minimal@sha256:ac61c96b93894b9169221e87718733354dd3765dd4a62b275893c7ff0d876869
          name: maven-generate
          script: |
            set -e
            printf '%s' "" |base64 -d >"/scripts/maven-generate.sh"
            chmod +x /scripts/maven-*.sh;echo "Running Script /scripts/maven-generate.sh";
              /scripts/maven-generate.sh;
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
          - mountPath: /scripts
            name: scripts-dir
          - mountPath: /maven-generate
            name: maven-settings-dir
        - args:
          - -s
          - maven-generate/settings.xml
          - $(params.GOALS[*])
          command:
          - /usr/bin/mvn
          computeResources: {}
          env:
          - name: HOME
            value: /tekton/home
          image: registry.redhat.io/ubi9/openjdk-17@sha256:5d619e202695acf76a5f32c07ace6709f5ee5d3999bf977e1bf95ad34197f44a
          name: maven-goals
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
          - mountPath: /maven-generate
            name: maven-settings-dir
          workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
        volumes:
        - emptyDir: {}
          name: scripts-dir
        - emptyDir: {}
          name: maven-settings-dir
        workspaces:
        - description: The workspace consisting of maven project.
          name: source
        - description: The workspace containing server secrets (username and password)
          name: server_secret
          optional: true
        - description: The workspace containing proxy server access credentials (username,
            password).
          name: proxy_secret
          optional: true
        - description: The workspace containing some proxy values (proxy_port,proxy_host,proxy_protocol,proxy_non_proxy_hosts)
          name: proxy_configmap
          optional: true
        - description: The workspace consisting of the custom maven settings provided
            by the user.
          name: maven_settings
          optional: true
      workspaces:
      - name: source
        workspace: workspace
      - name: maven-settings
        workspace: maven-settings
    - name: build-container
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      - name: BUILD_ARGS_FILE
        value: $(params.build-args-file)
      - name: SBOMS_DIR
        value: $(params.sboms-dir)
      runAfter:
      - package
      taskSpec:
        description: |-
          Buildah task builds source code into a container image and pushes the image into container registry using buildah tool.
          In addition it generates a SBOM file, injects the SBOM file into final container image and pushes the SBOM file as separate image using cosign tool.
        metadata:
          annotations:
            tekton.dev/pipelines.minVersion: 0.12.1
            tekton.dev/tags: containers, rhtap
          labels:
            app.kubernetes.io/version: "0.1"
            build.appstudio.redhat.com/build_type: docker
        params:
        - description: Reference of the image buildah will produce.
          name: IMAGE
          type: string
        - default: ./Dockerfile
          description: Path to the Dockerfile to build.
          name: DOCKERFILE
          type: string
        - default: .
          description: Path to the directory to use as context.
          name: CONTEXT
          type: string
        - default: "true"
          description: Verify the TLS on the registry endpoint (for push/pull to a
            non-TLS registry)
          name: TLSVERIFY
          type: string
        - default: []
          description: Array of --build-arg values ("arg=value" strings)
          name: BUILD_ARGS
          type: array
        - default: ""
          description: Path to a file with build arguments, see https://www.mankier.com/1/buildah-build#--build-arg-file
          name: BUILD_ARGS_FILE
          type: string
        - default: vfs
          description: Storage driver to configure for buildah
          name: STORAGE_DRIVER
          type: string
        - default: sboms
          description: Directory where the sbom will be saved
          name: SBOMS_DIR
          type: string
        results:
        - description: Digest of the image just built
          name: IMAGE_DIGEST
          type: string
        - description: Image repository and tag where the built image was pushed
          name: IMAGE_URL
          type: string
        - description: Digests of the base images used for build
          name: BASE_IMAGES_DIGESTS
          type: string
        - description: Link to the SBOM layer pushed to the registry as part of an
            OCI artifact.
          name: SBOM_BLOB_URL
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: STORAGE_DRIVER
            value: $(params.STORAGE_DRIVER)
          - name: CONTEXT
            value: $(params.CONTEXT)
          - name: DOCKERFILE
            value: $(params.DOCKERFILE)
          - name: IMAGE
            value: $(params.IMAGE)
          - name: TLSVERIFY
            value: $(params.TLSVERIFY)
          - name: BUILD_ARGS_FILE
            value: $(params.BUILD_ARGS_FILE)
          - name: SBOMS_DIR
            value: $(workspaces.source.path)/$(params.SBOMS_DIR)
        steps:
        - args:
          - $(params.BUILD_ARGS[*])
          computeResources: {}
          image: registry.access.redhat.com/ubi9/buildah@sha256:4b82b66a71857c5167abd344cd63bebe3b8026b04b1f35fde4789868dae0af8d
          name: build
          script: |
            ca_bundle=/tekton-custom-certs/ca-bundle.crt
            if [ -f "$ca_bundle" ]; then
              echo "INFO: Using mounted CA bundle: $ca_bundle"
              cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors
              update-ca-trust
            fi

            # Check if the Dockerfile exists
            SOURCE_CODE_DIR=source
            if [ -e "$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE" ]; then
              dockerfile_path="$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE"
            elif [ -e "$SOURCE_CODE_DIR/$DOCKERFILE" ]; then
              dockerfile_path="$SOURCE_CODE_DIR/$DOCKERFILE"
            else
              echo "Cannot find Dockerfile $DOCKERFILE"
              exit 1
            fi

            BUILDAH_ARGS=()
            if [ -n "${BUILD_ARGS_FILE}" ]; then
              BUILDAH_ARGS+=("--build-arg-file=${SOURCE_CODE_DIR}/${BUILD_ARGS_FILE}")
            fi

            for build_arg in "$@"; do
              BUILDAH_ARGS+=("--build-arg=$build_arg")
            done

            # Build the image
            buildah build \
              "${BUILDAH_ARGS[@]}" \
              --tls-verify=$TLSVERIFY \
              --ulimit nofile=4096:4096 \
              -f "$dockerfile_path" -t $IMAGE $SOURCE_CODE_DIR/$CONTEXT

            # Push the image
            buildah push \
              --tls-verify=$TLSVERIFY \
              --retry=5 \
              --digestfile /tmp/files/image-digest $IMAGE \
              docker://$IMAGE

            # Push the image to a unique tag to avoid race conditions
            buildah push \
              --tls-verify="$TLSVERIFY" \
              --retry=5 \
              --digestfile /tmp/files/image-digest "$IMAGE" \
              "docker://${IMAGE%:*}:$(context.taskRun.name)"

            # Set task results
            buildah images --format '{{ .Name }}:{{ .Tag }}@{{ .Digest }}' | grep -v $IMAGE > $(results.BASE_IMAGES_DIGESTS.path)
            cat /tmp/files/image-digest | tee $(results.IMAGE_DIGEST.path)
            echo -n "$IMAGE" | tee $(results.IMAGE_URL.path)

            # Save the image so it can be used in the generate-sbom step
            buildah push "$IMAGE" oci:/tmp/files/image
          securityContext:
            capabilities:
              add:
              - SETFCAP
          volumeMounts:
          - mountPath: /var/lib/containers
            name: varlibcontainers
          - mountPath: /tmp/files
            name: tmpfiles
          workingDir: $(workspaces.source.path)
        - computeResources: {}
          image: registry.redhat.io/rh-syft-tech-preview/syft-rhel9:1.19.0@sha256:070ecb89de5104bb64fbf399a991a975e7d4d7e0cea0f7beb1e591b5591991c8
          name: generate-sboms
          script: |
            syft dir:$(workspaces.source.path)/source --output cyclonedx-json@1.5=/tmp/files/sbom-source.json
            syft oci-dir:/tmp/files/image --output cyclonedx-json@1.5=/tmp/files/sbom-image.json
          volumeMounts:
          - mountPath: /var/lib/containers
            name: varlibcontainers
          - mountPath: /tmp/files
            name: tmpfiles
          workingDir: $(workspaces.source.path)/source
        - computeResources: {}
          env:
          - name: RESULT_PATH
            value: $(results.SBOM_BLOB_URL.path)
          image: registry.access.redhat.com/ubi8/python-311@sha256:43605cb2491ef2297a7acf4b4bf0b7f54f0c91b96daf12ae41c49cc7f192b153
          name: merge-sboms
          script: |
            #!/bin/python3
            import hashlib
            import json
            import os
            import re
            import shutil

            ### load SBOMs ###

            with open("./sbom-image.json") as f:
              image_sbom = json.load(f)

            with open("./sbom-source.json") as f:
              source_sbom = json.load(f)


            ### attempt to deduplicate components ###

            component_list = image_sbom.get("components", [])
            existing_purls = [c["purl"] for c in component_list if "purl" in c]

            for component in source_sbom.get("components", []):
              if "purl" in component:
                if component["purl"] not in existing_purls:
                  component_list.append(component)
                  existing_purls.append(component["purl"])
              else:
                # We won't try to deduplicate components that lack a purl.
                # This should only happen with operating-system type components,
                # which are only reported in the image SBOM.
                component_list.append(component)

            component_list.sort(key=lambda c: c["type"] + c["name"])
            image_sbom["components"] = component_list


            ### write the CycloneDX unified SBOM ###

            with open("./sbom-cyclonedx.json", "w") as f:
              json.dump(image_sbom, f, indent=4)


            ### write the SBOM blob URL result ###

            with open("./sbom-cyclonedx.json", "rb") as f:
              sbom_digest = hashlib.file_digest(f, "sha256").hexdigest()

            # https://github.com/opencontainers/distribution-spec/blob/main/spec.md?plain=1#L160
            tag_regex = "[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}"

            # the tag must be after a colon, but always at the end of the string
            # this avoids conflict with port numbers
            image_without_tag = re.sub(f":{tag_regex}$", "", os.getenv("IMAGE"))

            sbom_blob_url = f"{image_without_tag}@sha256:{sbom_digest}"

            with open(os.getenv("RESULT_PATH"), "w") as f:
              f.write(sbom_blob_url)

            os.makedirs(os.getenv("SBOMS_DIR"), exist_ok=True)
            shutil.copy('./sbom-cyclonedx.json', os.getenv("SBOMS_DIR") + '/sbom-cyclonedx.json')
          volumeMounts:
          - mountPath: /tmp/files
            name: tmpfiles
          workingDir: /tmp/files
        - args:
          - attach
          - sbom
          - --sbom
          - sbom-cyclonedx.json
          - --type
          - cyclonedx
          - $(params.IMAGE)
          command:
          - cosign
          computeResources: {}
          image: registry.redhat.io/rhtas/cosign-rhel9:e28487714294d5c205e95da843e86fd28e4d3355d6a4d328a872c62ed0cf5f93@sha256:6fa39582a3d62a2aa5404397bb638fdd0960f9392db659d033d7bacf70bddfb1
          name: upload-sbom
          volumeMounts:
          - mountPath: /tmp/files
            name: tmpfiles
          workingDir: /tmp/files
        volumes:
        - emptyDir: {}
          name: varlibcontainers
        - emptyDir: {}
          name: tmpfiles
        workspaces:
        - description: Workspace containing the source code to build.
          name: source
      when:
      - input: $(tasks.init.results.build)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: workspace
    - name: upload-sboms-to-trustification
      params:
      - name: COMPONENT_NAME
        value: $(params.component-name)
      - name: SBOMS_DIR
        value: $(params.sboms-dir)
      - name: TRUSTIFICATION_SECRET_NAME
        value: $(params.trustification-secret-name)
      - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
        value: $(params.fail-if-trustification-not-configured)
      runAfter:
      - build-container
      taskSpec:
        description: |-
          Upload an SBOM file to [Trustification] using the [BOMbastic] API.

          [Trustification]: https://github.com/trustification/trustification
          [BOMbastic]: https://github.com/trustification/trustification/tree/main/bombastic

          ## Configuration

          This task requires some configuration and authentication secrets. By default, the task takes
          them from a secret called `trustification-secret` that exists in the same namespace where the
          task runs. You can override the secret name via the `TRUSTIFICATION_SECRET_NAME` param.

          ### trustification-secret

          Required keys:
          - bombastic_api_url: URL of the BOMbastic api host (e.g. https://sbom.trustification.dev)
          - oidc_issuer_url: URL of the OIDC token issuer (e.g. https://sso.trustification.dev/realms/chicken)
          - oidc_client_id: OIDC client ID
          - oidc_client_secret: OIDC client secret

          Optional keys:
          - supported_cyclonedx_version: If the SBOM uses a higher CycloneDX version,
              `syft convert` to the supported version before uploading.
        metadata:
          annotations:
            tekton.dev/tags: sbom, trustification
        params:
        - description: The name of the sbom
          name: COMPONENT_NAME
          type: string
        - default: .
          description: Directory containing SBOM files. The task will search for CycloneDX
            JSON SBOMs recursively in this directory and upload them all to Trustification.
            The path is relative to the 'sboms' workspace.
          name: SBOMS_DIR
          type: string
        - default: "3"
          description: Maximum number of retries for transient HTTP(S) errors
          name: HTTP_RETRIES
          type: string
        - default: trustification-secret
          description: Name of the Secret containing auth and configuration
          name: TRUSTIFICATION_SECRET_NAME
          type: string
        - default: "true"
          description: Should the task fail if the Secret does not contain the required
            keys? (Set "true" to fail, "false" to skip uploading and exit with success).
          name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
          type: string
        spec: null
        stepTemplate:
          computeResources: {}
          env:
          - name: COMPONENT_NAME
            value: $(params.COMPONENT_NAME)
          - name: SBOMS_DIR
            value: $(workspaces.sboms.path)/$(params.SBOMS_DIR)
          - name: HTTP_RETRIES
            value: $(params.HTTP_RETRIES)
          - name: TRUSTIFICATION_SECRET_NAME
            value: $(params.TRUSTIFICATION_SECRET_NAME)
          - name: TRUSTIFICATION_SECRET_PATH
            value: /run/secrets/trustification
          - name: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED
            value: $(params.FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED)
          - name: WORKDIR
            value: /tekton/home
          volumeMounts:
          - mountPath: /run/secrets/trustification
            name: trustification-secret
        steps:
        - computeResources: {}
          image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
          name: gather-sboms
          script: |
            #!/usr/bin/env bash
            set -o errexit -o nounset -o pipefail

            version_lesser_equal() {
              local first
              first="$(printf "%s\n%s" "$1" "$2" | sort --version-sort | head -n 1)"
              [ "$1" = "$first" ]
            }

            if [[ -f "$TRUSTIFICATION_SECRET_PATH/supported_cyclonedx_version" ]]; then
              supported_version="$(cat "$TRUSTIFICATION_SECRET_PATH/supported_cyclonedx_version")"
            else
              echo "The '$TRUSTIFICATION_SECRET_NAME' secret does not set supported_cyclonedx_version, will not check SBOM versions"
              supported_version=""
            fi

            echo "Looking for CycloneDX SBOMs in $SBOMS_DIR"

            find "$SBOMS_DIR" -type f | while read -r filepath; do
              file_relpath=$(realpath "$filepath" --relative-base="$SBOMS_DIR")
              if ! jq empty "$filepath" 2>/dev/null; then
                echo "$file_relpath: not JSON"
                continue
              fi

              if ! jq -e '.bomFormat == "CycloneDX"' "$filepath" >/dev/null; then
                echo "$file_relpath: not a CycloneDX SBOM"
                continue
              fi

              echo "Found CycloneDX SBOM: $file_relpath"
              # The 'id' of each SBOM is checksum of the original content, before (possibly)
              # downgrading the CycloneDX version. The conversion always updates some metadata
              # (timestamp, UUID), changing the checksum. To avoid duplication, use the original
              # checksum.
              sbom_id="sha256:$(sha256sum "$filepath" | cut -d ' ' -f 1)"

              # Symlink the discovered SBOMS to ${WORKDIR}/${sbom_id}.json so that subsequent steps
              # don't have to look for them again.
              sbom_path="$WORKDIR/$sbom_id.json"
              ln -s "$(realpath "$filepath")" "$sbom_path"

              if [[ -n "$supported_version" ]]; then
                sbom_version="$(jq -r ".specVersion" "$sbom_path")"

                if version_lesser_equal "$sbom_version" "$supported_version"; then
                  echo "SBOM version ($sbom_version) is supported (<= $supported_version), will not convert"
                else
                  echo "SBOM version ($sbom_version) is not supported, will convert to $supported_version"
                  printf "%s" "$supported_version" > "${sbom_path}.convert_to_version"
                fi
              fi
            done

            echo "Found $(find "$WORKDIR" -name "*.json" | wc -l) CycloneDX SBOMs"
        - computeResources: {}
          image: registry.redhat.io/rh-syft-tech-preview/syft-rhel9:1.19.0@sha256:070ecb89de5104bb64fbf399a991a975e7d4d7e0cea0f7beb1e591b5591991c8
          name: convert-sboms-if-needed
          script: |
            #!/usr/bin/env bash
            set -o errexit -o nounset -o pipefail

            # Return zero matches when a glob doesn't match rather than returning the glob itself
            shopt -s nullglob

            for sbom_path in "$WORKDIR"/*.json; do
              conversion_attr="${sbom_path}.convert_to_version"

              if [[ -f "$conversion_attr" ]]; then
                cdx_version="$(cat "$conversion_attr")"
                original_sbom_path="$(realpath "$sbom_path")"
                original_sbom_relpath="$(realpath "$sbom_path" --relative-base="$SBOMS_DIR")"

                echo "Converting $original_sbom_relpath to CycloneDX $cdx_version"
                syft convert "$original_sbom_path" -o "cyclonedx-json@${cdx_version}=${sbom_path}.supported_version"
              else
                # Just duplicate the symlink, the original SBOM already has a supported CDX version
                cp --no-dereference "$sbom_path" "${sbom_path}.supported_version"
              fi
            done
        - computeResources: {}
          image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
          name: upload-sboms
          script: |
            #!/usr/bin/env bash
            set -o errexit -o nounset -o pipefail

            ca_bundle=/tekton-custom-certs/ca-bundle.crt
            if [ -f "$ca_bundle" ]; then
              echo "INFO: Using mounted CA bundle: $ca_bundle"
              cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors
              update-ca-trust
            fi

            shopt -s nullglob
            sboms_to_upload=("$WORKDIR"/*.json)

            if [[ "${#sboms_to_upload[@]}" -eq 0 ]]; then
              echo "No SBOMs to upload"
              exit 0
            fi

            read_required_secret_key() {
              local key="$1"
              if [[ -f "$TRUSTIFICATION_SECRET_PATH/$key" ]]; then
                cat "$TRUSTIFICATION_SECRET_PATH/$key"
              else
                echo "Missing configuration: $key" >&2
                echo "Does the '$TRUSTIFICATION_SECRET_NAME' secret exist in your namespace and contain the required keys?" >&2
                echo "Refer to the description of this Task for details." >&2

                if [[ "$FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED" == "false" ]]; then
                  echo "WARNING: FAIL_IF_TRUSTIFICATION_NOT_CONFIGURED=false; exiting with success" >&2
                  exit 0
                else
                  exit 1
                fi
              fi
            }

            bombastic_api_url="$(read_required_secret_key bombastic_api_url)"
            oidc_issuer_url="$(read_required_secret_key oidc_issuer_url)"
            oidc_client_id="$(read_required_secret_key oidc_client_id)"
            oidc_client_secret="$(read_required_secret_key oidc_client_secret)"

            curl_opts=(--silent --show-error --fail-with-body --retry "$HTTP_RETRIES")

            # https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderConfig
            openid_configuration_url="${oidc_issuer_url%/}/.well-known/openid-configuration"
            echo "Getting OIDC issuer configuration from $openid_configuration_url"
            # https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
            token_endpoint="$(curl "${curl_opts[@]}" "$openid_configuration_url" | jq -r .token_endpoint)"

            for sbom_path in "${sboms_to_upload[@]}"; do
              original_sbom_relpath="$(realpath "$sbom_path" --relative-base="$SBOMS_DIR")"
              echo
              echo "--- Processing $original_sbom_relpath ---"

              echo "Getting OIDC token from $token_endpoint"
              token_response="$(
                curl "${curl_opts[@]}" \
                  -u "${oidc_client_id}:${oidc_client_secret}" \
                  -d "grant_type=client_credentials" \
                  "$token_endpoint"
              )"
              # https://www.rfc-editor.org/rfc/rfc6749.html#section-5.1
              access_token="$(jq -r .access_token <<< "$token_response")"
              token_type="$(jq -r .token_type <<< "$token_response")"
              expires_in="$(jq -r ".expires_in // empty" <<< "$token_response")"

              retry_max_time=0  # no limit
              if [[ -n "$expires_in" ]]; then
                retry_max_time="$expires_in"
              fi

              # This sbom_id is the one created in the gather-sboms step - sha256:${checksum}
              sbom_id="$(basename -s .json "$sbom_path")"
              supported_version_of_sbom="${sbom_path}.supported_version"

              # Inject the component name into the SBOM
              echo
              echo "--- Injecting component name ---"
              jq --arg newname "$COMPONENT_NAME" '.metadata.component.name = $newname' "$supported_version_of_sbom" > /tmp/tmp-sbom.json
              mv /tmp/tmp-sbom.json "$supported_version_of_sbom"

              # Generate URL to the SBOM in TPA and write it to a JSON file to use for eyecatcher
              tpa_url=${bombastic_api_url//sbom/console}
              tpa_sbom_id="${sbom_id//sha256:/sha256%3A}"
              jq -n \
                --arg url "$tpa_url/sbom/content/$tpa_sbom_id" \
                '{"TPA_SBOM_URL": $url}' \
                  > /steps-shared-folder/tpa-sbom-url.json

              echo "Uploading SBOM to $bombastic_api_url (with id=$sbom_id)"
              # https://docs.trustification.dev/trustification/user/bombastic.html#publishing-an-sbom-doc
              curl "${curl_opts[@]}" \
                --retry-max-time "$retry_max_time" \
                -H "authorization: $token_type $access_token" \
                -H "transfer-encoding: chunked" \
                -H "content-type: application/json" \
                --data "@$supported_version_of_sbom" \
                "$bombastic_api_url/api/v2/sbom?id=$sbom_id"
            done
          volumeMounts:
          - mountPath: /steps-shared-folder
            name: shared-folder
        - computeResources: {}
          image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
          name: report
          script: |
            echo "TPA_SBOM_URL_EYECATCHER_BEGIN"
            cat /steps-shared-folder/tpa-sbom-url.json
            echo "TPA_SBOM_URL_EYECATCHER_END"
          volumeMounts:
          - mountPath: /steps-shared-folder
            name: shared-folder
        volumes:
        - name: trustification-secret
          secret:
            optional: true
            secretName: $(params.TRUSTIFICATION_SECRET_NAME)
        - emptyDir:
            medium: Memory
            sizeLimit: 50Mi
          name: shared-folder
        workspaces:
        - description: Directory containing the SBOMs to upload
          name: sboms
      workspaces:
      - name: sboms
        workspace: workspace
    - name: acs-image-check
      params:
      - name: rox-secret-name
        value: $(params.stackrox-secret)
      - name: image
        value: $(params.output-image)
      - name: insecure-skip-tls-verify
        value: "true"
      - name: image-digest
        value: $(tasks.build-container.results.IMAGE_DIGEST)
      runAfter:
      - upload-sboms-to-trustification
      taskSpec:
        description: Policy check an image with StackRox/RHACS This tasks allows you
          to check an image against build-time policies and apply enforcement to fail
          builds. It's a companion to the stackrox-image-scan task, which returns
          full vulnerability scan results for an image.
        metadata:
          annotations:
            task.output.location: logs
            task.results.container: step-report
            task.results.format: application/json
            task.results.type: roxctl-image-check
        params:
        - description: |
            Secret containing the StackRox server endpoint and API token with CI permissions under rox-api-endpoint and rox-api-token keys.
            For example: rox-api-endpoint: rox.stackrox.io:443 ; rox-api-token: eyJhbGciOiJS...
          name: rox-secret-name
          type: string
        - description: |
            Full name of image to scan (example -- gcr.io/rox/sample:5.0-rc1)
          name: image
          type: string
        - default: "false"
          description: |
            When set to `"true"`, skip verifying the TLS certs of the Central
            endpoint.  Defaults to `"false"`.
          name: insecure-skip-tls-verify
          type: string
        - description: |
            Digest of the image
          name: image-digest
          type: string
        spec: null
        steps:
        - computeResources: {}
          image: registry.redhat.io/openshift4/ose-cli:4.13@sha256:73df37794ffff7de1101016c23dc623e4990810390ebdabcbbfa065214352c7c
          name: annotate-task
          script: |
            #!/usr/bin/env bash
            echo "acs-image-check $(context.taskRun.name)"
            oc annotate taskrun $(context.taskRun.name) task.results.format=application/json
            oc annotate taskrun $(context.taskRun.name) task.results.type=roxctl-image-check
            oc annotate taskrun $(context.taskRun.name) task.results.container=step-report
            oc annotate taskrun $(context.taskRun.name) task.output.location=logs
        - computeResources: {}
          env:
          - name: PARAM_INSECURE_SKIP_TLS_VERIFY
            value: $(params.insecure-skip-tls-verify)
          - name: PARAM_IMAGE
            value: $(params.image)
          - name: PARAM_IMAGE_DIGEST
            value: $(params.image-digest)
          image: registry.access.redhat.com/ubi8-minimal@sha256:b2a1bec3dfbc7a14a1d84d98934dfe8fdde6eb822a211286601cf109cbccb075
          name: rox-image-check
          onError: continue
          script: |
            #!/usr/bin/env bash
            set +x

            # Check if rox API endpoint is configured
            if test -f /rox-secret/rox-api-endpoint ; then
              export ROX_CENTRAL_ENDPOINT=$(</rox-secret/rox-api-endpoint)
            else
              echo "rox API endpoint is not set, demo will exit with success"
              echo "TODO: configure the pipeline with your ACS server domain. Set your ACS endpoint under 'rox-api-endpoint' key in the secret specified in rox-secret-name parameter. For example: 'rox.stackrox.io:443'"
              exit 0
            fi

            # Check if rox API token is configured
            if test -f /rox-secret/rox-api-token ; then
              export ROX_API_TOKEN=$(</rox-secret/rox-api-token)
            else
              echo "rox API token is not set, demo will exit with success"
              echo "TODO: configure the pipeline to have access to ROXCTL. Set you ACS token under 'rox-api-token' key in the secret specified in rox-secret-name parameter."
              exit 0
            fi

            echo "Using rox central endpoint ${ROX_CENTRAL_ENDPOINT}"

            echo "Download roxctl cli"
            if [ "${PARAM_INSECURE_SKIP_TLS_VERIFY}" = "true" ]; then
              curl_insecure='--insecure'
            fi
            curl $curl_insecure -s -L -H "Authorization: Bearer $ROX_API_TOKEN" \
              "https://${ROX_CENTRAL_ENDPOINT}/api/cli/download/roxctl-linux" \
              --output ./roxctl \
              > /dev/null
            if [ $? -ne 0 ]; then
              echo 'Failed to download roxctl'
              exit 1
            fi
            received_filesize=$(stat -c%s ./roxctl)
            if (( $received_filesize < 10000 )); then
              # Response from ACS server is not a binary but error message
              cat ./roxctl
              echo 'Failed to download roxctl'
              exit 2
            fi
            chmod +x ./roxctl  > /dev/null

            echo "roxctl image check"
            IMAGE=${PARAM_IMAGE}@${PARAM_IMAGE_DIGEST}
            ./roxctl image check \
              $( [ "${PARAM_INSECURE_SKIP_TLS_VERIFY}" = "true" ] && \
              echo -n "--insecure-skip-tls-verify") \
              -e "${ROX_CENTRAL_ENDPOINT}" --image "$IMAGE" --output json --force \
              > roxctl_image_check_output.json

            ROXCTL_CHECK_STATUS=$?

            cp roxctl_image_check_output.json /steps-shared-folder/acs-image-check.json

            # Exit code 3 means the error occurred during roxctl image check, but setup was successful
            if [ "$ROXCTL_CHECK_STATUS" -ne 0 ]; then
              exit 3
            fi
          volumeMounts:
          - mountPath: /rox-secret
            name: rox-secret
          - mountPath: /steps-shared-folder
            name: shared-folder
        - computeResources: {}
          image: registry.access.redhat.com/ubi8-minimal@sha256:b2a1bec3dfbc7a14a1d84d98934dfe8fdde6eb822a211286601cf109cbccb075
          name: report
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            cat /steps-shared-folder/acs-image-check.json
          volumeMounts:
          - mountPath: /steps-shared-folder
            name: shared-folder
        - computeResources: {}
          image: quay.io/konflux-ci/appstudio-utils:8f9f933d7b0b57e37b96fd34698c92c785cfeadc@sha256:924eb1680b6cda674e902579135a06b2c6683c3cc1082bbdc159a4ce5ea9f4df
          name: fail-if-check-failed
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            ROX_IMAGE_CHECK_EXIT_CODE_PATH=$(steps.step-rox-image-check.exitCode.path)
            ROX_IMAGE_CHECK_STATUS=$(cat "$ROX_IMAGE_CHECK_EXIT_CODE_PATH")

            if [ "$ROX_IMAGE_CHECK_STATUS" -eq 0 ]
            then
              echo "No errors occurred"
              exit
            fi

            # Fail on non-zero rox-image-check step exit code
            # Except if the error is due to policy violations (exit code 3 && at least one severe violation)
            if [ "$ROX_IMAGE_CHECK_STATUS" -ne 3 ]
            then
              echo "Error occurred during setup of roxctl"
              exit "$ROX_IMAGE_CHECK_STATUS"
            fi

            # Number of policy violations with Critical and High severity parsed from the report
            severe_violations=$(
              jq '.summary |
                with_entries(
                  select(.key | IN("CRITICAL", "HIGH"))
                ) |
                add' \
                /steps-shared-folder/acs-image-check.json
            )

            # If roxctl image check exited with non-zero code and it is not because of policy violations, report error
            if [ "$severe_violations" -eq 0 ]
            then
              echo "Error occurred during roxctl image check, please check the logs of rox-image-check step."
              exit "$ROX_IMAGE_CHECK_STATUS"
            fi

            echo "No errors occurred"
          volumeMounts:
          - mountPath: /steps-shared-folder
            name: shared-folder
        volumes:
        - name: rox-secret
          secret:
            optional: true
            secretName: $(params.rox-secret-name)
        - emptyDir:
            medium: Memory
            sizeLimit: 50Mi
          name: shared-folder
    - name: acs-image-scan
      params:
