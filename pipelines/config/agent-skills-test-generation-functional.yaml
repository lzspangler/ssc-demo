#-----------------------------------------------------------------------------
#Agent skill: JUnit 5 + REST Assured functional test generation, per the
#functional-test execution contract -- black-box tests of the deployed
#application through its service interface (test-generation-functional).
#
#Mounted read-only into the ai-generate-tests-functional task at
#/tekton/home/agent-skills/test-generation-functional/ and handed to the
#coding agent as context (aider: --read SKILL.md; claude-code:
#--append-system-prompt). The task prompt carries the run contract (read
#the OpenAPI spec, evaluate existing *FT.java coverage, add gap-filling
#tests against the running app, verify); this skill carries the HOW: the
#functional-test execution contract and tool stack.
#
#CONTENT MIRRORS agent-skills/test-generation-functional/ in this repo.
#There is no way to share one file across the two sync roots
#(ssc-tekton-config syncs this directory; agent-skills/ is not an Argo
#root), so edit the file under agent-skills/ and regenerate this ConfigMap
#from it, e.g.:
#  oc create configmap agent-skills-test-generation-functional \
#    --from-file=SKILL.md=agent-skills/test-generation-functional/SKILL.md \
#    --dry-run=client -o yaml > this-file   (then re-add this header + labels)
#Synced by the ssc-tekton-config Application (pipelines/config/).
