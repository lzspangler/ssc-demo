#-----------------------------------------------------------------------------
#Agent skill: JUnit 5 integration test generation, per the integration-test
#execution contract -- every dependency supplied by a controlled,
#test-managed implementation (embedded H2, WireMock stubs; no
#Testcontainers) (test-generation-integration).
#
#Mounted read-only into the ai-generate-tests-integration task at
#/tekton/home/agent-skills/test-generation-integration/ and handed to the
#coding agent as context (aider: --read SKILL.md; claude-code:
#--append-system-prompt). The task prompt carries the run contract (map
#the component/dependency interactions, evaluate existing *IT.java
#coverage, add gap-filling tests, verify); this skill carries the HOW:
#the integration-test execution contract and tool stack.
#
#CONTENT MIRRORS agent-skills/test-generation-integration/ in this repo.
