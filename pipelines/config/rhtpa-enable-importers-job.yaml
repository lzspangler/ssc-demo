# -----------------------------------------------------------------------------
# Declarative enablement of the RHTPA (Trustify) data importers.
#
# WHY THIS IS A JOB, NOT A CR:
# In RHTPA 2.2.6 the importer set is seeded into Trustify's database at install
# time (with the large Red Hat SBOM/CSAF importers DISABLED by default), and
# importer enablement is a runtime setting managed through the /api/v2/importer
# REST API -- it is not exposed as a first-class field on the RHTPA operator CR.
# This Job makes enabling them reproducible / GitOps-able by applying the exact
# same API calls idempotently: enable each importer (flip the nested `disabled`
# flag) and force an immediate run. Re-running the Job is safe -- it just
# re-asserts `disabled=false` and re-triggers a run.
#
# If a newer RHTPA operator/Helm chart exposes importer seeding via the CR or
# Helm values, prefer that and delete this Job.
#
# PREREQUISITE: the Secret named in `trustification-secret` (default tpa-secret)
# must exist in this namespace with keys:
#   bombastic_api_url, oidc_issuer_url, oidc_client_id, oidc_client_secret
# (the same Secret the pipeline's RHTPA tasks consume).
#
# Apply:      oc -n tssc-app-ci apply -f config/rhtpa-enable-importers-job.yaml
# Re-run:     oc -n tssc-app-ci delete job rhtpa-enable-importers --ignore-not-found \
#               && oc -n tssc-app-ci apply -f config/rhtpa-enable-importers-job.yaml
# Logs:       oc -n tssc-app-ci logs -f job/rhtpa-enable-importers
# -----------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: rhtpa-enable-importers
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maven-build-ci
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: trustification-secret
          secret:
            secretName: tpa-secret
      containers:
        - name: enable-importers
          # Pure Python stdlib (urllib + json) -- NO jq/curl. Earlier attempts
          # failed two ways under the restricted SCC (random non-root UID):
          # runtime `microdnf install jq` can't write /var/cache/yum or /usr/bin,
          # and stock base images (ubi-minimal, ubi9/toolbox) don't ship jq at
          # all. The python-39 image has python3 built in and runs fine as an
          # arbitrary UID, so nothing needs installing.
          image: registry.access.redhat.com/ubi9/python-39:latest
          # Space-separated list of importers to enable + force. These two are the
          # ones disabled by default; osv-github and cve are enabled already.
          env:
            - name: IMPORTERS
              value: "redhat-sboms redhat-csaf"
            # DEV/DEMO ONLY: set to "true" if the RHTPA/OIDC routes use a cert not
            # in the image trust store (self-signed workshop ingress). Leave unset
            # to verify TLS.
            - name: RHTPA_TLS_INSECURE
              value: "false"
          volumeMounts:
            - name: trustification-secret
              mountPath: /run/secrets/trustification
              readOnly: true
          command: ["python3", "-c"]
          args:
            - |
              import base64, json, os, ssl, sys, urllib.parse, urllib.request

              S = "/run/secrets/trustification"
              def readf(n):
                  with open(os.path.join(S, n)) as f:
                      return f.read().strip()

              RHTPA = readf("bombastic_api_url").rstrip("/")
              ISS   = readf("oidc_issuer_url").rstrip("/")
              CID   = readf("oidc_client_id")
              CSEC  = readf("oidc_client_secret")
              IMPORTERS = os.environ.get("IMPORTERS", "").split()

              # TLS context: verify by default; opt out only for dev/demo ingress.
              ctx = ssl.create_default_context()
              if os.environ.get("RHTPA_TLS_INSECURE", "false").lower() == "true":
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE

              def http(method, url, headers=None, data=None):
                  req = urllib.request.Request(url, method=method, data=data,
                                               headers=headers or {})
                  try:
                      with urllib.request.urlopen(req, context=ctx) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      sys.exit("HTTP %s on %s %s: %s"
                               % (e.code, method, url, e.read().decode("utf-8", "replace")))

              # Mint a fresh client-credentials token per call (they're short-lived).
              def bearer():
                  wk = json.loads(http("GET", ISS + "/.well-known/openid-configuration"))
                  body = urllib.parse.urlencode({"grant_type": "client_credentials"}).encode()
                  basic = base64.b64encode(("%s:%s" % (CID, CSEC)).encode()).decode()
                  tok = json.loads(http("POST", wk["token_endpoint"], {
                      "Authorization": "Basic " + basic,
                      "Content-Type": "application/x-www-form-urlencoded",
                  }, body))["access_token"]
                  return {"Authorization": "Bearer " + tok}

              for name in IMPORTERS:
                  print("== %s ==" % name)
                  url = "%s/api/v2/importer/%s" % (RHTPA, name)

                  # The `disabled` flag lives nested under the single type key
                  # (sbom/csaf/osv/...); discover that key and flip it in place.
                  cfg = json.loads(http("GET", url, bearer()))["configuration"]
                  key = next(iter(cfg))
                  cfg[key]["disabled"] = False

                  hdr = bearer(); hdr["Content-Type"] = "application/json"
                  http("PUT", url, hdr, json.dumps(cfg).encode())

                  d = json.loads(http("GET", url, bearer()))["configuration"][key]["disabled"]
                  print("  %s disabled=%s" % (name, d))
                  if d:
                      sys.exit("ERROR: failed to enable %s" % name)

                  http("POST", url + "/force", bearer())
                  print("  %s forced -- run will start within ~1 minute" % name)

              print("Done. Poll importer state via GET /api/v2/importer/<name>.")
