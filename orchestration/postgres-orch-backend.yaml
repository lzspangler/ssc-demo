apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backend-pvc
  namespace: automation-orchestrator-operator-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: automation-orchestrator-operator-system
data:
  init.sql: |
    CREATE USER orchestrator WITH PASSWORD 'secure-password';
    CREATE USER temporal WITH PASSWORD 'secure-password';
    
    CREATE DATABASE orchestrator OWNER orchestrator;
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;
    
    GRANT ALL PRIVILEGES ON DATABASE orchestrator TO orchestrator;
    GRANT ALL PRIVILEGES ON DATABASE temporal TO temporal;
    GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO temporal;
    
    -- Connect to the orchestrator database and install the required extension.
    \c orchestrator orchestrator
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
  run-init.sh: |
    #!/bin/bash
    echo "==> Executing initialization scripts..."
    
    psql -v -d postgres -f "/opt/app-root/src/postgresql-init/init.sql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backend
  namespace: automation-orchestrator-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: "orchestrator"
            - name: POSTGRESQL_PASSWORD
              value: "secure-password"
            - name: POSTGRESQL_DATABASE
              value: "orchestrator"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data
            - name: init-volume
              mountPath: /opt/app-root/src/postgresql-init
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-backend-pvc
        - name: init-volume
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-backend
  namespace: automation-orchestrator-operator-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
