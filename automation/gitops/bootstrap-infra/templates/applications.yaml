{{- $domain := required "Set deployer.domain to the cluster's apps subdomain" .Values.deployer.domain }}
{{- $realm := .Values.components.keycloak.realm }}
{{- $issuer := printf "https://sso.%s/realms/%s" $domain $realm }}
# =============================================================================
# Argo CD Applications for the ssc-demo platform. See values.yaml for the
# sync-wave dependency chain.
#
# Every Application gets the same syncPolicy as the reference cluster:
#   * automated prune + selfHeal -- which also means any `oc annotate` stopgap
#     applied to a managed resource is reverted on the next reconcile. Fix
#     things in the chart, not on the cluster.
#   * a long retry (30 attempts, exponential to 2 m). Operator-backed CRs fail
#     their first few syncs while the CRD is still being installed; without the
#     retry those Applications land in Failed and stay there.
#   * SkipDryRunOnMissingResource -- same reason: the dry run cannot validate a
#     CR whose CRD does not exist yet.
# =============================================================================

{{- if .Values.components.pipelines.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-pipelines
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.pipelines.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/pipelines
    helm:
      valuesObject:
        deployer:
          domain: {{ $domain | quote }}
          apiUrl: {{ .Values.deployer.apiUrl | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.pipelines.namespace }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if .Values.components.tekton.enabled }}
{{- $tk := .Values.components.tekton }}
{{- $ns := .Values.pipelineNamespace }}
{{- $mavenVariants := list "maven-build-ci-pipeline.yaml" "maven-build-ci-pipeline-ai.yaml" "maven-build-ci-pipeline-no-acs.yaml" }}
{{- if not (has $tk.mavenBuildPipeline $mavenVariants) }}
{{- fail (printf "components.tekton.mavenBuildPipeline must be one of %v, got %q" $mavenVariants $tk.mavenBuildPipeline) }}
{{- end }}
# -----------------------------------------------------------------------------
# The Tekton layer. These four Applications replace the `oc apply -f tasks/`,
# `oc apply -f pipelines/...` and `oc apply -f triggers/...` steps in
# pipelines/README.md.
#
# What stays manual, and why: every Secret the runs mount. `ai-agent-secret`
# and `maven-settings` hold real credentials and are created with
# `oc create secret`; `tpa-secret` is step 5 of the gitops README. The two the
# demo used to need by hand -- `scm-auth-secret` and `gitlab-webhook-secret` --
# are now minted by the GitLab seeding job into this namespace.
#
# Note that `pipelines/secrets/*.example.yaml` is never synced: those files are
# REPLACE_ME templates, and applying them would overwrite a real credential
# with a placeholder.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-tekton-tasks
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $tk.syncWaves.tasks | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/tasks
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-tekton-config
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $tk.syncWaves.config | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/config
    directory:
      recurse: false
      {{- if not $tk.enableImportersJob }}
      # See values.yaml: redundant once the RHTPA Application declares the
      # importer, and it needs the hand-made tpa-secret to run at all.
      exclude: rhtpa-enable-importers-job.yaml
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-tekton-pipelines
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $tk.syncWaves.pipelines | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/pipelines
    directory:
      recurse: false
      # Drop the maven-build-ci variants that were not selected. All three
      # declare the same metadata.name, and syncing more than one makes the
      # whole Application fail to render, not just that resource.
      exclude: {{ printf "{%s}" (join "," (without $mavenVariants $tk.mavenBuildPipeline)) | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-tekton-triggers
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $tk.syncWaves.triggers | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/triggers
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- if ne $ns "tssc-app-ci" }}
{{- fail (printf "pipelineNamespace is %q, but pipelines/triggers/agentic-issue-triggers.yaml hardcodes the ClusterRoleBinding subject namespace as tssc-app-ci. Edit that file to match before changing pipelineNamespace, or the EventListener cannot reach the cel/gitlab ClusterInterceptors." $ns) }}
{{- end }}
{{- end }}

{{- if .Values.components.keycloak.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-keycloak
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.keycloak.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/keycloak
    helm:
      valuesObject:
        global:
          cluster:
            subdomain: {{ $domain | quote }}
        keycloak-db:
          pgsql:
            password: {{ .Values.credentials.keycloakDbPassword | quote }}
        keycloak-realm-import:
          realm:
            name: {{ $realm | quote }}
          client:
            tpaCli:
              secret: {{ .Values.credentials.tpaCliClientSecret | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.keycloak.namespace }}
  # The realm template fills every unset client secret with a fresh
  # `randAlphaNum 32` and every resource id with a fresh `uuidv4`, so a plain
  # re-render always differs from the live KeycloakRealmImport. Without this
  # the Application is permanently OutOfSync and selfHeal rewrites the realm --
  # rotating the secrets of clients that are currently in use.
  ignoreDifferences:
    - group: k8s.keycloak.org
      kind: KeycloakRealmImport
      jqPathExpressions:
        - '.. | (.id, .containerId, .secret)? | strings'
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if .Values.components.gitlab.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-gitlab
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.gitlab.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/gitlab
    helm:
      valuesObject:
        cluster:
          subdomain: {{ $domain | quote }}
        gitlab:
          rootPassword: {{ .Values.credentials.gitlabRootPassword | quote }}
        pipeline:
          namespace: {{ .Values.pipelineNamespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.gitlab.namespace }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if .Values.components.quay.enabled }}
{{- $q := .Values.components.quay }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-quay
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $q.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/quay
    helm:
      valuesObject:
        global:
          cluster:
            subdomain: {{ $domain | quote }}
        quay-registry:
          quay:
            adminUserPassword: {{ .Values.credentials.quayAdminPassword | quote }}
            organizations:
              - {{ $q.organization | quote }}
            component:
              objectstorage:
                managed: {{ $q.objectStorageManaged }}
            pipeline:
              enabled: true
              namespace: {{ .Values.pipelineNamespace | quote }}
              organization: {{ $q.organization | quote }}
              robotName: {{ $q.robotName | quote }}
              secretName: {{ $q.pushSecretName | quote }}
          noobaa:
            # The pre-flight BackingStore patch only makes sense when the
            # operator is actually provisioning a NooBaa bucket.
            enabled: {{ $q.objectStorageManaged }}
            namespace: {{ $q.noobaaNamespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $q.namespace }}
  # No ignoreDifferences needed. The three Secrets that matter here --
  # quay-admin-token, the push Secret and the operator's own generated config
  # -- are written by Ansible and by the Quay operator, not rendered from this
  # chart, so they carry no Argo tracking ID and selfHeal/prune leave them
  # alone. That is load-bearing for quay-admin-token in particular: it is the
  # only copy of a token that /api/v1/user/initialize will not reissue.
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

