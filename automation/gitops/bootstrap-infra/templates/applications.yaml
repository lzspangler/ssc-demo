{{- if .Values.components.rhtpaOperator.enabled }}
{{- $ro := .Values.components.rhtpaOperator }}
# -----------------------------------------------------------------------------
# RHTPA 3.x via the operator -- the alternative to the Helm-chart component
# below, and the only form Exploit Intelligence can integrate with.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-rhtpa-operator
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $ro.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/rhtpa-operator
    helm:
      valuesObject:
        domain: {{ $domain | quote }}
        namespace: {{ $ro.namespace | quote }}
        createOperatorGroup: {{ $ro.createOperatorGroup }}
        subscription:
          channel: {{ $ro.channel | quote }}
        trustedProfileAnalyzer:
          routeTimeout: {{ $ro.routeTimeout | quote }}
          storage:
            type: {{ $ro.storage.type | quote }}
            bucket: {{ $ro.storage.bucket | quote }}
            regionEndpoint: {{ $ro.storage.regionEndpoint | quote }}
          oidc:
            # Same $issuer the rest of the platform uses, so the clients the
            # keycloak-clients component provisions cannot disagree with it.
            issuerUrl: {{ $issuer | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ro.namespace }}
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if .Values.components.appEnvironments.enabled }}
{{- $ae := .Values.components.appEnvironments }}
{{- if not .Values.components.gitlab.enabled }}
{{- fail "components.appEnvironments track the gitops repository the gitlab component's seeding job imports; enable components.gitlab or disable components.appEnvironments" }}
{{- end }}
{{- $gitlabHost := printf "gitlab-%s.%s" .Values.components.gitlab.namespace $domain }}
{{- range $env := $ae.environments }}
# -----------------------------------------------------------------------------
# The {{ $env.name }} environment of the example application -- the consumer
# end of the CD chain. Tracks the gitops repository the GitLab seeding job
# imports; a promotion merged there (an MR bumping image.tag in
# {{ $env.valuesFile }}) rolls this deployment. Whether promotions are
# automatic is a pipeline decision, not this Application's: gitops-cd-dev
# auto-merges dev only, qa/prod promotions stay human MRs.
#
# Wave 16, after everything else, on purpose: the Application's health
# includes the Deployment pulling its image, and on a fresh cluster the
# imported values file's initial tag does not exist in Quay until the first
# ci-build-publish run promotes a real one. An earlier wave would block the
# install behind a permanently Degraded Application. See
# components.appEnvironments in values.yaml for the hand-created-Application
# migration note.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-example-{{ $env.name }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $ae.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.argocd.project }}
  source:
    repoURL: https://{{ $gitlabHost }}/{{ $ae.gitGroup }}/{{ $ae.gitopsRepo }}.git
    targetRevision: {{ $ae.revision }}
    path: {{ $ae.chartPath }}
    helm:
      valueFiles:
        - values.yaml
        - {{ $env.valuesFile }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $env.namespace }}
  {{- include "root-app.syncPolicy" $ | nindent 2 }}
{{- end }}
{{- end }}

