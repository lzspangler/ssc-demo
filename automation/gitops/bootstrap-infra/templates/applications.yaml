{{- if .Values.components.quay.enabled }}
{{- $q := .Values.components.quay }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-quay
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $q.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/quay
    helm:
      valuesObject:
        global:
          cluster:
            subdomain: {{ $domain | quote }}
        quay-registry:
          quay:
            adminUserPassword: {{ .Values.credentials.quayAdminPassword | quote }}
            organizations:
              - {{ $q.organization | quote }}
            component:
              objectstorage:
                managed: {{ $q.objectStorageManaged }}
            pipeline:
              enabled: true
              namespace: {{ .Values.pipelineNamespace | quote }}
              organization: {{ $q.organization | quote }}
              robotName: {{ $q.robotName | quote }}
              secretName: {{ $q.pushSecretName | quote }}
          noobaa:
            # The pre-flight BackingStore patch only makes sense when the
            # operator is actually provisioning a NooBaa bucket.
            enabled: {{ $q.objectStorageManaged }}
            namespace: {{ $q.noobaaNamespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $q.namespace }}
  # No ignoreDifferences needed. The three Secrets that matter here --
  # quay-admin-token, the push Secret and the operator's own generated config
  # -- are written by Ansible and by the Quay operator, not rendered from this
  # chart, so they carry no Argo tracking ID and selfHeal/prune leave them
  # alone. That is load-bearing for quay-admin-token in particular: it is the
  # only copy of a token that /api/v1/user/initialize will not reissue.
  {{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

{{- if .Values.components.rhtas.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-rhtas
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.rhtas.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/rhtas
    helm:
      valuesObject:
        global:
          cluster:
            subdomain: {{ $domain | quote }}
        trusted-artifact-signer:
          namespace: {{ .Values.components.rhtas.namespace | quote }}
          realm: {{ $realm | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.rhtas.namespace }}
    # The operator populates these; the chart deliberately does not set them, so
  # without this the Application is permanently OutOfSync on defaults alone.
  # Everything the chart DOES set now matches the live object exactly -- see
  # components/rhtas/trusted-artifact-signer/templates/securesignCR.yaml for
  # the v1alpha1 -> v1 migration that made that true.
  ignoreDifferences:
    - group: rhtas.redhat.com
      kind: Securesign
      name: securesign
      namespace: {{ .Values.components.rhtas.namespace }}
      jsonPointers:
        - /spec/ctlog
        - /spec/fulcio/replicas
        - /spec/rekor/maxRequestBodySize
        - /spec/rekor/monitoring/tlog
        - /spec/rekor/monitoring/tuf
        - /spec/rekor/replicas
        - /spec/rekor/searchIndex/tls
        - /spec/trillian/database/provider
        - /spec/trillian/database/tls
        - /spec/trillian/database/uri
        - /spec/trillian/maxRecvMessageSize
        - /spec/trillian/server
        - /spec/trillian/signer
        - /spec/tsa/maxRequestBodySize
        - /spec/tsa/replicas
        - /spec/tuf/replicas
{{- include "root-app.syncPolicy" . | nindent 2 }}
{{- end }}

