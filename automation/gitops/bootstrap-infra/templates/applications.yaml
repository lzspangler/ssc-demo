{{- if .Values.components.rhtpa.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-rhtpa
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.rhtpa.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/rhtpa
    helm:
      valuesObject:
        rhtpa:
          enabled: {{ .Values.components.rhtpa.enabled }}
          namespace: {{ .Values.components.rhtpa.namespace }}
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
          apiUrl: {{ .Values.deployer.apiUrl | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.rhtpa.namespace }}
  # Live PVC storage may already be Bound on the default WaitForFirstConsumer
  # class; storageClassName is immutable (#101). Ignore that pointer so this
  # claim stays Synced; next claim Binds Immediate and the ignore is a no-op.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: storage
      jsonPointers:
        - /spec/storageClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
{{- end }}


