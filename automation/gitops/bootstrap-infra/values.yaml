# =============================================================================
# ssc-demo platform app-of-apps.
#
# Installs the demo platform on a cluster that already has OpenShift GitOps
# running. Everything below is reproduced from the reference cluster
# (cluster-6jnws), which is built from redhat-ads-tech/ocp-app-platform-demo-helm
# v1.4.2 plus the Red Hat RHTPA chart -- see each component's README for what
# was changed and why.
#
# NOT managed here: Artifactory. It lives in automation/gitops/artifactory as a
# standalone Application with its own runbook, and it is already working.
#
# Sync-wave order (an Application's wave only advances once the previous wave is
# Healthy, so this is a real dependency chain):
#
#    0  pipelines                OpenShift Pipelines operator -- CRDs everything else's
#                                tasks need; nothing depends on it at install time, so
#                                it goes first and gets out of the way.
#    5  keycloak                 The IdP. RHTAS and RHTPA both authenticate against its
#                                `backstage` realm, so it must be serving
#                                /.well-known/openid-configuration before either starts.
#    8  gitlab                   Independent of Keycloak (root auth, not OIDC), but slow:
#                                the seeding job imports a repository from GitHub. Started
#                                early so it overlaps the operator installs.
#   10  quay                     The application image registry. Needs the pipeline
#                                namespace and its `pipeline` ServiceAccount (wave 3-5) to
#                                exist before it can write the push Secret, and NooBaa in
#                                openshift-storage for its object storage.
#   10  rhtas                    Securesign. Needs the realm's trusted-artifact-signer client.
#   10  rhtpa-prerequisites      Postgres + oidc-tpa-cli Secret + the S3 bucket. Its PreSync
#                                hook blocks on the Keycloak issuer, which is the real
#                                reason keycloak is a lower wave.
#   15  rhtpa                    The analyzer itself, from charts.openshift.io.
#
# BEFORE INSTALLING: set deployer.domain and replace every REPLACE_ME in
# `credentials` below. Do that in a LOCAL values override that you do not
# commit (`helm template ... -f private.yaml`), not in this file.
# =============================================================================

deployer:
  # Apps subdomain of the target cluster, WITHOUT a leading dot, e.g.
  # apps.cluster-abcde.dyn.redhatworkshops.io. Every hostname the platform
  # publishes derives from this.
  #
  #   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
  domain: ""
  apiUrl: ""

gitops:
  repoUrl: "https://github.com/lzspangler/ssc-demo.git"
  revision: "ssc-demo"
  basePath: "automation/gitops"
  # The Tekton resources are NOT under basePath -- they live at the repo root,
  # where pipelines/README.md documents them. Argo applies them from there
  # rather than from a copy, so the two cannot drift.
  tektonPath: "pipelines"

argocd:
  namespace: openshift-gitops
  project: default

# Namespace the Tekton pipelines are installed into. The GitLab seeding job
# writes `scm-auth-secret` and `gitlab-webhook-secret` here and derives the
# issue-comment webhook URL from it.
pipelineNamespace: tssc-app-ci

# -----------------------------------------------------------------------------
# Credentials. All REPLACE_ME; supply real values at install time from an
# uncommitted override file. Generate them with e.g. `openssl rand -hex 16`.
# -----------------------------------------------------------------------------
credentials:
  # Keycloak's own Postgres.
  keycloakDbPassword: REPLACE_ME

  # GitLab root. The seeding job authenticates as root to create the group,
  # import the repository and mint the pipeline's project access token.
  gitlabRootPassword: REPLACE_ME

  # RHTPA's Postgres. Used by BOTH the prerequisites chart (which creates the
  # database) and the RHTPA chart (which connects to it) -- one value, two
  # consumers, so it is set once here.
  tpaDbPassword: REPLACE_ME

  # The Quay superuser. The seeding job creates this account through
  # /api/v1/user/initialize and then logs in as it to make the organization and
  # the pipeline robot, so it is also how you sign in to the Quay console.
  quayAdminPassword: REPLACE_ME

  # The `tpa-cli` OIDC client secret, and the single most load-bearing value in
  # this file. It is written into the Keycloak realm, into the `oidc-tpa-cli`
  # Secret RHTPA reads, and -- by hand, see step 5 of README.md -- into the
  # pipeline's `tpa-secret` as `oidc_client_secret`. If any of the three drift,
  # every RHTPA call returns 401 and nothing else looks wrong.
  tpaCliClientSecret: REPLACE_ME

# =============================================================================
# Components
# =============================================================================
components:

  pipelines:
    enabled: true
    namespace: openshift-operators
    syncWave: "0"

  # The Tekton layer itself: the Tasks, Pipelines, Triggers and ConfigMap that
  # pipelines/README.md otherwise has you `oc apply` by hand. Four Applications
  # rather than one, because each points at a single directory with
  # `recurse: false` -- that keeps every include/exclude pattern a bare
  # filename, which Argo matches the same way regardless of version, and it
  # makes a failure in (say) the triggers visible on its own.
  tekton:
    enabled: true
    syncWaves:
      # Operator CRDs come from wave 0. Tasks and the AI config have no
      # intra-layer dependencies; Pipelines reference Tasks; Triggers reference
      # Pipelines.
      tasks: "3"
      config: "3"
      pipelines: "4"
      triggers: "5"

    # pipelines/pipelines/ holds THREE files that all declare
    # `metadata.name: maven-build-ci`, and Argo CD refuses to sync a directory
    # containing two resources with the same identity ("appeared 2 times among
    # application resources"). Exactly one is installed; the other two are
    # excluded by filename.
    #
    #   maven-build-ci-pipeline-ai.yaml      build + sign + SBOM + AI scan chain
    #   maven-build-ci-pipeline.yaml         build + sign + SBOM + ACS gates
    #   maven-build-ci-pipeline-no-acs.yaml  as above, ACS gates removed
    #
    # The AI variant is the default because it is what the reference cluster
    # has applied and what the demo narrative exercises.
    mavenBuildPipeline: maven-build-ci-pipeline-ai.yaml

    # pipelines/config/rhtpa-enable-importers-job.yaml flips RHTPA's
    # `redhat-csaf` importer on through the REST API. The RHTPA Application
    # below already declares that importer with `disabled: false`, so on a
    # GitOps install the Job is redundant -- and it reads the hand-made
    # `tpa-secret`, so syncing it before step 5 of README.md just leaves a
    # failed Job. Turn it on only if you install RHTPA some other way.
    enableImportersJob: false

  keycloak:
    enabled: true
    namespace: keycloak
    syncWave: "5"
    # Baked into the OIDC issuer URL that RHTAS, RHTPA and the pipeline's
    # `oidc-issuer` parameter all carry. Renaming means changing all of them.
    realm: backstage

  gitlab:
    enabled: true
    namespace: gitlab
    syncWave: "8"

  # The registry the demo's application images are published to. The pipelines
  # push `quay.<domain>/<organization>/<component>:<revision>`.
  #
  # Wave 10, alongside rhtas and rhtpa-prerequisites, so the three install in
  # parallel rather than adding their install times together. It cannot go
  # earlier: the seeding job writes the push Secret into the pipeline namespace
  # and links it to the `pipeline` ServiceAccount, and neither exists until the
  # Tekton Applications have run (waves 3-5).
  #
  # NEEDS ODF. `objectstorage` is a managed component, so the Quay operator
  # raises an ObjectBucketClaim against NooBaa in openshift-storage -- the same
  # dependency rhtpa's default s3 storage has. On a cluster without ODF, set
  # enabled: false here; the pipelines then need an `output-image` on some
  # other registry and a push secret you create yourself.
  quay:
    enabled: true
    namespace: quay-registry
    syncWave: "10"
    # Organization the images land in, and the robot account that pushes them.
    # Together they produce `quay.<domain>/tssc/<component>` and the Quay
    # account `tssc+remediation`, which is what the reference cluster uses.
    organization: tssc
    robotName: remediation
    # Name of the dockerconfigjson Secret written into pipelineNamespace and
    # linked to the `pipeline` ServiceAccount.
    pushSecretName: quay-push
    # NooBaa's namespace. Only read when objectStorageManaged is true.
    objectStorageManaged: true
    noobaaNamespace: openshift-storage

  rhtas:
    enabled: true
    namespace: trusted-artifact-signer
    syncWave: "10"

  rhtpaPrerequisites:
    enabled: true
    namespace: trusted-profile-analyzer
    syncWave: "10"

  rhtpa:
    enabled: true
    namespace: trusted-profile-analyzer
    syncWave: "15"
    # Red Hat chart from https://charts.openshift.io/, not vendored into this
    # repo. Pinned to what the reference cluster runs.
    chartVersion: "1.2.6"
    storage:
      # s3 (needs OpenShift Data Foundation) or filesystem. Must match
      # rhtpaPrerequisites' storage.type -- the prerequisites chart only
      # creates the ObjectBucketClaim in s3 mode.
      type: s3
      bucket: trustify
      # NooBaa's S3 endpoint; `https://s3-openshift-storage.<domain>:443`.
      # Override only if your object gateway is published elsewhere.
      regionEndpoint: ""
      # filesystem mode only: size of the PVC RHTPA provisions, and the class
      # to provision it from. Leave storageClassName empty for the cluster
      # default.
      #
      # Caveat: the chart mounts this one PVC into both the server and the
      # importer Deployment and hardcodes accessModes: [ReadWriteOnce] with no
      # override. An RWX class does not fix that -- the claim still asks for
      # RWO, so the two pods must co-schedule and the importer stays Pending
      # when it cannot. Prefer s3.
      size: 50Gi
      storageClassName: ""
    # HAProxy's `timeout server` for the RHTPA Route. The default 30 s is not
    # survivable for this demo: /purl/recommend cannot complete inside it at
    # any batch size, and because the Route is GENERATED from an Ingress by the
    # ingress-to-route controller, annotating the Route by hand is reverted.
    # The annotation therefore goes on the Ingress, via the chart's own
    # ingress.additionalAnnotations, and the controller copies it down.
    routeTimeout: 300s
