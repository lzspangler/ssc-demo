            "maxUniqueSnapshots": 0,
            "suppressPomConsistencyChecks": false
          },
          "packageTypeConfig": {},
          "securityConfig": {
            "hideUnauthorizedResources": false,
            "signedUrlTtl": 90
          },
          "repoType": "REMOTE"
        }
      ],
      "virtualRepoConfigs": [
        {
          "type": "virtual",
          "key": "lightwell",
          "packageType": "maven",
          "baseConfig": {
            "modelVersion": 2,
            "description": "Aggregates the Lightwell validated + remediated proxies",
            "repoLayoutRef": "maven-2-default",
            "includesPattern": "**/*",
            "federationConfig": {
              "federationOnGrid": false,
              "members": [],
              "modificationDate": 0,
              "federated": false
            }
          },
          "repoTypeConfig": {
            "repositoryRefs": [
              "lightwell-validated",
              "lightwell-remediated",
              "maven-central"
            ],
            "artifactoryRequestsCanRetrieveRemoteArtifacts": false,
            "virtualCacheConfig": {
