apiVersion: v2
name: keycloak
description: >-
  Red Hat build of Keycloak for ssc-demo: operator, Postgres, a Keycloak instance and the backstage realm that RHTAS and RHTPA authenticate against.
type: application
version: 0.1.0

dependencies:
  - name: keycloak-operator
    version: 0.1.0
    repository: file://keycloak-operator
  - name: keycloak-db
    version: 0.1.0
    repository: file://keycloak-db
  - name: keycloak
    version: 0.1.0
    repository: file://keycloak
  - name: keycloak-realm-import
    version: 0.1.0
    repository: file://keycloak-realm-import
