{{- if and .Values.pipelines.enabled .Values.operator.enabled }}
---
# OpenShift Pipelines Operator via OLM. Installs into openshift-operators
# (AllNamespaces), which already has an OperatorGroup.
#
# This used to be wrapped in `if not (lookup ... Subscription).metadata` to skip
# itself when one already existed. That guard was removed deliberately. Argo CD
# renders with `helm template` and no cluster connection, so the lookup always
# came back empty and the guard never fired -- but anywhere it DID fire the
# Subscription would vanish from the manifest set, and `prune: true` would then
# delete it and take the operator, its CRDs and every running pipeline with it.
# Re-applying an identical Subscription is a no-op, so the guard bought nothing.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.pipelines.syncWaves.operator | quote }}
spec:
  channel: {{ .Values.operator.channel }}
  installPlanApproval: {{ .Values.operator.installPlanApproval }}
  name: {{ .Values.operator.packageName }}
  source: {{ .Values.operator.source }}
  sourceNamespace: {{ .Values.operator.sourceNamespace }}
{{- end }}
