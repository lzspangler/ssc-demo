{{- $tpaCli := .Values.clients.tpaCli }}
{{- $tpaFe := .Values.clients.tpaFrontend }}
{{- $tas := .Values.clients.trustedArtifactSigner }}
{{- $docScopes := list "read:document" "create:document" "update:document" "delete:document" }}
---
# A Secret rather than a ConfigMap: it carries the tpa-cli client secret.
# Everything else in here is inert configuration, but splitting it across two
# objects to save a few bytes of encoding is not worth the extra moving part.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-clients.name" . }}-config
  namespace: {{ include "keycloak-clients.namespace" . }}
  labels:
    {{- include "keycloak-clients.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |
    {
      "keycloakUrl": {{ include "keycloak-clients.url" . | quote }},
      "realm": {{ .Values.realm | quote }},
      "tlsVerify": {{ .Values.tlsVerify }},

      "clientScopes": [
      {{- range $i, $name := $docScopes }}
        {{ if $i }},{{ end }}{
          "name": {{ $name | quote }},
          "description": {{ printf "Permission to %s documents in TPA" (index (splitList ":" $name) 0) | quote }},
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          }
        }
      {{- end }}
      ],

      "realmRoles": [
        {"name": "tpa-user",    "description": "TPA user role with read and create document permissions"},
        {"name": "tpa-manager", "description": "TPA manager role with user permissions plus update",
         "composites": ["tpa-user"]},
        {"name": "tpa-admin",   "description": "TPA admin role with full document permissions",
         "composites": ["tpa-manager"]}
      ],

      "clients": [
        {
          "representation": {
            "clientId": {{ $tpaCli.name | quote }},
            "enabled": true,
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "secret": {{ required "Set clients.tpaCli.secret to the same value as credentials.tpaCliClientSecret" $tpaCli.secret | quote }},
            "publicClient": false,
            "standardFlowEnabled": false,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": true,
            "frontchannelLogout": false,
            "fullScopeAllowed": true,
            "redirectUris": [],
            "webOrigins": [],
            "attributes": {
              "oidc.ciba.grant.enabled": "false",
              "oauth2.device.authorization.grant.enabled": "false",
              "backchannel.logout.session.required": "true",
              "backchannel.logout.revoke.offline.tokens": "false"
            }
          },
          "defaultClientScopes": {{ $docScopes | toJson }},
          "serviceAccountRealmRoles": ["tpa-admin"]
        },
        {
          "representation": {
            "clientId": {{ $tpaFe.name | quote }},
            "enabled": true,
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "publicClient": true,
            "standardFlowEnabled": true,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": false,
            "frontchannelLogout": true,
            "fullScopeAllowed": true,
            "redirectUris": {{ include "keycloak-clients.tpaRedirectUris" . }},
            "webOrigins": ["+"],
            "attributes": {
              "oidc.ciba.grant.enabled": "false",
              "oauth2.device.authorization.grant.enabled": "false",
              "backchannel.logout.session.required": "true",
              "backchannel.logout.revoke.offline.tokens": "false"
            },
            "protocolMappers": [
              {
                "name": "tpa-frontend-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "consentRequired": false,
                "config": {
                  "included.client.audience": {{ $tpaFe.name | quote }},
                  "id.token.claim": "true",
                  "access.token.claim": "true"
                }
              }
            ]
          },
          "defaultClientScopes": {{ $docScopes | toJson }}
        }
        {{- if $tas.enabled }},
        {
          "representation": {
            "clientId": {{ $tas.name | quote }},
            "enabled": true,
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "publicClient": true,
            "standardFlowEnabled": true,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": false,
            "frontchannelLogout": true,
            "fullScopeAllowed": true,
            "redirectUris": ["urn:ietf:wg:oauth:2.0:oob", "*"],
            "webOrigins": [],
            "attributes": {
              "oidc.ciba.grant.enabled": "false",
              "oauth2.device.authorization.grant.enabled": "false",
              "backchannel.logout.session.required": "true",
              "backchannel.logout.revoke.offline.tokens": "false"
            },
            "protocolMappers": [
              {
                "name": "trusted-artifact-signer-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "consentRequired": false,
                "config": {
                  "included.client.audience": {{ $tas.name | quote }},
                  "id.token.claim": "false",
                  "access.token.claim": "true"
                }
              }
            ]
          }
        }
        {{- end }}
      ]
    }
