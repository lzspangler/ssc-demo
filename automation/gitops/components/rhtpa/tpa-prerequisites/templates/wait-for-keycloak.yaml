apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-keycloak
  labels:
    {{- include "tpa-prerequisites.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        {{- include "tpa-prerequisites.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wait
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for OIDC endpoint: {{ include "tpa-prerequisites.issuerUrl" . }}"
              until curl {{- if .Values.oidc.caConfigMap }} --cacert /etc/ssc-ca/ca-bundle.crt{{- end }} -sf -o /dev/null "{{ include "tpa-prerequisites.issuerUrl" . }}/.well-known/openid-configuration"; do
                echo "OIDC endpoint not ready, retrying in 10s..."
                sleep 10
              done
              echo "OIDC endpoint is ready"
          {{- if .Values.oidc.caConfigMap }}
          volumeMounts:
            - name: ssc-ingress-ca
              mountPath: /etc/ssc-ca
              readOnly: true
          {{- end }}
      {{- if .Values.oidc.caConfigMap }}
      volumes:
        - name: ssc-ingress-ca
          configMap:
            name: {{ .Values.oidc.caConfigMap }}
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
      {{- end }}
