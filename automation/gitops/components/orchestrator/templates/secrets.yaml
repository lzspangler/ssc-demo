{{- $ns := .Values.namespace }}
# Connection secrets the CR's backendDatabase / temporalDatabase refs point
# at. Same single password as postgres.yaml -- see the note there.
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-postgres-backend
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
type: Opaque
stringData:
  host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
  port: "5432"
  database: "orchestrator"
  username: "orchestrator"
  password: {{ .Values.dbPassword | quote }}
  sslmode: "disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-postgres-temporal
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
type: Opaque
stringData:
  host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
  port: "5432"
  database: "temporal"
  username: "temporal"
  password: {{ .Values.dbPassword | quote }}
  sslmode: "disable"
