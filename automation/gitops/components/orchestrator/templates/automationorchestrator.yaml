{{- $ns := .Values.namespace }}
# The AutomationOrchestrator CR -- the piece that makes the operator actually
# deploy the platform (app pods, Route, admin secret). Everything downstream
# derives from metadata.name: the worker Deployment <crName>-worker, its
# service account <crName>-worker (the subject of the RBAC below), and the
# <crName>-initial-admin-password Secret the setup Job logs in with.
#
# Deliberately NO spec.imagePullSecrets: the operator's images come from
# registry.redhat.io, pulled via the cluster's global pull secret -- a
# reference to a Secret that does not exist would fail pod creation.
#
# Deliberately NO spec.secrets section: the operator auto-generates the
# initial admin password and the secret-encryption key when
# initialAdminPasswordSecretRef / secretEncryptionKeySecretRef are omitted.
---
apiVersion: aap.ansible.com/v1alpha1
kind: AutomationOrchestrator
metadata:
  name: {{ .Values.crName }}
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.instance | quote }}
spec:
  otel:
    enabled: false
  backgroundWorker:
    hpa:
      maxReplicas: 1
      minReplicas: 1
      targetCPUUtilization: 80
  ingress:
    type: Route
  postgres:
    port: 5432
    maxOverflow: 10
    backendDatabase:
      secretRef:
        name: orchestrator-postgres-backend
      host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
      sslMode: disable
    sslMode: disable
    poolTimeoutSeconds: 5
    poolSize: 20
    temporalDatabase:
      secretRef:
        name: orchestrator-postgres-temporal
      host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
      sslMode: disable
    host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
  redis:
    replicas: 1
