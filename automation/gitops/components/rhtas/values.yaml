# -----------------------------------------------------------------------------
# Red Hat Trusted Artifact Signer for ssc-demo.
#
# Vendored from redhat-ads-tech/ocp-app-platform-demo-helm v1.4.2 (`rhtas`):
# the operator Subscription (sync-wave 1) and a Securesign CR (sync-wave 2)
# that brings up Fulcio, Rekor, CTlog, Trillian, TSA and TUF.
#
# Removed from upstream: the `cosign-keygen` Job and its RBAC. That Job
# generated a cosign key pair and wrote it into Vault; ssc-demo has no Vault
# and signs keylessly against the Fulcio/Rekor instances below, so the key pair
# had no consumer.
#
# SET BEFORE INSTALLING: global.cluster.subdomain.
# -----------------------------------------------------------------------------

nameOverride: ""

global:
  cluster:
    # Apps subdomain of the target cluster, e.g. apps.cluster-abcde.example.com.
    # Used to derive the OIDC issuer; must match the keycloak component.
    subdomain: ""

rhtas-operator:
  name: rhtas-operator
  namespace: openshift-operators
  subscription:
    channel: stable
    installPlanApproval: Automatic
    name: rhtas-operator
    # The reference cluster pins `redhat-operators-snapshot`, a workshop-only
    # catalog. A stock cluster has `redhat-operators`.
    source: redhat-operators
    sourceNamespace: openshift-marketplace

trusted-artifact-signer:
  namespace: trusted-artifact-signer
  instance: securesign
  email: admin@rhdemo.com
  org: Parasol
  # Derived from global.cluster.subdomain as sso.<subdomain>/realms/backstage.
  # Set explicitly only if Keycloak lives somewhere else.
  oidc: ""
  realm: backstage
  oidcClientId: trusted-artifact-signer
