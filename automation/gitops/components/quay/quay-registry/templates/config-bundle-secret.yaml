---
# The Quay config bundle. The operator merges this over its own generated
# config, so only the settings that differ from Quay's defaults belong here.
#
# FEATURE_USER_INITIALIZE is what makes /api/v1/user/initialize available, and
# that endpoint is the only way to create the first superuser without a human
# at the config editor. It stops working the moment any user exists, which is
# also why the seeding job treats a 400 from it as "already done" rather than
# as a failure.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quay-registry.name" . }}-config-bundle
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.registry | quote }}
stringData:
  config.yaml: |-
    REGISTRY_TITLE: {{ .Values.quay.displayName | quote }}
    SERVER_HOSTNAME: {{ include "quay-registry.host" . }}
    EXTERNAL_TLS_TERMINATION: {{ .Values.quay.tls }}
    CREATE_PRIVATE_REPO_ON_PUSH: {{ .Values.quay.createPrivateRepoOnPush }}
    {{- if .Values.quay.configureAdmin }}
    SUPER_USERS:
    - {{ .Values.quay.adminUser }}
    FEATURE_USER_INITIALIZE: true
    {{- end }}
