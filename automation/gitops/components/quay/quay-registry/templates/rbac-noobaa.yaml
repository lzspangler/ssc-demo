{{- if .Values.noobaa.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quay-registry.name" . }}-noobaa
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.noobaa | quote }}
---
# The pre-flight job reads the NooBaa CR and patches the default BackingStore,
# both of which live in the ODF namespace, so the binding goes there.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quay-registry.name" . }}-noobaa
  namespace: {{ .Values.noobaa.namespace }}
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.noobaa | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: {{ include "quay-registry.name" . }}-noobaa
    namespace: {{ .Release.Namespace }}
{{- end }}
